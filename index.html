ent is defined for every real input.", "detail": "", "figure": {"type": "inverse", "fn": "tan", "value": 2, "mode": "compose", "order": "inverse-first"}, "source": "Lines 5329–5481"}, {"id": "i42", "chapter": "c7", "title": "Reversing the order needs more care", "connect": "Now begin with an angle rather than a measured value.", "body": "If an angle is already between $-\\pi/2$ and $\\pi/2$, sine measures its height and arcsine selects that very same angle. Outside this interval, arcsine selects a different angle on its chosen branch. It does not remember extra turns or the other side of the circle.", "math": ["\\arcsin(\\sin\\theta)=\\theta", "-\\frac{\\pi}{2}\\le\\theta\\le\\frac{\\pi}{2}"], "why": "The inverse returns the standard chosen angle, so the starting angle must already belong to that branch.", "detail": "", "figure": {"type": "inverse", "fn": "sin", "value": 0.5, "mode": "compose", "order": "forward-first"}, "source": "Lines 5329–5481"}, {"id": "i43", "chapter": "c7", "title": "A concrete example where cancellation fails", "connect": "Use the other angle with sine equal to one half.", "body": "The angle $5\\pi/6$ has sine $1/2$. Arcsine then receives only that height, not the original angle. Its standard answer for $1/2$ is $\\pi/6$. Therefore arcsine of sine does not return $5\\pi/6$ in this case.", "math": ["\\arcsin\\left(\\sin\\frac{5\\pi}{6}\\right)=\\arcsin\\frac12", "\\arcsin\\frac12=\\frac{\\pi}{6}"], "why": "A repeated output loses information about which original angle produced it.", "detail": "", "figure": {"type": "inverse", "fn": "sin", "value": 0.5, "mode": "compose", "order": "forward-first", "angle": 150}, "source": "Lines 5329–5481"}, {"id": "i44", "chapter": "c7", "title": "The cosine reverse rule uses its own branch", "connect": "The allowed starting angles are different for cosine.", "body": "Arccosine always returns an angle from $0$ to $\\pi$. Consequently, arccosine of cosine returns the original angle only when it was already in that interval. For instance, angles $\\pi/3$ and $-\\pi/3$ have the same cosine, but arccosine selects $\\pi/3$.", "math": ["\\arccos(\\cos\\theta)=\\theta\\quad(0\\le\\theta\\le\\pi)"], "why": "Each inverse uses its own selected angle interval.", "detail": "", "figure": {"type": "inverse", "fn": "cos", "value": 0.5, "mode": "compose", "order": "forward-first"}, "source": "Lines 5329–5481"}, {"id": "i45", "chapter": "c7", "title": "The tangent reverse rule excludes vertical angles", "connect": "Arctangent always selects a direction strictly inside the right half.", "body": "Arctangent of tangent returns the starting angle only between $-\\pi/2$ and $\\pi/2$. For example, tangent at $5\\pi/4$ is $1$, but arctangent of $1$ returns $\\pi/4$. The extra half-turn is not returned. At vertical directions tangent itself is undefined.", "math": ["\\arctan(\\tan\\theta)=\\theta", "-\\frac{\\pi}{2}<\\theta<\\frac{\\pi}{2}"], "why": "Tangent repeats after half-turns, while arctangent gives just one representative angle.", "detail": "", "figure": {"type": "inverse", "fn": "tan", "value": 1, "mode": "compose", "order": "forward-first", "angle": 225}, "source": "Lines 5329–5481"}, {"id": "i46", "chapter": "c7", "title": "Given a sine height, find the missing width", "connect": "We will derive a useful inverse-trig identity from one right triangle.", "body": "Let the given height be $z$, and choose $\\theta=\\arcsin z$. The circle point is on the right half, its radius is $1$, and its vertical coordinate is $z$. We want its horizontal coordinate, which is $\\cos\\theta$.", "math": ["\\theta=\\arcsin z\\quad\\Longrightarrow\\quad\\sin\\theta=z"], "why": "The unit-circle triangle contains the known height, the known radius and the missing width.", "detail": "", "figure": {"type": "special", "kind": "inverse-sin", "value": 0.6, "stage": "known"}, "source": "Lines 5483–5667"}, {"id": "i47", "chapter": "c7", "title": "Use Pythagoras on that right triangle", "connect": "The radius is the sloping side of a right triangle.", "body": "Pythagoras says that the two perpendicular sides, squared, add to the sloping side squared. Here those measurements are horizontal coordinate $\\cos\\theta$, vertical coordinate $z$, and radius $1$. Squaring also works when the vertical coordinate is negative, because its square is positive.", "math": ["(\\cos\\theta)^2+z^2=1^2"], "why": "We know the radius and height, so Pythagoras can determine the missing squared width.", "detail": "", "figure": {"type": "special", "kind": "inverse-sin", "value": 0.6, "stage": "triangle"}, "source": "Lines 5483–5667"}, {"id": "i48", "chapter": "c7", "title": "Subtract the known squared height", "connect": "We want the squared width by itself.", "body": "The left side currently contains the squared width plus $z^2$. Subtract $z^2$ from both sides. The remaining value, $1-z^2$, is the area of the square on the missing horizontal side. It is not yet the side length itself.", "math": ["(\\cos\\theta)^2=1-z^2"], "why": "Subtraction removes the part we already know and isolates the part we want.", "detail": "", "figure": {"type": "special", "kind": "inverse-area", "value": 0.6}, "source": "Lines 5483–5667"}, {"id": "i49", "chapter": "c7", "title": "A square gives a size, but not a direction", "connect": "Take the square root only after understanding what was squared.", "body": "If a number has square $1-z^2$, its possible values are $+\\sqrt{1-z^2}$ and $-\\sqrt{1-z^2}$. The circle shows both possibilities: two points can share height $z$, with one width pointing right and the other left. We still need the branch information.", "math": ["\\cos\\theta=\\pm\\sqrt{1-z^2}"], "why": "Squaring removes a sign; taking a root cannot restore that sign without extra information.", "detail": "", "figure": {"type": "special", "kind": "inverse-sin", "value": 0.6, "stage": "bothroots"}, "source": "Lines 5483–5667"}, {"id": "i50", "chapter": "c7", "title": "Arcsine tells us which root to choose", "connect": "Return to the highlighted right half of the circle.", "body": "The angle came from arcsine, so its point must be on the right half. Its horizontal coordinate is therefore nonnegative. Choose the positive square root; the negative root belongs to the reflected left-hand point. At the top or bottom, both roots are zero.", "math": ["\\cos\\theta\\ge0", "\\cos\\theta=\\sqrt{1-z^2}"], "why": "The geometric branch supplies the sign that the squared equation could not tell us.", "detail": "", "figure": {"type": "special", "kind": "inverse-sin", "value": 0.6, "stage": "chosen"}, "source": "Lines 5483–5667"}, {"id": "i51", "chapter": "c7", "title": "Put the angle’s name into the formula", "connect": "We found the width for the angle selected by arcsine.", "body": "Since $\\theta=\\arcsin z$, replace $\\theta$ by that expression in the cosine formula. This produces the identity below. It is valid whenever the input height exists on the unit circle, namely for $-1\\le z\\le1$.", "math": ["\\cos(\\arcsin z)=\\sqrt{1-z^2}", "-1\\le z\\le1"], "why": "Substitution connects the triangle result to the inverse-function notation.", "detail": "<p>For $z=3/5$, the squared width is $1-9/25=16/25$. Its nonnegative square root is $4/5$. Thus $\\cos(\\arcsin(3/5))=4/5$.<\/p>", "figure": {"type": "special", "kind": "inverse-sin", "value": 0.6, "stage": "formula"}, "source": "Lines 5483–5667"}, {"id": "i52", "chapter": "c7", "title": "Check negative heights and the endpoints", "connect": "The sign choice must work throughout the allowed input interval.", "body": "For height $-3/5$, the point moves below the horizontal axis but stays on the right half. Its width is still $4/5$. At height $1$ or $-1$, the remaining squared width is zero, so the point sits on the vertical axis.", "math": ["z=\\pm1\\quad\\Longrightarrow\\quad\\sqrt{1-z^2}=0"], "why": "Testing the boundaries confirms why the width is nonnegative, not always strictly positive.", "detail": "", "figure": {"type": "special", "kind": "inverse-sin", "value": -0.6, "stage": "endpoints"}, "source": "Lines 5483–5667"}, {"id": "i53", "chapter": "c7", "title": "Now start from a cosine width", "connect": "Use the same triangle reasoning with the known component swapped.", "body": "Let $\\theta=\\arccos z$. This means the horizontal coordinate is $z$, and the chosen angle lies on the upper half of the circle. We now want the vertical coordinate $\\sin\\theta$. It must be nonnegative because the point is on that upper half.", "math": ["\\cos\\theta=z", "\\sin\\theta\\ge0"], "why": "The arccosine branch tells us the sign of the missing height.", "detail": "", "figure": {"type": "special", "kind": "inverse-cos", "value": -0.6, "stage": "known"}, "source": "Lines 5483–5667"}, {"id": "i54", "chapter": "c7", "title": "Pythagoras isolates the missing squared height", "connect": "The radius is still one, and the known width is z.", "body": "Write width squared plus height squared equals radius squared. Then subtract $z^2$ from both sides. Taking a square root gives the size of the vertical coordinate. We choose the nonnegative root because arccosine selected the upper half.", "math": ["z^2+(\\sin\\theta)^2=1", "\\sin\\theta=\\sqrt{1-z^2}"], "why": "The algebra is the same as before; the selected circle half decides the root sign.", "detail": "", "figure": {"type": "special", "kind": "inverse-cos", "value": -0.6, "stage": "chosen"}, "source": "Lines 5483–5667"}, {"id": "i55", "chapter": "c7", "title": "The second root identity follows", "connect": "Replace the angle symbol by the inverse cosine that selected it.", "body": "We began with $\\theta=\\arccos z$, so substitute this into the sine expression. The result works for both positive and negative horizontal coordinates. At $z=1$ or $z=-1$, the point lies on the horizontal axis and the height is zero.", "math": ["\\sin(\\arccos z)=\\sqrt{1-z^2}", "-1\\le z\\le1"], "why": "The upper-half branch guarantees that the required sine is the nonnegative root.", "detail": "", "figure": {"type": "special", "kind": "inverse-cos", "value": -0.6, "stage": "formula"}, "source": "Lines 5483–5667"}, {"id": "i56", "chapter": "c7", "title": "Reflection swaps a sine height into a cosine width", "connect": "We now connect arcsine and arccosine directly.", "body": "Start with $\\theta=\\arcsin z$. Reflect its unit-circle point across the diagonal that swaps the coordinates. The old height $z$ becomes the new width $z$. Call the new angle $\\beta$ (beta). Its cosine is therefore $z$.", "math": ["\\cos\\beta=\\sin\\theta=z"], "why": "Swapping horizontal and vertical measurements links sine of one angle to cosine of another.", "detail": "", "figure": {"type": "unit", "angle": 30, "focus": "triangle", "compareAngle": 60, "relation": "complement"}, "source": "Lines 5483–5667"}, {"id": "i57", "chapter": "c7", "title": "Find the new angle and check its branch", "connect": "The coordinate-swapping reflection complements the angle.", "body": "The new angle is $\\beta=\\pi/2-\\theta$. Since arcsine gave $-\\pi/2\\le\\theta\\le\\pi/2$, this new angle lies between $0$ and $\\pi$. It is therefore exactly the upper-half angle selected by arccosine for the width $z$.", "math": ["\\beta=\\frac{\\pi}{2}-\\theta", "\\beta=\\arccos z"], "why": "Checking the angle interval lets us identify the reflected angle as the standard inverse cosine.", "detail": "", "figure": {"type": "unit", "angle": 30, "focus": "triangle", "compareAngle": 60, "relation": "complement"}, "source": "Lines 5483–5667"}, {"id": "i58", "chapter": "c7", "title": "The two inverse angles add to a quarter-turn", "connect": "Add the original angle to its complement.", "body": "Substitute $\\beta=\\pi/2-\\theta$ into $\\theta+\\beta$. The positive and negative copies of $\\theta$ cancel, leaving $\\pi/2$. Now use the names $\\theta=\\arcsin z$ and $\\beta=\\arccos z$. This derives the identity rather than asking you to memorise it.", "math": ["\\theta+\\beta=\\theta+\\frac{\\pi}{2}-\\theta=\\frac{\\pi}{2}", "\\arcsin z+\\arccos z=\\frac{\\pi}{2}"], "why": "The two selected angles are complementary, even when one is a negative directed angle.", "detail": "<p>The restriction is $-1\\le z\\le1$, so both inverse functions are defined.<\/p>", "figure": {"type": "unit", "angle": 30, "focus": "triangle", "compareAngle": 60, "relation": "complement"}, "source": "Lines 5483–5667"}, {"id": "i59", "chapter": "c7", "title": "A negative input still gives the same sum", "connect": "Treat angles as signed turns rather than only acute triangle corners.", "body": "For $z=-1/2$, arcsine returns $-\\pi/6$, a clockwise angle. Arccosine returns $2\\pi/3$, an angle on the upper-left part of the circle. Adding these directed angles gives $-\\pi/6+4\\pi/6=3\\pi/6=\\pi/2$.", "math": ["\\arcsin\\left(-\\frac12\\right)+\\arccos\\left(-\\frac12\\right)", "=-\\frac{\\pi}{6}+\\frac{2\\pi}{3}=\\frac{\\pi}{2}"], "why": "The identity includes negative inputs because its branch and sign reasoning still applies.", "detail": "", "figure": {"type": "unit", "angle": -30, "focus": "triangle", "compareAngle": 120, "relation": "complement"}, "source": "Lines 5483–5667"}, {"id": "i60", "chapter": "c7", "title": "Build an easy triangle for any slope z", "connect": "We next derive sine and cosine of an arctangent.", "body": "Tangent is rise divided by run. To make the slope equal to a given number $z$, choose run $1$ and signed rise $z$. The endpoint is $(1,z)$. Since it is always to the right, its angle lies on the arctangent branch.", "math": ["\\tan\\theta=\\frac z1=z", "\\theta=\\arctan z"], "why": "Choosing run one makes a triangle that represents any real slope directly.", "detail": "", "figure": {"type": "special", "kind": "inverse-tan", "value": 0.75, "stage": "triangle"}, "source": "Lines 5669–5894"}, {"id": "i61", "chapter": "c7", "title": "The arrow is called a vector", "connect": "Give the already-drawn displacement a compact name.", "body": "The arrow from the origin to $(1,z)$ means “move one unit right and $z$ units up”. We call this arrow the vector $\\mathbf v$. If $z$ is negative, the vertical move is downwards. The vector has the required direction, but its length is generally not one.", "math": ["\\mathbf v=(1,z)"], "why": "Vector notation records the two component movements of the same arrow.", "detail": "", "figure": {"type": "special", "kind": "inverse-tan", "value": 0.75, "stage": "vector"}, "source": "Lines 5669–5894"}, {"id": "i62", "chapter": "c7", "title": "Find the arrow’s length", "connect": "Its two perpendicular components form a right triangle.", "body": "Call the arrow’s length $L$. The horizontal component has magnitude $1$ and the vertical component has magnitude $|z|$. Pythagoras therefore gives $L^2=1^2+z^2$. Squaring $z$ works for a negative rise too, because a squared component is nonnegative.", "math": ["L^2=1^2+z^2=1+z^2"], "why": "We need the actual length before we can shrink the arrow to fit the unit circle.", "detail": "", "figure": {"type": "special", "kind": "inverse-tan", "value": 0.75, "stage": "length-square"}, "source": "Lines 5669–5894"}, {"id": "i63", "chapter": "c7", "title": "A length takes the nonnegative root", "connect": "The arrow cannot have a negative physical length.", "body": "Taking the square root gives $L=\\sqrt{1+z^2}$. This length is strictly positive because $1+z^2$ is at least one. The file also writes the length as $\\|\\mathbf v\\|$. Those double bars simply mean “the length of vector $\\mathbf v$”.", "math": ["L=\\|\\mathbf v\\|=\\sqrt{1+z^2}>0"], "why": "Knowing that the length is nonzero makes division by it valid.", "detail": "", "figure": {"type": "special", "kind": "inverse-tan", "value": 0.75, "stage": "length"}, "source": "Lines 5669–5894"}, {"id": "i64", "chapter": "c7", "title": "Shrink every part by the same factor", "connect": "We want the same direction, now on a circle of radius one.", "body": "The original arrow has length $L$. Multiply every component and every length by $1/L$. The new arrow length becomes $L\\times(1/L)=1$. Scaling both perpendicular components equally keeps their ratio, so it keeps the angle and places the endpoint on the unit circle.", "math": ["\\text{scale factor}=\\frac1L", "L\\times\\frac1L=1"], "why": "Equal scaling changes size without changing direction; this is called normalisation.", "detail": "", "figure": {"type": "special", "kind": "normalise", "value": 0.75, "stage": "scaling"}, "source": "Lines 5669–5894"}, {"id": "i65", "chapter": "c7", "title": "Read the two new coordinates", "connect": "Apply the scale factor separately to the run and rise.", "body": "The run $1$ becomes $1/L$. The rise $z$ becomes $z/L$. The length becomes $1$. Substitute $L=\\sqrt{1+z^2}$ into these two coordinates. They describe the same ray’s intersection with the unit circle.", "math": ["\\frac{\\mathbf v}{\\|\\mathbf v\\|}=\\left(\\frac1{\\sqrt{1+z^2}},\\frac z{\\sqrt{1+z^2}}\\right)"], "why": "We divide both coordinates by the original length, not only one of them.", "detail": "", "figure": {"type": "special", "kind": "normalise", "value": 0.75, "stage": "unit"}, "source": "Lines 5669–5894"}, {"id": "i66", "chapter": "c7", "title": "Check it with the file’s starting value", "connect": "Use z equal to three quarters to make the scaling concrete.", "body": "With $z=3/4$, the squared length is $1+9/16=25/16$, so the length is $5/4$. The scale factor is therefore $4/5$. The run becomes $4/5$ and the rise becomes $(3/4)(4/5)=3/5$. The new length is exactly one.", "math": ["L=\\sqrt{\\frac{25}{16}}=\\frac54", "(1,\\frac34)\\times\\frac45=\\left(\\frac45,\\frac35\\right)"], "why": "A numerical example shows that the same factor changes all three lengths together.", "detail": "", "figure": {"type": "special", "kind": "normalise", "value": 0.75, "stage": "numeric"}, "source": "Lines 5669–5894"}, {"id": "i67", "chapter": "c7", "title": "The new horizontal coordinate is cosine", "connect": "The endpoint now lies on the unit circle at the same angle.", "body": "On a unit circle, cosine is the horizontal coordinate. Our scaled run is $1/\\sqrt{1+z^2}$. The angle is still $\\theta=\\arctan z$, so this horizontal coordinate gives cosine of arctangent. It is positive because the original run was one unit to the right.", "math": ["\\cos(\\arctan z)=\\frac1{\\sqrt{1+z^2}}>0"], "why": "Normalising the triangle lets us read the trig values directly as coordinates.", "detail": "", "figure": {"type": "special", "kind": "normalise", "value": 0.75, "stage": "cos"}, "source": "Lines 5669–5894"}, {"id": "i68", "chapter": "c7", "title": "The new vertical coordinate is sine", "connect": "Use the other coordinate of that same unit-circle point.", "body": "The scaled rise is $z/\\sqrt{1+z^2}$. Sine is the signed vertical coordinate on the unit circle, so this is sine of the selected arctangent angle. No input restriction is needed: the construction works for every real slope $z$.", "math": ["\\sin(\\arctan z)=\\frac z{\\sqrt{1+z^2}}\\quad(z\\in\\mathbb R)"], "why": "The sign of the sine is the sign of the original rise.", "detail": "", "figure": {"type": "special", "kind": "normalise", "value": 0.75, "stage": "sin"}, "source": "Lines 5669–5894"}, {"id": "i69", "chapter": "c7", "title": "Negative slopes keep a positive width", "connect": "Reflect the construction below the horizontal axis.", "body": "If $z$ becomes negative, the endpoint moves below the axis. Its run remains positive and its rise becomes negative. The denominator $\\sqrt{1+z^2}$ remains positive. Therefore cosine of arctangent stays positive, while sine of arctangent changes sign with $z$.", "math": ["\\frac1{\\sqrt{1+z^2}}>0", "\\frac z{\\sqrt{1+z^2}}\\text{ has the sign of }z"], "why": "The formulas preserve exactly the directions visible in the triangle.", "detail": "", "figure": {"type": "special", "kind": "normalise", "value": -0.75, "stage": "unit"}, "source": "Lines 5669–5894"}, {"id": "i70", "chapter": "c7", "title": "For a positive slope, swap the run and rise", "connect": "The final derivation connects two reciprocal slopes.", "body": "Begin with $z>0$, so the angle $\\theta=\\arctan z$ is acute. The original triangle has run $1$ and rise $z$. Swap those components. The reflected triangle has run $z$ and rise $1$, so its slope is $1/z$.", "math": ["\\tan\\beta=\\frac1z"], "why": "Swapping the components turns a nonzero slope into its reciprocal.", "detail": "<p>The source illustrates this with a positive slope and reflection in the coordinate-swapping diagonal. The nonzero condition is necessary because $1/z$ must exist.<\/p>", "figure": {"type": "unit", "angle": 53.471144633, "focus": "triangle", "compareAngle": 36.528855367, "relation": "reciprocal-positive"}, "source": "Lines 5669–5894"}, {"id": "i71", "chapter": "c7", "title": "The reflected angle is the complement", "connect": "Both directions are acute because the original slope is positive.", "body": "The swapped triangle has angle $\\beta=\\pi/2-\\theta$. This angle is also between $0$ and $\\pi/2$, so it lies on the arctangent branch. Since its slope is $1/z$, it is exactly $\\arctan(1/z)$, rather than some angle differing by a half-turn.", "math": ["\\beta=\\frac{\\pi}{2}-\\theta", "\\beta=\\arctan\\left(\\frac1z\\right)"], "why": "Checking the branch makes the inverse-angle identification valid.", "detail": "", "figure": {"type": "unit", "angle": 53.471144633, "focus": "triangle", "compareAngle": 36.528855367, "relation": "reciprocal-positive"}, "source": "Lines 5669–5894"}, {"id": "i72", "chapter": "c7", "title": "Positive reciprocal slopes give a quarter-turn sum", "connect": "Add the two complementary angles.", "body": "We have $\\theta=\\arctan z$ and $\\beta=\\arctan(1/z)$, with $\\theta+\\beta=\\pi/2$. Substitute their inverse-function names into that sum. The condition $z>0$ matters: it is what made both selected angles positive and acute.", "math": ["\\arctan z+\\arctan\\left(\\frac1z\\right)=\\frac{\\pi}{2}", "z>0"], "why": "The identity is the angle sum of the original and component-swapped triangles.", "detail": "<p>For $z=1$, both angles are $\\pi/4$. Their sum is $\\pi/2$, exactly as the formula says.<\/p>", "figure": {"type": "unit", "angle": 53.471144633, "focus": "triangle", "compareAngle": 36.528855367, "relation": "reciprocal-positive"}, "source": "Lines 5669–5894"}, {"id": "i73", "chapter": "c7", "title": "Reflecting a slope reverses its angle", "connect": "To handle negative z, first establish the sign rule.", "body": "Reflection across the horizontal axis changes a positive rise into a negative rise while keeping the run positive. The selected angle changes from $\\theta$ to $-\\theta$. Since both angles stay on the arctangent branch, a negative input returns the negative of the corresponding positive-input angle.", "math": ["\\arctan(-a)=-\\arctan a"], "why": "The symmetry of the chosen branch makes arctangent an odd function.", "detail": "<p>“Odd function” here means the formula $f(-a)=-f(a)$. It has nothing to do with odd integers.<\/p>", "figure": {"type": "unit", "angle": 45, "focus": "signs", "compareAngle": -45, "relation": "odd"}, "source": "Lines 5669–5894"}, {"id": "i74", "chapter": "c7", "title": "Negative reciprocal slopes give a negative quarter-turn", "connect": "Apply the sign rule to both terms.", "body": "Write a negative input as $z=-a$, where $a>0$. Then $1/z=-1/a$. Both arctangents are the negatives of the positive-input angles. Their sum is therefore the negative of $\\pi/2$, which is $-\\pi/2$.", "math": ["\\arctan(-a)+\\arctan\\left(-\\frac1a\\right)", "=-\\frac{\\pi}{2}\\quad(a>0)"], "why": "Both directed angles are clockwise, so their total is a negative quarter-turn.", "detail": "", "figure": {"type": "unit", "angle": -53.471144633, "focus": "triangle", "compareAngle": -36.528855367, "relation": "reciprocal-negative"}, "source": "Lines 5669–5894"}, {"id": "i75", "chapter": "c7", "title": "Keep the sign condition and exclude zero", "connect": "The final result needs both cases to be complete.", "body": "For positive $z$, the sum is $\\pi/2$. For negative $z$, it is $-\\pi/2$. At $z=0$, the expression is undefined because it contains $1/z$. This condition comes from the reciprocal itself; arctangent of zero on its own is perfectly valid.", "math": ["\\arctan z+\\arctan(1/z)=\\frac\\pi2\\quad(z>0)", "\\arctan z+\\arctan(1/z)=-\\frac\\pi2\\quad(z<0)"], "why": "A correct general statement must include the sign and the excluded input.", "detail": "<p>The source ends with the negative-angle reflection and the two-case result. The reasoning used only unit-circle geometry, similarity, Pythagoras, reciprocal ratios and carefully selected inverse branches.<\/p>", "figure": {"type": "unit", "angle": -45, "focus": "signs", "compareAngle": -45, "relation": "reciprocal-negative"}, "source": "Lines 5669–5894"}, {"id": "code01", "chapter": "code", "title": "What the Python file actually builds", "connect": "", "body": "The file is an animation of <strong>seven connected mathematical chapters<\/strong>. Its final scene calls those chapters in order. The mathematics is taught in this HTML; this optional section explains how the drawing code supports it.", "math": [], "why": "The animation machinery controls what you see and when. It does not add extra trigonometric rules.", "figure": {"type": "wave", "fn": "sin", "angle": 30}, "source": "lines5896–5912", "detail": "The filename says V10, while the scene class retains V4 in its name. The comment at the top says this retained class name preserves the existing rendering workflow. The mathematical chapters are the seven functions called by construct()."}, {"id": "code02", "chapter": "code", "title": "A changing angle drives the whole drawing", "connect": "", "body": "The code stores an angle. When that angle changes, it recalculates the point, the radius, the horizontal measurement, the vertical measurement, and the labels. These are connected because they all use <strong>the same angle<\/strong>.", "math": ["P=(\\cos\\theta,\\sin\\theta)"], "why": "One shared angle prevents the circle point and its measurements from disagreeing.", "figure": {"type": "unit", "angle": 60, "focus": "triangle"}, "source": "lines166–266;687–689", "detail": "CircleRig is the collection of the circle, point, radius, projections and readouts. ValueTracker stores a changing number. An updater repeats a calculation while the animation is playing. stop() clears those updates when a picture should stay still."}, {"id": "code03", "chapter": "code", "title": "A mathematical unit is not a screen pixel", "connect": "", "body": "The unit circle has mathematical radius one, but the screen drawing can be any convenient size. The code multiplies a mathematical coordinate by a drawing scale, then adds the screen position of the centre.", "math": ["\\text{screen position}=\\text{centre}\\quad+\\text{scale}\\quad\\times\\text{mathematical coordinate}"], "why": "This lets the same mathematics appear larger or smaller without changing any value.", "figure": {"type": "unit", "angle": 30, "focus": "radius"}, "source": "lines34–40;251–266", "detail": "The vec and _point3 helpers store positions as three coordinates. Ordinary flat drawings have a third coordinate of zero. CircleRig uses cosine and sine as mathematical coordinates, then converts them to positions in the scene. The radius parameter in the drawing class is a screen scale, not a change to the unit-circle definition."}, {"id": "code04", "chapter": "code", "title": "A graph also needs a coordinate conversion", "connect": "", "body": "The graph has a smallest and largest input. To place an input, first measure how far it is above the minimum, then divide by the full input span. That fraction tells us how far across the drawing to move.", "math": ["\\text{fraction across}=\\frac{x-x_{\\min}}{x_{\\max}-x_{\\min}}"], "why": "Subtracting measures the distance from the start. Dividing converts that distance into a fraction of the available span.", "figure": {"type": "graph", "fn": "sin", "angle": 90}, "source": "lines269–326", "detail": "GraphBoard multiplies that fraction by its drawn width and adds the left edge. It uses the same idea for vertical coordinates. If equal_units is selected, one horizontal unit and one vertical unit have the same drawn length; this is essential when showing reflection in the diagonal y=x."}, {"id": "code05", "chapter": "code", "title": "Curves are drawn from many nearby samples", "connect": "", "body": "The code evaluates the function at many nearby inputs and joins the visible points. It splits the curve whenever a value is undefined or would jump through an excluded part of the graph.", "math": [], "why": "A line drawn across a tangent asymptote would falsely suggest that the function passes through that gap.", "figure": {"type": "graph", "fn": "tan", "xmin": 0, "xmax": 6.283185307179586, "ymin": -3.2, "ymax": 3.2}, "source": "lines108–163;1904–1940;3063–3112", "detail": "curve() creates separate finite pieces and clips them to the graph’s visible bounds. _finite_value catches failures such as division by zero or a value that is not finite. The reciprocal-wave helpers also treat the poles explicitly. A curve leaving the visible window is not automatically undefined: a large finite output may simply be off screen."}, {"id": "code06", "chapter": "code", "title": "The output circle matches the transformed graph", "connect": "", "body": "The transformed circle has centre height d and geometric radius |A|. Its moving point has height d + A sin θ. That is the same height as the point on the transformed sine graph.", "math": ["y=d+A\\sin\\theta"], "why": "Matching the vertical units allows a horizontal guide to connect the circle point directly to the graph point.", "figure": {"type": "transform", "A": 1.4, "k": 2, "phi": -0.6, "d": 0.3, "angle": 30, "active": "all", "fn": "sin"}, "source": "lines329–460", "detail": "OutputCircleRig separates signed scaling from physical radius. A negative A reverses the point through the centre, but the circle’s radius remains the positive quantity |A|. A=0 collapses the circle to a point. The cosine picture uses a quarter-turn phase offset so the horizontal unit-circle reading becomes the required output height."}, {"id": "code07", "chapter": "code", "title": "A copied label shows where a value came from", "connect": "", "body": "When a measured length is used in an equation, the animation sends a <strong>copy<\/strong> of its label toward the equation. The original stays visible. A replacement label disappears only when the incoming copy reaches it.", "math": [], "why": "The moving copy connects a number in the algebra with the measurement in the picture.", "figure": {"type": "pointmap", "A": 1.4, "k": 2, "phi": -0.6, "d": 0.3, "angle": 30}, "source": "lines463–478;563–638;694–741;816–1025", "detail": "carry and fly move copies. replace_label and _ContactCopy handle substitution at contact. text_courier_path plans a route that avoids visible text. These are presentation rules; the algebra is still justified by the mathematical derivation in the lesson."}, {"id": "code08", "chapter": "code", "title": "Why labels and guide lines have their own helpers", "connect": "", "body": "The file keeps labels readable, places them above other objects, and leaves small gaps where dashed guides would cross text. It also checks that important text stays inside the frame and that separate text blocks do not overlap.", "math": [], "why": "A correct equation is only useful when its symbols and diagram can be read clearly.", "figure": {"type": "wave", "fn": "sin", "angle": 45}, "source": "lines43–105;743–756", "detail": "_finish_label positions and outlines labels. plain makes ordinary words; mt makes mathematical text. segment hides truly zero-length segments. readable_dashes preserves a straight geometric guide while leaving clearance around labels. check examines the bounds of supplied blocks."}, {"id": "code09", "chapter": "code", "title": "Stages separate ideas; live updates connect them", "connect": "", "body": "The stage helper introduces a new section. The equation helper writes or replaces a calculation. The linked-graph helper keeps the graph point and its guide attached to the current circle reading.", "math": [], "why": "A new stage changes the teaching focus. A shared update keeps the mathematical connection intact while the point moves.", "figure": {"type": "wave", "fn": "cos", "angle": 60}, "source": "lines481–807;1136–1404", "detail": "The code also records timing marks, creates measurement tables, stores exact values, draws reference triangles, and freezes completed objects. It changes the pace for selected sections. These choices control the film, not the values of the trigonometric functions."}, {"id": "code10", "chapter": "code", "title": "Some code is there to prevent drawing errors", "connect": "", "body": "V10 keeps zero-angle arcs stable and unwraps arcs using their geometry. It also makes the renderer use the current children of moving objects, so a changing number does not leave old digits on screen.", "math": [], "why": "These fixes protect the picture while leaving the mathematical content and chapter order intact.", "figure": {"type": "radians", "angle": 180, "radius": 1}, "source": "lines10–16;200–219;373–393;503–514;4264–4309", "detail": "The imported toolkit supplies scene helpers. Font selection uses an available font. Colours distinguish measurements. At the end, updaters are cleared and the scene pauses. The later helper families build the exact tables, unit walls, wave projections, control markers, intervals, inverse branches and normalised vectors explained in the seven mathematical chapters."}];

const glossary=[
 ['radius','A straight-line distance from the centre of a circle to its edge. A unit circle has radius one.'],
 ['angle; θ (theta)','An amount of turning, measured from the positive horizontal direction. Anticlockwise is positive. θ is a name for that angle, not another length.'],
 ['coordinate','A signed position. A negative horizontal coordinate means left; a negative vertical coordinate means down. A physical distance itself is nonnegative.'],
 ['x','In the early circle construction, x labels the across coordinate. In the later function y=A sin(kx+φ)+d, x is the input to the rule. Each chapter makes the role explicit.'],
 ['y','The vertical coordinate, or the function’s output height. In a graph point (x,y), the input is written first.'],
 ['sin; sine','On the unit circle, the signed vertical coordinate. On a right triangle, opposite ÷ hypotenuse.'],
 ['cos; cosine','On the unit circle, the signed horizontal coordinate. On a right triangle, adjacent ÷ hypotenuse.'],
 ['tan; tangent','The ratio of the vertical coordinate to the horizontal coordinate: sin θ ÷ cos θ. It is undefined when cos θ=0.'],
 ['sec; secant','The reciprocal of cosine: 1 ÷ cos θ. In the unit-wall construction it is a signed scale factor.'],
 ['csc; cosecant','The reciprocal of sine: 1 ÷ sin θ. In the horizontal-wall construction it is a signed scale factor.'],
 ['cot; cotangent','cos θ ÷ sin θ. The expression 1 ÷ tan θ agrees only where both expressions are defined.'],
 ['function','A rule that gives one output for each permitted input. Different inputs may have the same output.'],
 ['radian','An angle measure: arc length divided by radius. One complete turn is 2π radians.'],
 ['π (pi)','The circumference of a circle divided by its diameter. Approximately 3.14159. It is a fixed number, not a variable.'],
 ['A','The signed multiplier applied to the sine or cosine reading. |A| is its size; negative A reflects the reading.'],
 ['k','The multiplier that converts a change in input into a change in angle. k is not generally the frequency in cycles per input unit.'],
 ['φ (phi)','The starting angle at input zero. It is measured in angle units; the corresponding horizontal shift is −φ/k when k≠0.'],
 ['d','The height added after scaling. For a nonconstant transformed sine or cosine wave, it is the midline height.'],
 ['h','The input where the inner angle is zero: h=−φ/k. It is a horizontal position.'],
 ['T; period','The least positive input distance after which a nonconstant wave repeats. For transformed sine or cosine, T=2π/|k|.'],
 ['frequency','Number of cycles per unit of input. It is 1/T. When the input is seconds, cycles per second are hertz (Hz).'],
 ['n; m; ℤ','n and m count whole turns or half-turn repeats. ℤ means all integers: …, −2, −1, 0, 1, 2, … . The lesson states what is being counted.'],
 ['ℓ and r; interval endpoints','The left and right input limits. A square bracket includes an endpoint; a round bracket excludes it. Here r labels an endpoint, not a circle radius.'],
 ['ℝ','All real numbers: positive, negative and zero, including fractions and irrational numbers.'],
 ['domain and range','Domain: the permitted inputs. Range: the outputs actually reached.'],
 ['α (alpha); β (beta)','Names for particular angles. They are introduced beside the angles they represent.'],
 ['λ (lambda); μ (mu)','Signed scale factors in the wall constructions. They multiply both coordinates of the original point.'],
 ['arcsin, arccos, arctan','Inverse trig functions. Each returns the one angle from a specified branch that gives the supplied reading.'],
 ['z','A supplied reading or slope in the inverse-function chapters. Its allowed values depend on the inverse being used.'],
 ['L','The length of the vector (1,z): L=√(1+z²). Dividing by L makes it a unit vector.'],
 ['asymptote','A line that a graph approaches. A vertical asymptote occurs where these quotient functions grow without bound as the input approaches an excluded angle.'],
 ['normalise','Divide every coordinate of a nonzero vector by its length. Its direction stays the same and its new length is one.'],
 ['first principles in this lesson','Start with distances, turns, coordinates, similarity and the area of a rectangle. The lesson supplies the Pythagorean area argument before using it, then derives the trig rules from those ideas.']
];
const state={page:'home',index:0,large:false,lab:'circle',angle:30,fn:'sin',A:1,k:1,phi:0,d:0,x:PI/6,value:.5,query:''};
let animFrame=0;
try{const saved=JSON.parse(localStorage.getItem('pem-trig-first-principles-v1')||'null');if(saved&&Number.isInteger(saved.index)&&saved.index>=0&&saved.index<slides.length)state.index=saved.index;if(saved?.large)state.large=true;}catch{}
const $=s=>document.querySelector(s);
function chapterOf(s){return chapters.find(c=>c.id===s.chapter)||chapters[0];}
function currentChapterSlides(){return slides.filter(s=>s.chapter===slides[state.index].chapter);}
function nav(){const s=slides[state.index],cs=currentChapterSlides(),at=cs.findIndex(t=>t.id===s.id);return `<nav class="nav no-print" aria-label="Lesson navigation"><button data-move="-1" ${state.index===0?'disabled':''}>← Back</button><span class="counter"><span>${esc(chapterOf(s).name)}</span>Step ${at+1} of ${cs.length}</span><button class="primary" data-move="1" ${state.index===slides.length-1?'disabled':''}>Next →</button></nav>`;}
function slidePanel(s,reading=false){return `<article class="card" id="step-${esc(s.id)}"><p class="kicker">${esc(chapterOf(s).name)}</p><h1 tabindex="-1">${esc(s.title)}</h1>${s.connect?`<p class="connect">${prose(s.connect)}</p>`:''}<figure class="single-figure">${diagram(s.figure||{})}${s.figure.caption?`<figcaption class="figcaption">${prose(s.figure.caption)}</figcaption>`:''}</figure><div class="copy"><div class="bodycopy">${prose(s.body)}</div>${formula(s.math)}${s.why?`<div class="reason"><b>Why this step?</b>${prose(s.why)}</div>`:''}${s.detail?`<details class="help" ${reading?'open':''}><summary>Explain that more slowly</summary><div class="details-content">${prose(s.detail)}</div></details>`:''}<details class="source"><summary>Connection to the supplied file</summary><p>${esc(s.source||'Supporting explanation for the mathematical content.')}. Source: geo5_trigonometry_act1_V10(2).py.</p></details></div></article>`;}
function homePage(){return `<article class="card cover"><p class="kicker">The complete maths in your animation file</p><h1>Trigonometry.<br><em>One clear step at a time.</em></h1><figure class="single-figure">${waveFigure({fn:'sin',angle:30,unit:'deg'})}</figure><div class="copy"><div class="bodycopy"><p><strong>Start with a moving point.</strong><br>Build the measurements. Then build the equations.</p><p>All seven chapters are here. Each step has one drawing, a short explanation and the reason for the calculation.</p></div><div class="button-row"><button class="primary" data-start>Start with the circle →</button>${state.index>0?'<button data-page="lesson">Continue where I stopped</button>':''}</div><div class="button-row"><button data-page="contents">Choose a chapter</button><button data-page="labs">Move the diagrams</button></div><p class="caption">Use Next at your own pace. Open “Explain that more slowly” whenever you need another explanation. No calculus is required for these seven chapters.</p></div></article>`;}
function indexPage(){const query=state.query.trim().toLowerCase();return `<article class="card"><h1>Find the bit you need</h1><p>Start at the first chapter, or choose the exact step that is confusing you.</p><label for="find-step" class="mini">Search a word, symbol name or idea</label><input id="find-step" class="search" type="search" placeholder="For example: radians, phase, inverse, square root…" value="${esc(state.query)}"><div id="index-results">${indexResults(query)}</div><div class="button-row"><button data-page="glossary">What do the symbols mean?</button><button data-page="coverage">What is included from the file?</button></div></article>`;}
function indexResults(q=''){return chapters.map(c=>{const ss=slides.filter(s=>s.chapter===c.id&&(!q||[s.title,s.body,s.connect,s.why,s.detail].join(' ').toLowerCase().includes(q)));if(!ss.length)return'';return `<details class="index-chapter" ${q?'open':''}><summary>${esc(c.name)} <span class="mini">(${ss.length} steps)</span></summary><p class="mini">${esc(c.desc)}</p><ol class="steps-list">${ss.map(s=>`<li><button data-step="${slides.indexOf(s)}">${esc(s.title)}<small>${esc(s.connect||'')}</small></button></li>`).join('')}</ol></details>`;}).join('')||'<p>No matching steps. Try “period”, “inverse” or “circle”.</p>';}
function glossaryPage(){return `<article class="card"><h1>Words and symbols, in plain language</h1><p>You can return to your current step at any time.</p><dl class="glossary">${glossary.map(([a,b])=>`<div><dt>${esc(a)}</dt><dd>${esc(b)}</dd></div>`).join('')}</dl></article>`;}
function coveragePage(){return `<article class="card"><h1>Everything covered by the file</h1><p>This lesson follows all seven mathematical chapters in <strong>geo5_trigonometry_act1_V10(2).py</strong>, with slower derivations and extra explanation.</p><ol class="chapter-list">${chapters.map(c=>`<li><button data-step="${slides.findIndex(s=>s.chapter===c.id)}"><strong>${esc(c.name)}</strong><span>${esc(c.desc)}</span></button></li>`).join('')}</ol><div class="reason"><b>How to use the source references</b>Each step has a small “Connection to the supplied file” section. Its line references point to the construction or equation being explained. Supporting explanations fill in the mathematical steps the animation assumes.</div><p>The original file’s scene calls chapters one through seven. The optional code section explains the drawing helpers without asking you to read or run Python.</p></article>`;}
const labNames={circle:'Move one circle point',walls:'Extend the radius to a wall',wave:'Copy a measurement to a graph',transform:'Change one wave control',solutions:'Find repeated answers',inverse:'Choose an inverse angle'};
function labsPage(){return `<article class="card"><h1>Move the diagrams yourself</h1><p>Choose one experiment. Its numbers and equations update together as you move a control.</p><ul class="chapter-list">${Object.entries(labNames).map(([k,v])=>`<li><button data-lab="${k}"><strong>${v}</strong></button></li>`).join('')}</ul></article>`;}
function slider(key,label,min,max,step,val,hint=''){return `<div class="control"><label for="control-${key}">${label}: <output id="read-${key}">${num(val)}</output></label><input id="control-${key}" data-control="${key}" type="range" min="${min}" max="${max}" step="${step}" value="${val}">${hint?`<small>${hint}</small>`:''}</div>`;}
function fnChoices(options){return `<div class="choice-row" aria-label="Function">${options.map(k=>`<button data-fn="${k}" class="${state.fn===k?'active':''}" aria-pressed="${state.fn===k}">${esc(k)}</button>`).join('')}</div>`;}
function labPage(){let controls='';if(['circle','walls','wave'].includes(state.lab))controls+=slider('angle','Turn in degrees',-360,720,1,state.angle,'Anticlockwise is positive; clockwise is negative.');if(state.lab==='walls')controls=fnChoices(['sec','tan','csc','cot'])+controls;if(state.lab==='wave')controls=fnChoices(['sin','cos'])+controls;
 if(state.lab==='transform')controls=fnChoices(['sin','cos'])+slider('x','Input x',-PI,TAU,.01,state.x,'The angle is calculated from this input: θ = kx + φ.')+slider('A','A — signed height multiplier',-2,2,.1,state.A)+slider('k','k — angle change per input unit',-3,3,.25,state.k)+slider('phi','φ — starting angle in radians',-PI,PI,.01,state.phi)+slider('d','d — added height',-2,2,.1,state.d);
 if(['solutions','inverse'].includes(state.lab))controls=fnChoices(['sin','cos','tan'])+slider('value',state.lab==='inverse'?'Reading supplied to the inverse':'Output to find',state.fn==='tan'?-5:-1,state.fn==='tan'?5:1,.05,state.value);
 return `<article class="card"><p class="kicker">Interactive experiment</p><h1>${esc(labNames[state.lab])}</h1><div id="lab-picture" class="lab-fig"></div><div class="copy"><div id="lab-readout" class="readout" aria-live="polite"></div>${controls}<div class="button-row"><button data-reset-lab>Reset this experiment</button><button data-page="labs">Choose another experiment</button></div><p class="caption">Return to your lesson to restore its original example.</p></div></article>`;}
function updateLab(){if(state.page!=='lab')return;const a=deg(state.angle),s=trig('sin',a),c=trig('cos',a);let f,lines=[],words='';
 if(state.lab==='circle'){f={type:'unit',angle:state.angle};lines=[`\\cos(${num(state.angle)}^\\circ)\\approx${num(c)}`,`\\sin(${num(state.angle)}^\\circ)\\approx${num(s)}`];words='Blue is the across coordinate. Green is the up coordinate. Both are signed positions.';}
 if(state.lab==='walls'){f={type:'walls',angle:state.angle,fn:state.fn};const val=trig(state.fn,a),den=['tan','sec'].includes(state.fn)?c:s;lines=[`\\${state.fn}(${num(state.angle)}^\\circ)${val===null?'\\text{ is undefined}':'\\approx'+num(val)}`];words=val===null?'The required denominator is zero. There is no finite wall intersection.':`The denominator is ${num(den)}. The reading is finite. ${Math.abs(val)>3?'The wall point is outside the visible window.':''}`;}
 if(state.lab==='wave'){f={type:'wave',fn:state.fn,angle:state.angle,unit:'deg'};const v=trig(state.fn,a);lines=[`\\${state.fn}(${num(state.angle)}^\\circ)\\approx${num(v)}`];words='The circle measurement becomes the height of the graph point. The graph’s horizontal position records the angle within this turn.';}
 if(state.lab==='transform'){const th=state.k*state.x+state.phi,y=state.A*trig(state.fn,th)+state.d;f={type:'transform',fn:state.fn,A:state.A,k:state.k,phi:state.phi,d:state.d,angle:th*180/PI,active:'all',input:state.x};lines=[`\\theta=(${num(state.k)})(${num(state.x)})+(${num(state.phi)})\\approx${num(th)}`,`y=(${num(state.A)})\\${state.fn}(${num(th)})+(${num(state.d)})\\approx${num(y)}`];words=state.A===0||state.k===0?`This is a constant function at height ${num(y)}. Its attained range contains just that height. It has no least positive period.`:`Amplitude ${num(Math.abs(state.A))}; midline ${num(state.d)}; period ${num(TAU/Math.abs(state.k))} input units; range from ${num(state.d-Math.abs(state.A))} to ${num(state.d+Math.abs(state.A))}.`;}
 if(state.lab==='solutions'){f={type:'families',fn:state.fn,value:state.value,mode:'graph'};const alpha=trig({sin:'asin',cos:'acos',tan:'atan'}[state.fn],state.value);lines=[`\\alpha\\approx${num(alpha)}\\text{ radians}`];if(state.fn==='sin')lines.push(`x=\\alpha+2n\\pi\\quad\\text{or}\\quad x=\\pi-\\alpha+2n\\pi`);if(state.fn==='cos')lines.push(`x=\\pm\\alpha+2n\\pi`);if(state.fn==='tan')lines.push(`x=\\alpha+n\\pi`);words='Every gold dot is an answer in the displayed interval. The integer n counts repeats in both directions. Coinciding answers are counted only once.';}
 if(state.lab==='inverse'){const name={sin:'arcsin',cos:'arccos',tan:'arctan'}[state.fn],v=trig({sin:'asin',cos:'acos',tan:'atan'}[state.fn],state.value);f={type:'inverse',fn:state.fn,value:state.value,mode:'branch'};lines=[`\\${name}(${num(state.value)})\\approx${num(v)}\\text{ radians}`,`\\${name}(${num(state.value)})\\approx${num(v*180/PI,2)}^\\circ`];words=state.fn==='sin'?'The chosen angle is between −π/2 and π/2, including both ends.':state.fn==='cos'?'The chosen angle is between 0 and π, including both ends.':'The chosen angle lies strictly between −π/2 and π/2. Neither endpoint is reached.';}
 $('#lab-picture').innerHTML=diagram(f);$('#lab-readout').innerHTML=formula(lines)+`<p>${prose(words)}</p>`;for(const key of ['angle','x','A','k','phi','d','value']){const e=$('#read-'+key);if(e)e.textContent=num(state[key]);}
}
function render(scroll=true){if(animFrame)cancelAnimationFrame(animFrame);animFrame=0;document.body.classList.toggle('large-text',state.large);$('#text-button').textContent=state.large?'Standard text':'Larger text';$('#text-button').setAttribute('aria-pressed',String(state.large));let html='';
 if(state.page==='home')html=homePage();else if(state.page==='lesson')html=nav()+slidePanel(slides[state.index])+nav()+`<div class="button-row no-print"><button data-page="contents">Choose a step</button><button data-page="glossary">Explain a symbol</button><button data-read-chapter>Read this chapter on one page</button></div>`;else if(state.page==='contents')html=indexPage();else if(state.page==='glossary')html=glossaryPage();else if(state.page==='coverage')html=coveragePage();else if(state.page==='labs')html=labsPage();else if(state.page==='lab')html=labPage();else if(state.page==='read')html=`<div class="button-row no-print"><button data-page="lesson">← Return to my step</button><button data-print>Print this chapter</button></div><div class="read-mode">${currentChapterSlides().map(s=>slidePanel(s,true)).join('')}</div>`;
 if(!['home','lesson','read'].includes(state.page))html=`<div class="button-row no-print"><button data-page="lesson">← Return to my step</button></div>`+html;
 $('#app').innerHTML=html;updateLab();$('#status').textContent=state.page==='lesson'?slides[state.index].title:state.page;try{localStorage.setItem('pem-trig-first-principles-v1',JSON.stringify({index:state.index,large:state.large}));}catch{}if(scroll)window.scrollTo({top:0,behavior:'instant'});
}
function goStep(n){state.index=Math.max(0,Math.min(slides.length-1,n));state.page='lesson';render();}
function chooseLab(which){state.lab=which;state.fn=which==='walls'?'sec':'sin';state.value=.5;state.page='lab';render();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.move)goStep(state.index+Number(b.dataset.move));else if(b.dataset.step!==undefined)goStep(Number(b.dataset.step));else if(b.hasAttribute('data-start'))goStep(0);else if(b.dataset.page){state.page=b.dataset.page;render();}else if(b.dataset.lab)chooseLab(b.dataset.lab);else if(b.dataset.fn){state.fn=b.dataset.fn;if(Math.abs(state.value)>1&&state.fn!=='tan')state.value=Math.sign(state.value);render(false);}else if(b.hasAttribute('data-read-chapter')){state.page='read';render();}else if(b.hasAttribute('data-print'))window.print();else if(b.hasAttribute('data-reset-lab')){Object.assign(state,{angle:30,A:1,k:1,phi:0,d:0,x:PI/6,value:.5});render(false);}else if(b.id==='text-button'){state.large=!state.large;render(false);}});
document.addEventListener('input',e=>{if(e.target.id==='find-step'){state.query=e.target.value;$('#index-results').innerHTML=indexResults(state.query.trim().toLowerCase());}if(e.target.dataset.control){state[e.target.dataset.control]=Number(e.target.value);updateLab();}});
document.addEventListener('keydown',e=>{if(e.target.closest('input,select,textarea,summary')||e.ctrlKey||e.metaKey||e.altKey)return;if(state.page==='lesson'&&e.key==='ArrowRight'){e.preventDefault();goStep(state.index+1);}if(state.page==='lesson'&&e.key==='ArrowLeft'){e.preventDefault();goStep(state.index-1);}if(e.key==='Escape'&&state.page!=='home'){state.page='lesson';render();}});
window.trigLesson={slides,chapters,state,diagram,formula,mathMarkup,unknownMath,slidePanel,goStep,render,updateLab,chooseLab,graphBoard,trig,piText};
render(false);
</script></body></html>
