<script>const PI=Math.PI,TAU=2*Math.PI;
const C={ink:'#172c3e',muted:'#607582',line:'#d8e1e5',blue:'#1761a1',teal:'#007d70',gold:'#987000',yellow:'#ffcf42',purple:'#7550a1',red:'#bf3045',paper:'#fffefa'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(v,p=3)=>Math.abs(v)<1e-10?'0':Number(v.toFixed(p)).toString().replace('-','−');
const deg=a=>a*PI/180;
const q0=v=>Math.abs(v)<1e-10?0:v;
const unknownMath=new Set();
function mathMarkup(tex,display=false){
 let i=0,s=String(tex??'');
 const symbols={pi:'π',theta:'θ',phi:'φ',varphi:'φ',alpha:'α',beta:'β',lambda:'λ',mu:'μ',omega:'ω',Delta:'Δ',ell:'ℓ',tau:'τ',infty:'∞',pm:'±',mp:'∓',times:'×',cdot:'·',div:'÷',le:'≤',leq:'≤',ge:'≥',geq:'≥',ne:'≠',neq:'≠',approx:'≈',in:'∈',notin:'∉',to:'→',mapsto:'↦',longmapsto:'↦',Rightarrow:'⇒',Longrightarrow:'⇒',Longleftrightarrow:'⇔',longleftrightarrow:'↔',iff:'⇔',implies:'⇒',cup:'∪',cap:'∩',subset:'⊂',equiv:'≡',circ:'°',degree:'°',ldots:'…',dots:'…',lvert:'|',rvert:'|',vert:'|',lbrace:'{',rbrace:'}',langle:'⟨',rangle:'⟩',emptyset:'∅'};
 const funcs=new Set(['sin','cos','tan','sec','csc','cot','arcsin','arccos','arctan','asin','acos','atan','min','max','log','ln','abs','sign']);
 function skip(){while(i<s.length&&/\s/.test(s[i]))i++;}
 function raw(){skip();if(s[i]!=='{')return s[i++]||'';i++;let depth=1,out='';while(i<s.length&&depth){const c=s[i++];if(c==='{')depth++;if(c==='}')depth--;if(depth)out+=c;}return out;}
 function group(){skip();if(s[i]==='{'){i++;const out=seq('}');return `<mrow>${out}</mrow>`;}return atom(true);}
 function atom(single=false){skip();if(i>=s.length)return '<mrow></mrow>';let c=s[i++];
  if(c==='{'){return `<mrow>${seq('}')}</mrow>`;}
  if(c==='\\'){
   let cmd='';if(/[A-Za-z]/.test(s[i]||'')){while(/[A-Za-z]/.test(s[i]||''))cmd+=s[i++];}else cmd=s[i++]||'';
   if(cmd==='frac'||cmd==='dfrac'||cmd==='tfrac')return `<mfrac>${group()}${group()}</mfrac>`;
   if(cmd==='sqrt'){let idx='';skip();if(s[i]==='['){i++;while(i<s.length&&s[i]!==']')idx+=s[i++];i++;}const a=group();return idx?`<mroot>${a}<mn>${esc(idx)}</mn></mroot>`:`<msqrt>${a}</msqrt>`;}
   if(['text','mathrm','operatorname','textrm'].includes(cmd))return `<mtext>${esc(raw().replace(/\\,/g,' ').replace(/\\ /g,' '))}</mtext>`;
   if(['mathbf','mathit','mathbb','mathcal'].includes(cmd)){const a=raw();if(cmd==='mathbb'&&/^[RZNQ]$/.test(a))return `<mi>${{R:'ℝ',Z:'ℤ',N:'ℕ',Q:'ℚ'}[a]}</mi>`;return `<mstyle mathvariant="${cmd==='mathbf'?'bold':cmd==='mathcal'?'script':'italic'}">${mathMarkup(a).replace(/^.*?<mrow>|<\/mrow><\/math>$/g,'')}</mstyle>`;}
   if(['left','right','big','Big','bigl','bigr','biggl','biggr'].includes(cmd)){skip();if(s[i]==='.') {i++;return '';}return atom();}
   if(['quad','qquad',',',';',' ','!'].includes(cmd))return `<mspace width="${cmd==='qquad'?'1':cmd==='quad'?'.6':cmd==='!'?'0':'.2'}em"></mspace>`;
   if(cmd==='overline')return `<mover>${group()}<mo>¯</mo></mover>`;
   if(cmd==='underbrace')return `<munder>${group()}<mo>⏟</mo></munder>`;
   if(funcs.has(cmd))return `<mi mathvariant="normal">${cmd}</mi>`;
   if(symbols[cmd])return `<${['pi','theta','phi','varphi','alpha','beta','lambda','mu','omega','ell','tau'].includes(cmd)?'mi':'mo'}>${symbols[cmd]}</${['pi','theta','phi','varphi','alpha','beta','lambda','mu','omega','ell','tau'].includes(cmd)?'mi':'mo'}>`;
   if(cmd==='|'||cmd==='lVert'||cmd==='rVert')return '<mo>‖</mo>';
   if(['{','}','%','_'].includes(cmd))return `<mo>${esc(cmd)}</mo>`;
   unknownMath.add(cmd);return `<mtext>${esc(cmd)}</mtext>`;
  }
  if(/[0-9.]/.test(c)){if(!single)while(/[0-9.]/.test(s[i]||''))c+=s[i++];return `<mn>${esc(c)}</mn>`;}
  if(/[A-Za-zα-ωΑ-Ω]/.test(c))return `<mi>${esc(c)}</mi>`;
  if(c==='~')return '<mspace width=".25em"></mspace>';
  return `<mo>${esc(c==='-'?'−':c)}</mo>`;
 }
 function seq(end){let out='';while(i<s.length){skip();if(end&&s[i]===end){i++;break;}if(i>=s.length)break;let a=atom();skip();let sub='',sup='';while(s[i]==='_'||s[i]==='^'){const op=s[i++],v=group();if(op==='_')sub=v;else sup=v;skip();}a=sub&&sup?`<msubsup>${a}${sub}${sup}</msubsup>`:sub?`<msub>${a}${sub}</msub>`:sup?`<msup>${a}${sup}</msup>`:a;out+=a;}return out;}
 return `<math xmlns="http://www.w3.org/1998/Math/MathML" display="${display?'block':'inline'}" aria-label="${esc(tex)}"><mrow>${seq()}</mrow></math>`;
}
function prose(s){return String(s||'').replace(/\$([^$]+)\$/g,(_,t)=>mathMarkup(t));}
function splitEquation(t){let parts=[],buf='',depth=0;for(let j=0;j<t.length;j++){const c=t[j];if(c==='{'&&t[j-1]!=='\\')depth++;if(c==='}'&&t[j-1]!=='\\')depth--;if(depth===0&&c==='='&&buf.trim()){parts.push(buf);buf='=';continue;}if(depth===0&&c==='\\'){const m=t.slice(j).match(/^\\(qquad|quad|Longrightarrow|Rightarrow|Longleftrightarrow)/);if(m){if(buf.trim())parts.push(buf);buf=['quad','qquad'].includes(m[1])?'':m[0];j+=m[0].length-1;continue;}}buf+=c;}if(buf.trim())parts.push(buf);return parts.length?parts:[t];}
function formula(lines){return (lines||[]).length?`<div class="mathbox">${lines.map(t=>`<div class="mathline">${splitEquation(t).map(p=>`<span class="eqpart">${mathMarkup(p)}</span>`).join('')}</div>`).join('')}</div>`:'';}
function S(tag,attrs={},inner=''){return `<${tag} ${Object.entries(attrs).filter(([k,v])=>v!==undefined&&v!==null).map(([k,v])=>`${k}="${esc(v)}"`).join(' ')}>${inner}</${tag}>`;}
function line(x1,y1,x2,y2,color=C.ink,width=3,extra={}){return S('line',{x1,y1,x2,y2,stroke:color,'stroke-width':width,'stroke-linecap':'round',...extra});}
function textAt(x,y,t,color=C.ink,size=23,extra={}){return S('text',{x,y,fill:color,'font-size':size,'font-weight':650,'text-anchor':'middle','paint-order':'stroke',stroke:C.paper,'stroke-width':5,'stroke-linejoin':'round',...extra},esc(t));}
function dot(x,y,color=C.ink,r=5,extra={}){return S('circle',{cx:x,cy:y,r,fill:color,stroke:C.paper,'stroke-width':2,...extra});}
function circle(cx,cy,r,color=C.ink,fill='none',width=2.5,extra={}){return S('circle',{cx,cy,r,fill,stroke:color,'stroke-width':width,...extra});}
function pathD(points){return points.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(3)},${p[1].toFixed(3)}`).join(' ');}
function path(points,color=C.ink,width=3,extra={}){return S('path',{d:pathD(points),fill:'none',stroke:color,'stroke-width':width,'stroke-linejoin':'round','stroke-linecap':'round',...extra});}
function polygon(points,fill,stroke=C.ink,width=2,extra={}){return S('polygon',{points:points.map(p=>p.join(',')).join(' '),fill,stroke,'stroke-width':width,...extra});}
function arc(cx,cy,r,a,b,color=C.gold,width=3){const n=Math.max(8,Math.ceil(Math.abs(b-a)*16));return path(Array.from({length:n+1},(_,i)=>[cx+r*Math.cos(a+(b-a)*i/n),cy-r*Math.sin(a+(b-a)*i/n)]),color,width);}
function svgFrame(body,title,view='0 0 760 500'){return `<svg xmlns="http://www.w3.org/2000/svg" class="lesson-svg" viewBox="${view}" role="img" aria-label="${esc(title)}"><title>${esc(title)}</title><defs><marker id="arrow-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="${C.muted}"/></marker></defs><rect width="760" height="500" rx="16" fill="${C.paper}"/>${body}</svg>`;}
function piText(x){if(Math.abs(x)<1e-9)return'0';for(let q=1;q<=12;q++){const p=Math.round(x*q/PI);if(Math.abs(x-p*PI/q)<1e-7){const sg=p<0?'−':'',ap=Math.abs(p);return sg+(ap===1?'':ap)+'π'+(q===1?'':'/'+q);}}return num(x,2);}
function trig(fn,x){const s=q0(Math.sin(x)),c=q0(Math.cos(x));if(fn==='sin')return s;if(fn==='cos')return c;if(fn==='tan')return c===0?null:s/c;if(fn==='cot')return s===0?null:c/s;if(fn==='sec')return c===0?null:1/c;if(fn==='csc')return s===0?null:1/s;if(fn==='asin')return Math.abs(x)<=1?Math.asin(x):null;if(fn==='acos')return Math.abs(x)<=1?Math.acos(x):null;if(fn==='atan')return Math.atan(x);return null;}
function graphBoard({left=75,right=700,top=65,bottom=395,xmin=0,xmax=TAU,ymin=-1.3,ymax=1.3,xticks,yticks,xlabel='angle',ylabel='output',equal=false,unit='rad'}={}){
 if(equal){const scale=Math.min((right-left)/(xmax-xmin),(bottom-top)/(ymax-ymin)),cx=(left+right)/2,cy=(top+bottom)/2;left=cx-(xmax-xmin)*scale/2;right=cx+(xmax-xmin)*scale/2;top=cy-(ymax-ymin)*scale/2;bottom=cy+(ymax-ymin)*scale/2;}
 const p=(x,y)=>[left+(x-xmin)/(xmax-xmin)*(right-left),bottom-(y-ymin)/(ymax-ymin)*(bottom-top)];
 if(!xticks){xticks=[];const dx=xmax-xmin;if(dx<=2.5){for(let x=Math.ceil(xmin*2)/2;x<=xmax+1e-8;x+=.5)xticks.push([x,num(x)]);}else{let st=PI/2;while(dx/st>8)st*=2;for(let x=Math.ceil(xmin/st)*st;x<=xmax+1e-8;x+=st)xticks.push([x,unit==='deg'?num(x*180/PI,0)+'°':piText(x)]);}}
 if(!yticks){yticks=[];let step=(ymax-ymin)>7?2:1;for(let y=Math.ceil(ymin/step)*step;y<=ymax+1e-8;y+=step)yticks.push([y,num(y)]);}
 let out='';for(const [x,label] of xticks){const X=p(x,0)[0];out+=line(X,top,X,bottom,C.line,1)+textAt(X,bottom+29,label,C.muted,18);}
 for(const [y,label] of yticks){const Y=p(0,y)[1];out+=line(left,Y,right,Y,C.line,1)+textAt(left-14,Y+6,label,C.muted,18,{'text-anchor':'end'});}
 const zy=Math.max(ymin,Math.min(ymax,0)),zx=Math.max(xmin,Math.min(xmax,0));out+=line(left,p(0,zy)[1],right,p(0,zy)[1],C.muted,1.5)+line(p(zx,0)[0],top,p(zx,0)[0],bottom,C.muted,1.5);
 out+=textAt((left+right)/2,top-24,ylabel,C.muted,21)+textAt((left+right)/2,bottom+67,xlabel,C.muted,21);
 return {p,out,left,right,top,bottom,xmin,xmax,ymin,ymax};
}
function graphCurve(g,fn,color=C.teal,width=3.5,start=g.xmin,end=g.xmax){
 let out='',pts=[],prev=null;const finish=()=>{if(pts.length>1)out+=path(pts,color,width);pts=[];};
 for(let i=0;i<=700;i++){const x=start+(end-start)*i/700,y=fn(x);const ok=y!==null&&Number.isFinite(y)&&y>=g.ymin&&y<=g.ymax;
 if(!ok){finish();prev=null;continue;}if(prev&&Math.abs(y-prev[1])>0.5*(g.ymax-g.ymin))finish();pts.push(g.p(x,y));prev=[x,y];}finish();return out;
}
function polesFor(fn,start,end,k=1,phi=0){if(!k)return[];let off;if(['tan','sec'].includes(fn))off=PI/2;else if(['cot','csc'].includes(fn))off=0;else return[];const a=Math.min(k*start+phi,k*end+phi),b=Math.max(k*start+phi,k*end+phi),out=[];for(let n=Math.ceil((a-off)/PI);n<=(b-off)/PI+1e-8;n++){const x=(off+n*PI-phi)/k;if(x>=start-1e-8&&x<=end+1e-8)out.push(x);}return out;}

 if(['inverse-sin','inverse-cos'].includes(f.kind))return inverseRootFigure(f);
 if(f.kind==='inverse-area')return inverseAreaFigure(f);
 if(['inverse-tan','normalise'].includes(f.kind))return inverseNormaliseFigure(f);
 return inverseBaseSpecial(f);
};
function inverseCompareFigure(f){
 const t=deg(f.angle??30),b=deg(f.compareAngle??60),rel=f.relation||'complement',cx=380,cy=203,R=122,p=a=>[cx+R*Math.cos(a),cy-R*Math.sin(a)];
 let o=textAt(380,30,rel==='odd'?'Reflection reverses the signed angle.':rel==='reciprocal-negative'?'Both selected angles are clockwise.':'Compare the two measured directions.',C.ink,24);
 o+=circle(cx,cy,R,C.line,'none',2)+line(cx-R-45,cy,cx+R+45,cy,C.muted,1.2)+line(cx,cy-R-35,cx,cy+R+35,C.muted,1.2);
 if(rel==='complement'||rel==='reciprocal-positive')o+=line(cx-140,cy+140,cx+140,cy-140,C.muted,1.4,{'stroke-dasharray':'6 6'});
 if(rel==='reciprocal-negative')for(const [a,c] of [[-t,C.gold],[-b,C.purple]])o+=line(cx,cy,...p(a),c,2,{'stroke-dasharray':'6 5',opacity:.3});
 for(const [a,c,r,label] of [[t,C.gold,36,'θ'],[b,C.purple,57,'β']]){
  const pp=p(a);o+=line(cx,cy,...pp,c,3.5)+dot(...pp,c,6)+arc(cx,cy,r,0,a,c,2.5);
  if(Math.abs(t-b)>1e-7||label==='θ')o+=textAt(cx+(R+29)*Math.cos(a),cy-(R+29)*Math.sin(a)+7,Math.abs(t-b)<1e-7?'θ = β':label,c,27);
 }
 o+=dot(cx,cy,C.ink,4)+textAt(230,370,inverseAngleEquation('θ',t),C.gold,24)+textAt(530,370,inverseAngleEquation('β',b),C.purple,24);
 if(rel==='odd'){
  o+=textAt(380,427,'same run; opposite signed rise',C.muted,24)+textAt(380,475,'arctan(−a) = −arctan(a)',C.ink,28);
 }else{
  const sx=350,sc=112,a=sx+sc*t,end=sx+sc*(t+b);
  o+=line(105,449,655,449,C.line,1.4)+inverseDirected(sx,405,a,C.gold)+line(a,405,a,433,C.muted,1.1,{'stroke-dasharray':'3 4'})+inverseDirected(a,433,end,C.purple)+line(end,433,end,450,C.ink,1.5)+dot(end,450,C.ink,5);
  o+=line(sx,441,sx,456,C.muted,1.2)+textAt(sx,481,'0',C.muted,20)+textAt(end,481,`${piText(t+b)}`,C.ink,24);
 }
 return svgFrame(o.replace(/<text\b[^>]*>\s*<\/text>/g,''),`Two angles theta ${t} and beta ${b} ${rel==='odd'?'are reflections across the horizontal axis':`have signed sum ${t+b}`}.`);
}
unitFigure = function(f={}){return f.relation?inverseCompareFigure(f):inverseBaseUnit(f);};

// At an extreme projection the two candidate directions coincide. Draw once.
const inverseBaseFamilies = familiesFigure;
familiesFigure = function(f={}) {
 const fn=f.fn||'sin',v=Number(f.value??.5);
 if(f.mode==='graph'||!['sin','cos'].includes(fn)||Math.abs(Math.abs(v)-1)>1e-12)return inverseBaseFamilies(f);
 const cx=380,cy=225,R=155,a=fn==='sin'?(v>0?PI/2:-PI/2):(v>0?0:PI),px=cx+R*Math.cos(a),py=cy-R*Math.sin(a);
 let o=circle(cx,cy,R,C.ink,'#fff5d3')+line(125,cy,635,cy,C.line,1.5)+line(cx,30,cx,420,C.line,1.5);
 if(fn==='sin')o+=line(130,cy-R*v,630,cy-R*v,C.teal,3)+textAt(640,cy-R*v+7,`up ${num(v)}`,C.teal,20,{'text-anchor':'start'});
 else o+=line(cx+R*v,30,cx+R*v,420,C.blue,3)+textAt(cx+R*v,449,`across ${num(v)}`,C.blue,22);
 o+=line(cx,cy,px,py,C.gold,3.5)+dot(px,py,C.gold,7)+dot(cx,cy,C.ink,4);
 o+=textAt(cx+(R+38)*Math.cos(a),cy-(R+38)*Math.sin(a)+7,piText(a<0?a+TAU:a),C.gold,22);
 o+=textAt(380,486,'At an extreme, both candidates are the same point.',C.muted,21);
 return svgFrame(o,`At ${fn} reading ${v}, the two candidate directions coincide at one point.`);
};

const slides=[{"id": "f001", "chapter": "c1", "title": "Start with a turning radius", "connect": "Everything in the first four chapters starts with this one circle.", "body": "The centre stays still. The marked point moves around the edge. The straight segment joining them is a <b>radius<\/b>. Its length stays the same while it turns. For now, look only at that movement; there is no formula to remember.", "math": [], "why": "A single moving point gives us several measurements. The trigonometric functions will be names for those measurements.", "detail": "", "figure": {"type": "unit", "angle": 30, "focus": "radius", "radius": 1, "intro": "circle"}, "source": "lines1406–1575"}, {"id": "f002", "chapter": "c1", "title": "What does the angle measure?", "connect": "We have a radius; now we need to describe how far it has turned.", "body": "Start with the radius pointing right. That is $0^\\circ$. Turn anticlockwise to make a positive angle. One quarter of a full turn is $90^\\circ$; one full turn is $360^\\circ$. The symbol $\\theta$, pronounced “theta”, means the amount of turn.", "math": ["\\theta=30^\\circ"], "why": "The angle is the input we choose. It is not a side length or the name of a point.", "detail": "", "figure": {"type": "unit", "angle": 30, "focus": "angle", "radius": 1, "intro": "angle"}, "source": "lines1406–1575"}, {"id": "f003", "chapter": "c1", "title": "Across first, then up", "connect": "The angle tells us where the point has turned; coordinates tell us where it is.", "body": "Call the centre $O$ and the moving point $P$. Starting at $O$, travel horizontally until you are underneath $P$, then vertically up to it. Call the horizontal measurement $x$ and the vertical measurement $y$. The pair $(x,y)$ records these two journeys in that order.", "math": ["P=(x,y)"], "why": "Two measurements locate a point in a flat diagram. The first is across; the second is up or down.", "detail": "", "figure": {"type": "unit", "angle": 30, "focus": "triangle", "radius": 1, "intro": "coordinates"}, "source": "lines1406–1575"}, {"id": "f004", "chapter": "c1", "title": "A right triangle appears", "connect": "The across-and-up journey has made two sides of a triangle.", "body": "The horizontal part meets the vertical part at a right angle. The third side is the original radius. Call the foot of the vertical line $F$. Now $OF$ is across, $FP$ is up, and $OP$ is the sloping radius.", "math": ["OF=x,\\qquad FP=y"], "why": "This right triangle connects circular motion to the side ratios used in ordinary right-triangle questions.", "detail": "", "figure": {"type": "unit", "angle": 30, "focus": "triangle", "radius": 1, "labels": "OPF", "intro": "triangle"}, "source": "lines1406–1575"}, {"id": "f005", "chapter": "c1", "title": "Why begin with radius one?", "connect": "We have three sides, but we can choose a convenient measurement unit.", "body": "A <b>unit circle<\/b> has radius $1$. Think of its radius as one measuring stick. The circle can be drawn large on the screen and still represent a radius of one unit. Its across and up measurements are now fractions of that one radius.", "math": ["OP=1"], "why": "Using one radius as the unit removes an unnecessary scale factor. Later we will show why any larger similar triangle gives the same ratios.", "detail": "", "figure": {"type": "unit", "angle": 30, "focus": "radius", "radius": 1}, "source": "lines1406–1575"}, {"id": "f006", "chapter": "c1", "title": "Cosine is the across reading", "connect": "The point already has an across measurement; now give that rule a name.", "body": "On the unit circle, <b>cosine<\/b> is the signed horizontal coordinate. At the chosen angle, measure how far across the point lies from the centre. That number is $\\cos\\theta$. The letters “cos” are one function name, not three quantities multiplied together.", "math": ["\\cos\\theta=x"], "why": "This is the geometric definition. We are naming an existing measurement, not inventing an unexplained formula.", "detail": "", "figure": {"type": "unit", "angle": 30, "focus": "x", "radius": 1, "intro": "cos"}, "source": "lines1406–1575"}, {"id": "f007", "chapter": "c1", "title": "Sine is the up reading", "connect": "Keep the same point and angle; now read its vertical measurement.", "body": "On the unit circle, <b>sine<\/b> is the signed vertical coordinate. Measure from the horizontal axis to the point. That number is $\\sin\\theta$. At an angle of $30^\\circ$, this height is $\\tfrac 12$; we will prove that exact value shortly.", "math": ["\\sin\\theta=y"], "why": "Sine and cosine describe the same point. They simply read different directions.", "detail": "", "figure": {"type": "unit", "angle": 30, "focus": "y", "radius": 1, "intro": "sin"}, "source": "lines1406–1575"}, {"id": "f008", "chapter": "c1", "title": "Two readings describe one point", "connect": "We have named both coordinates of the moving point.", "body": "The point’s across coordinate is $\\cos\\theta$ and its up coordinate is $\\sin\\theta$. Write them together in a coordinate pair. Whenever the file writes this pair, it means “go across by the first reading, then vertically by the second”.", "math": ["P=(\\cos\\theta,\\sin\\theta)"], "why": "The equation joins the previous two definitions. It does not add another rule to memorise.", "detail": "", "figure": {"type": "unit", "angle": 30, "focus": "triangle", "radius": 1, "intro": "both"}, "source": "lines1406–1575"}, {"id": "f009", "chapter": "c1", "title": "What if the radius is larger?", "connect": "The unit circle is convenient, but a triangle in a question may have any size.", "body": "Keep the angle the same and enlarge the whole triangle. Name its radius $r$, its across measurement $x$, and its up measurement $y$. All three lengths change by the same factor. The angles stay the same, so the original and enlarged triangles are similar.", "math": ["OP=r\\quad(r>0)"], "why": "Similar shapes have the same angles and proportional sides. This lets us compare measurements without being distracted by the size of the drawing.", "detail": "", "figure": {"type": "unit", "angle": 30, "focus": "triangle", "radius": 2, "showSymbols": true}, "source": "lines1406–1575"}, {"id": "f010", "chapter": "c1", "title": "Divide every side by the radius", "connect": "We want to turn the enlarged triangle back into a unit-radius triangle.", "body": "Divide <b>every<\/b> side by $r$. The radius becomes $r/r=1$. The across side becomes $x/r$, and the up side becomes $y/r$. The angle stays unchanged because all three sides receive the same scaling.", "math": ["(x,y,r)\\longmapsto\\left(\\frac{x}{r},\\frac{y}{r},1\\right)"], "why": "We divide by the radius specifically to make the sloping side equal to one. Then the two shorter sides become the unit-circle readings.", "detail": "", "figure": {"type": "unit", "angle": 30, "focus": "triangle", "radius": 2, "normalise": true}, "source": "lines1406–1575"}, {"id": "f011", "chapter": "c1", "title": "The sine ratio follows", "connect": "After scaling, the up coordinate is exactly the sine reading we defined.", "body": "The original up side had length $y$. After dividing the triangle by its radius $r$, that side has length $y/r$. Therefore sine is the up side divided by the radius. In a right triangle, these are called the opposite side and the hypotenuse.", "math": ["\\sin\\theta=\\frac{y}{r}=\\frac{\\text{opposite}}{\\text{hypotenuse}}"], "why": "“Opposite” means the side across from the marked angle. The hypotenuse is opposite the right angle.", "detail": "", "figure": {"type": "unit", "angle": 30, "focus": "y", "radius": 2, "showSymbols": true}, "source": "lines1406–1575"}, {"id": "f012", "chapter": "c1", "title": "The cosine ratio follows", "connect": "The same scaling argument works for the across side.", "body": "The original across side had length $x$. Dividing it by $r$ gives the unit-circle across reading. So cosine is the across side divided by the radius. This across side is adjacent to the marked angle; the sloping side is the hypotenuse.", "math": ["\\cos\\theta=\\frac{x}{r}=\\frac{\\text{adjacent}}{\\text{hypotenuse}}"], "why": "The adjacent side in this ratio means the side beside the marked angle that is not the hypotenuse.", "detail": "", "figure": {"type": "unit", "angle": 30, "focus": "x", "radius": 2, "showSymbols": true}, "source": "lines1406–1575"}, {"id": "f013", "chapter": "c1", "title": "Tangent means up per unit across", "connect": "Sine and cosine compare sides with the radius; tangent compares the two shorter sides.", "body": "Divide the up measurement by the across measurement. The result tells us how much the line rises for each one unit travelled across. This ratio is called <b>tangent<\/b>. The across measurement must not be zero, because division by zero has no defined result.", "math": ["\\tan\\theta=\\frac{y}{x}\\qquad(x\\ne0)"], "why": "For example, up 3 and across 4 gives a rise of 3/4 per one unit across. Doubling both measurements keeps that ratio unchanged.", "detail": "", "figure": {"type": "unit", "angle": 30, "focus": "ratio", "radius": 1}, "source": "lines1406–1575"}, {"id": "f014", "chapter": "c1", "title": "Why tangent is sine divided by cosine", "connect": "Both sine and cosine have already divided their measurements by the same radius.", "body": "Substitute the ratios we just found. Dividing $y/r$ by $x/r$ is the same as multiplying $y/r$ by $r/x$. The common factor $r$ cancels, leaving $y/x$, which is tangent. This explains the relationship instead of treating it as a separate fact.", "math": ["\\frac{\\sin\\theta}{\\cos\\theta}=\\frac{y/r}{x/r}=\\frac{y}{r}\\times\\frac{r}{x}", "\\frac{\\sin\\theta}{\\cos\\theta}=\\frac{y}{x}=\\tan\\theta"], "why": "We can cancel $r$ because the radius is positive; we can divide by $x$ only when it is nonzero.", "detail": "", "figure": {"type": "unit", "angle": 30, "focus": "ratio", "radius": 2, "showSymbols": true}, "source": "lines1406–1575"}, {"id": "f015", "chapter": "c1", "title": "A table records measurements", "connect": "Now that the readings have meanings, we can record them for several angles.", "body": "The Python first records sine, cosine and tangent at $0^\\circ$, $30^\\circ$, $45^\\circ$, $60^\\circ$ and $90^\\circ$. Many entries are rounded to two decimal places. A rounded decimal is a measurement approximation; later geometry will give exact fractions and square roots.", "math": ["\\cos30^\\circ\\approx0.87,\\qquad\\sin30^\\circ=0.5"], "why": "The table records the circle’s outputs. It does not explain why they have those values; that is the purpose of the exact-value constructions next.", "detail": "", "figure": {"type": "table", "kind": "exact", "measured": true}, "source": "lines1406–1575"}, {"id": "f016", "chapter": "c1", "title": "At ninety degrees, tangent has no value", "connect": "One entry in that table is different from all the numerical readings.", "body": "At $90^\\circ$, the point is directly above the centre. Across is $0$ and up is $1$. Tangent would require $1/0$. Division asks what number multiplied by the denominator gives the numerator. No number multiplied by zero gives one.", "math": ["\\cos90^\\circ=0,\\qquad\\sin90^\\circ=1", "\\tan90^\\circ\\text{ is undefined}"], "why": "“Undefined” means the rule gives no output at that input. It is not another name for zero or infinity.", "detail": "", "figure": {"type": "unit", "angle": 90, "focus": "ratio", "radius": 1}, "source": "lines1406–1575"}, {"id": "f017", "chapter": "c1", "title": "Left and down need negative signs", "connect": "So far the point has been right and up; the circle also goes left and down.", "body": "A coordinate records direction as well as size. Right is positive across; left is negative across. Up is positive vertically; down is negative vertically. An ordinary segment length stays positive, while its signed coordinate tells us which way to travel.", "math": ["\\text{left}:x<0,\\qquad\\text{down}:y<0"], "why": "This distinction lets sine and cosine describe every part of the circle, not just acute triangles.", "detail": "", "figure": {"type": "unit", "angle": 210, "focus": "signs", "radius": 1, "compareAngle": 30}, "source": "lines1406–1575"}, {"id": "f018", "chapter": "c1", "title": "The signs come from the picture", "connect": "Each quarter of the circle has a different pair of directions.", "body": "Top-right gives positive cosine and sine. Top-left gives negative cosine and positive sine. Bottom-left makes both negative. Bottom-right gives positive cosine and negative sine. Tangent’s sign comes from dividing sine by cosine: matching signs give positive; opposite signs give negative.", "math": [], "why": "No sign mnemonic is necessary if you can see whether the point lies left/right and above/below the centre.", "detail": "", "figure": {"type": "table", "kind": "signs"}, "source": "lines1406–1575"}, {"id": "f019", "chapter": "c1", "title": "The four axis positions", "connect": "The simplest readings happen when the radius lies exactly along an axis.", "body": "At $0^\\circ$ the point is $(1,0)$. At $90^\\circ$ it is $(0,1)$. At $180^\\circ$ it is $(-1,0)$. At $270^\\circ$ it is $(0,-1)$. Sine reads the second number, cosine the first; tangent divides the second by the first.", "math": [], "why": "Axis positions have no ordinary acute triangle, but the coordinate definitions still work. Tangent is undefined when the first coordinate is zero.", "detail": "", "figure": {"type": "unit", "angle": 270, "focus": "signs", "radius": 1, "cardinals": true}, "source": "lines1406–1575"}, {"id": "f020", "chapter": "c1", "title": "A whole turn repeats the readings", "connect": "Continue from the fourth axis position back to the starting point.", "body": "At $360^\\circ$ the point returns to $(1,0)$. Adding a full turn to any starting angle returns to the same position. Sine and cosine therefore repeat. The input angle has increased by a turn, but its circle coordinates are unchanged.", "math": ["P(\\theta+360^\\circ)=P(\\theta)"], "why": "This repeating motion is the reason the graphs later form waves.", "detail": "", "figure": {"type": "unit", "angle": 390, "focus": "triangle", "radius": 1, "compareAngle": 30}, "source": "lines1406–1575"}, {"id": "f021", "chapter": "c2", "title": "Build an exact triangle", "connect": "The decimal table was measured; now geometry will prove the special values.", "body": "Draw two radii of length $2$ with an angle of $60^\\circ$ between them. Join their endpoints. The two radii are equal, so the two angles at the endpoints are equal. We will use this triangle to find the exact measurements for $30^\\circ$.", "math": [], "why": "Choosing radius 2 makes the halved side equal 1. The choice is for easy arithmetic; the trigonometric ratios do not depend on the triangle’s size.", "detail": "", "figure": {"type": "special", "kind": "equilateral", "stage": "radii"}, "source": "lines1584–1783"}, {"id": "f022", "chapter": "c2", "title": "Why all three sides are two", "connect": "The triangle has two equal sides and a centre angle of sixty degrees.", "body": "A triangle’s angles total $180^\\circ$. Remove the centre angle of $60^\\circ$; the two remaining equal angles share $120^\\circ$. Each is therefore $60^\\circ$. All three angles are equal, so all three sides are equal. The joining side also has length $2$.", "math": ["\\frac{180^\\circ-60^\\circ}{2}=60^\\circ"], "why": "Equal angles face equal sides. This proves the joined side is 2 rather than assuming it from the drawing.", "detail": "", "figure": {"type": "special", "kind": "equilateral", "stage": "equal"}, "source": "lines1584–1783"}, {"id": "f023", "chapter": "c2", "title": "Cut the triangle into mirror halves", "connect": "The equilateral triangle has a line of symmetry through the centre vertex.", "body": "Draw that symmetry line perpendicular to the joined side. It divides the $60^\\circ$ angle into two $30^\\circ$ angles and the length-$2$ side into two length-$1$ pieces. Each half is a right triangle with hypotenuse $2$ and short leg $1$.", "math": ["60^\\circ\\div2=30^\\circ,\\qquad2\\div2=1"], "why": "The halves match by reflection, so both the angle and the opposite side are divided equally.", "detail": "", "figure": {"type": "special", "kind": "split30", "stage": "split"}, "source": "lines1584–1783"}, {"id": "f024", "chapter": "c2", "title": "Why does Pythagoras work?", "connect": "To find the remaining side, we need a relationship between a right triangle’s three sides.", "body": "Temporarily call the two perpendicular sides $a$ and $b$, and the sloping side $c$. A rectangle with sides $a$ and $b$ has area $ab$. A diagonal splits it into two equal right triangles. Each triangle therefore has area $ab/2$.", "math": ["\\text{triangle area}=\\frac{ab}{2}"], "why": "We start from areas so the next relationship is proved rather than quoted without explanation.", "detail": "", "figure": {"type": "special", "kind": "pythagoras", "stage": "area"}, "source": "lines1584–1783; supporting derivation"}, {"id": "f025", "chapter": "c2", "title": "Four triangles leave a square", "connect": "Use four copies of that same right triangle to compare two descriptions of one area.", "body": "Arrange the four triangles inside a large square of side $a+b$. Their sloping sides surround a central square of side $c$. The central corners are right angles because the two acute angles of a right triangle add to $90^\\circ$. The large area equals the four triangle areas plus the centre.", "math": ["(a+b)^2=4\\left(\\frac{ab}{2}\\right)+c^2"], "why": "Every part of the large square is counted exactly once: four non-overlapping triangles and the central square.", "detail": "", "figure": {"type": "special", "kind": "pythagoras", "stage": "assemble"}, "source": "lines1584–1783; supporting derivation"}, {"id": "f026", "chapter": "c2", "title": "The shared area cancels", "connect": "The same large square can also be expanded by multiplying its side lengths.", "body": "Expand $(a+b)(a+b)$ to get $a^2+2ab+b^2$. The four triangle areas total $2ab$. Subtract that same $2ab$ from both descriptions of the large area. What remains is the central square: $c^2=a^2+b^2$.", "math": ["a^2+2ab+b^2=2ab+c^2", "c^2=a^2+b^2"], "why": "Subtracting the triangles leaves only the areas of the squares on the three side lengths. This is Pythagoras for right triangles.", "detail": "", "figure": {"type": "special", "kind": "pythagoras", "stage": "cancel"}, "source": "lines1584–1783; supporting derivation"}, {"id": "f027", "chapter": "c2", "title": "Apply it to the thirty-degree triangle", "connect": "Return to our triangle with hypotenuse two and short leg one.", "body": "Call the unknown across side $x$. The two shorter sides are $x$ and $1$; the hypotenuse is $2$. Substitute these specific lengths into the relationship we just proved. The square of the sloping side equals the sum of the other two squares.", "math": ["x^2+1^2=2^2"], "why": "We use Pythagoras because this is a right triangle and two of its side lengths are known.", "detail": "", "figure": {"type": "special", "kind": "split30", "stage": "split"}, "source": "lines1584–1783"}, {"id": "f028", "chapter": "c2", "title": "Subtract the known square", "connect": "We want the part of the hypotenuse square that is left after the known leg square.", "body": "Squaring means multiplying a number by itself. So $1^2=1$ and $2^2=4$. Our equation becomes $x^2+1=4$. Subtract $1$ from both sides to leave the unknown square on its own.", "math": ["x^2+1=4", "x^2=4-1=3"], "why": "The added 1 is removed by subtracting 1. Doing the same operation to both sides preserves equality.", "detail": "", "figure": {"type": "special", "kind": "split30", "stage": "square"}, "source": "lines1584–1783"}, {"id": "f029", "chapter": "c2", "title": "Undo the square", "connect": "We know the square on the unknown side has area three; we want its side length.", "body": "The square-root symbol asks for the nonnegative number whose square gives the number underneath. Thus $\\sqrt 3$ is exactly the positive number whose square is $3$. Our side is a positive length, so $x=\\sqrt 3$. This is exact, even though its decimal expansion does not end.", "math": ["x=\\sqrt3"], "why": "Solving $x^2=3$ as an abstract equation gives two signed possibilities. Geometry chooses the positive one because x here is an ordinary side length.", "detail": "", "figure": {"type": "special", "kind": "split30", "stage": "solved"}, "source": "lines1584–1783"}, {"id": "f030", "chapter": "c2", "title": "Read sine of thirty degrees", "connect": "All three side lengths are now known, so read the required ratio.", "body": "For the marked $30^\\circ$ angle, the opposite side is $1$ and the hypotenuse is $2$. Sine compares those two sides. Divide the opposite length by the hypotenuse length; nothing else needs to be calculated.", "math": ["\\sin30^\\circ=\\frac{1}{2}"], "why": "This proves the height 0.5 seen earlier on the unit circle: scale the radius 2 triangle down by a factor of 2.", "detail": "", "figure": {"type": "special", "kind": "split30", "focus": "sin", "stage": "solved"}, "source": "lines1584–1783"}, {"id": "f031", "chapter": "c2", "title": "Read cosine of thirty degrees", "connect": "Keep the same triangle and angle; only the chosen shorter side changes.", "body": "The side adjacent to $30^\\circ$ is $\\sqrt 3$. The hypotenuse remains $2$. Cosine compares adjacent with hypotenuse, so divide $\\sqrt 3$ by $2$. This is the exact across coordinate after scaling the triangle to radius one.", "math": ["\\cos30^\\circ=\\frac{\\sqrt3}{2}"], "why": "The approximate table entry 0.87 is a rounded version of this exact value.", "detail": "", "figure": {"type": "special", "kind": "split30", "focus": "cos", "stage": "solved"}, "source": "lines1584–1783"}, {"id": "f032", "chapter": "c2", "title": "Read tangent of thirty degrees", "connect": "Tangent compares the two shorter sides, so the hypotenuse is not needed.", "body": "The opposite side is $1$ and the adjacent side is $\\sqrt 3$. Divide up by across. The result $1/\\sqrt 3$ is already an exact and correct answer. The source then rewrites it in another equivalent form.", "math": ["\\tan30^\\circ=\\frac{1}{\\sqrt3}"], "why": "This ratio is the rise per unit horizontal run of the 30° line.", "detail": "", "figure": {"type": "special", "kind": "split30", "focus": "tan", "stage": "solved"}, "source": "lines1584–1783"}, {"id": "f033", "chapter": "c2", "title": "Why multiply by a square root?", "connect": "The source changes the appearance of the tangent fraction without changing its value.", "body": "Multiply numerator and denominator by $\\sqrt 3$. That multiplies the whole fraction by $\\sqrt 3/\\sqrt 3=1$, so its value stays unchanged. The denominator becomes $\\sqrt 3\\times\\sqrt 3=3$. This process is called rationalising the denominator.", "math": ["\\frac{1}{\\sqrt3}\\times\\frac{\\sqrt3}{\\sqrt3}=\\frac{\\sqrt3}{3}"], "why": "The two forms 1/√3 and√3/3 are equal. Rationalising is a choice of exact form, not a new measurement.", "detail": "", "figure": {"type": "special", "kind": "split30", "focus": "tan", "stage": "solved"}, "source": "lines1584–1783"}, {"id": "f034", "chapter": "c2", "title": "Sixty degrees swaps the two legs", "connect": "The other acute angle in the same right triangle is sixty degrees.", "body": "The right angle uses $90^\\circ$ of the triangle’s $180^\\circ$. Subtract the remaining $30^\\circ$ angle, leaving $60^\\circ$. Looking from that angle swaps which leg is opposite and which is adjacent. The lengths are still $1$, $\\sqrt 3$ and $2$.", "math": ["180^\\circ-90^\\circ-30^\\circ=60^\\circ"], "why": "Changing the chosen angle changes the words opposite and adjacent, not the actual side lengths.", "detail": "", "figure": {"type": "special", "kind": "split30", "angle": 60, "focus": "swap", "stage": "solved"}, "source": "lines1584–1783"}, {"id": "f035", "chapter": "c2", "title": "Read the sixty-degree ratios", "connect": "Use the same definitions with the opposite and adjacent sides exchanged.", "body": "For $60^\\circ$, opposite is $\\sqrt 3$ and adjacent is $1$, while hypotenuse is $2$. Sine is opposite divided by hypotenuse; cosine is adjacent divided by hypotenuse. Tangent is opposite divided by adjacent, so it is $\\sqrt 3/1=\\sqrt 3$.", "math": ["\\sin60^\\circ=\\frac{\\sqrt3}{2},\\qquad\\cos60^\\circ=\\frac12", "\\tan60^\\circ=\\sqrt3"], "why": "This is why sine 30 equals cosine 60, and cosine 30 equals sine 60.", "detail": "", "figure": {"type": "special", "kind": "split30", "angle": 60, "focus": "ratios", "stage": "solved"}, "source": "lines1584–1783"}, {"id": "f036", "chapter": "c2", "title": "Scale back to radius one", "connect": "The exact triangle has radius two; the original circle uses radius one.", "body": "Divide every side by $2$. The radius becomes $1$, the across measurement at $60^\\circ$ becomes $1/2$, and the up measurement becomes $\\sqrt 3/2$. The angle is unchanged, and every ratio stays unchanged because both numerator and denominator scale together.", "math": ["P(60^\\circ)=\\left(\\frac12,\\frac{\\sqrt3}{2}\\right)"], "why": "This connects the triangle proof directly back to the unit-circle coordinates.", "detail": "", "figure": {"type": "unit", "angle": 60, "focus": "triangle", "radius": 1}, "source": "lines1584–1783"}, {"id": "f037", "chapter": "c2", "title": "Build the forty-five-degree triangle", "connect": "A different symmetric triangle gives the next exact angle.", "body": "Make a right triangle whose two shorter sides both have length $1$. Equal sides face equal angles. The two acute angles share $90^\\circ$, so each is $45^\\circ$. Call the unknown sloping side $r$.", "math": ["90^\\circ\\div2=45^\\circ"], "why": "We may choose equal legs of length 1 because scaling does not change the ratios.", "detail": "", "figure": {"type": "special", "kind": "45", "stage": "legs"}, "source": "lines1584–1783"}, {"id": "f038", "chapter": "c2", "title": "Find its sloping side", "connect": "The triangle is right angled and both perpendicular sides are known.", "body": "Pythagoras says the square of the hypotenuse equals the two leg squares added together. Each leg is $1$, so their squares total $2$. The hypotenuse is the positive length whose square is $2$, namely $\\sqrt 2$.", "math": ["r^2=1^2+1^2=2", "r=\\sqrt2"], "why": "As before, the square root turns a known square area back into its side length.", "detail": "", "figure": {"type": "special", "kind": "45", "stage": "solved"}, "source": "lines1584–1783"}, {"id": "f039", "chapter": "c2", "title": "Read the forty-five-degree ratios", "connect": "The two shorter sides are equal, so sine and cosine will match.", "body": "Each shorter side is $1$ and the hypotenuse is $\\sqrt 2$. Both sine and cosine are therefore $1/\\sqrt 2$. Tangent compares the equal legs: $1/1=1$. The line rises one unit for every one unit across.", "math": ["\\sin45^\\circ=\\cos45^\\circ=\\frac1{\\sqrt2}", "\\tan45^\\circ=1"], "why": "The equality of sine and cosine comes from the triangle’s symmetry.", "detail": "", "figure": {"type": "special", "kind": "45", "stage": "solved"}, "source": "lines1584–1783"}, {"id": "f040", "chapter": "c2", "title": "Write the familiar exact form", "connect": "The source rewrites the two matching ratios without changing them.", "body": "Multiply $1/\\sqrt 2$ by $\\sqrt 2/\\sqrt 2$, which equals $1$. The denominator becomes $2$, so the fraction is $\\sqrt 2/2$. Scaling the whole triangle by $1/\\sqrt 2$ gives a unit hypotenuse and two coordinates of that same value.", "math": ["\\frac1{\\sqrt2}=\\frac{\\sqrt2}{2}", "P(45^\\circ)=\\left(\\frac{\\sqrt2}{2},\\frac{\\sqrt2}{2}\\right)"], "why": "Both exact forms represent the same number. The rewritten form is useful in a standard exact-value table.", "detail": "", "figure": {"type": "special", "kind": "45", "stage": "unit"}, "source": "lines1584–1783"}, {"id": "f041", "chapter": "c2", "title": "A reference angle gives the size", "connect": "Exact acute triangles can also describe points in the other quarters of the circle.", "body": "The <b>reference angle<\/b> is the small angle between the radius and the nearest horizontal direction. Call it $\\alpha$, pronounced “alpha”. Reflections keep the triangle’s side lengths the same. We use this small angle to find the sizes, then use direction to decide their signs.", "math": ["|x|=\\cos\\alpha,\\qquad|y|=\\sin\\alpha"], "why": "The vertical bars mean magnitude, which is nonnegative. The actual coordinates may be negative.", "detail": "", "figure": {"type": "special", "kind": "reference", "angle": 150, "reference": 30}, "source": "lines1584–1783"}, {"id": "f042", "chapter": "c2", "title": "One hundred and fifty degrees", "connect": "This point lies thirty degrees above the left-pointing horizontal direction.", "body": "Its reference angle is $180^\\circ-150^\\circ=30^\\circ$. The across size is $\\sqrt 3/2$ and the up size is $1/2$. The point is left and above the centre: cosine is negative, sine positive, and tangent negative because its numerator and denominator have opposite signs.", "math": ["\\cos150^\\circ=-\\frac{\\sqrt3}{2},\\quad\\sin150^\\circ=\\frac12", "\\tan150^\\circ=-\\frac{\\sqrt3}{3}"], "why": "The 30° triangle supplies the sizes. Left/up supplies the signs. These are two separate decisions.", "detail": "", "figure": {"type": "special", "kind": "reference", "angle": 150, "reference": 30}, "source": "lines1584–1783"}, {"id": "f043", "chapter": "c2", "title": "Two hundred and ten degrees", "connect": "Reflect the same reference triangle into the bottom-left quarter.", "body": "The reference angle is $210^\\circ-180^\\circ=30^\\circ$. Both coordinates are negative because the point is left and below the centre. Tangent is positive because a negative number divided by a negative number is positive. The sizes remain the same as at $30^\\circ$.", "math": ["\\cos210^\\circ=-\\frac{\\sqrt3}{2},\\quad\\sin210^\\circ=-\\frac12", "\\tan210^\\circ=\\frac{\\sqrt3}{3}"], "why": "A reflection changes directions but preserves ordinary lengths.", "detail": "", "figure": {"type": "special", "kind": "reference", "angle": 210, "reference": 30}, "source": "lines1584–1783"}, {"id": "f044", "chapter": "c2", "title": "Three hundred and thirty degrees", "connect": "Move the same reference triangle into the bottom-right quarter.", "body": "The reference angle is $360^\\circ-330^\\circ=30^\\circ$. This time the point is right and below the centre. Cosine is positive and sine negative, so tangent is negative. Again, the small 30° triangle provides the unchanged magnitudes.", "math": ["\\cos330^\\circ=\\frac{\\sqrt3}{2},\\quad\\sin330^\\circ=-\\frac12", "\\tan330^\\circ=-\\frac{\\sqrt3}{3}"], "why": "You can recover these values from the diagram without memorising a separate table for every quadrant.", "detail": "", "figure": {"type": "special", "kind": "reference", "angle": 330, "reference": 30}, "source": "lines1584–1783"}, {"id": "f045", "chapter": "c2", "title": "Why sine and cosine stay between minus one and one", "connect": "The point always remains on a circle whose radius is one.", "body": "The point can be at most one unit to the right or left, and at most one unit above or below the centre. Since cosine is across and sine is vertical, neither reading can exceed $1$ or be below $-1$. The endpoints occur at the axis positions.", "math": ["-1\\le\\cos\\theta\\le1", "-1\\le\\sin\\theta\\le1"], "why": "These are limits on coordinates, not restrictions on the input angle. The angle can keep turning indefinitely.", "detail": "", "figure": {"type": "unit", "angle": 150, "focus": "bounds", "radius": 1}, "source": "lines1584–1783"}, {"id": "f046", "chapter": "c3", "title": "Another measurement from the same circle", "connect": "We now know the two coordinates; the source builds three more named readings.", "body": "Keep the unit circle and choose $60^\\circ$. Its across coordinate is $\\cos 60^\\circ=1/2$. Draw a straight vertical line one unit to the right of the centre, labelled $x=1$. Think of this line as a wall that an enlarged copy of the radius must reach.", "math": ["\\cos60^\\circ=\\frac12"], "why": "We start with a known half-unit measurement so the needed scaling is visible.", "detail": "", "figure": {"type": "walls", "angle": 60, "fn": "sec", "mode": "scale", "stage": "half"}, "source": "lines2357–2470 and2555–2701"}, {"id": "f047", "chapter": "c3", "title": "Double the radius to reach the wall", "connect": "The original across reading is one half, while the wall is one unit across.", "body": "Multiply the whole radius-and-triangle picture by $2$. The across part grows from $1/2$ to $1$. The up part and sloping part also double. The enlarged endpoint now reaches the wall. Its sloping length is $2$ because the original radius was $1$.", "math": ["\\frac12\\times2=1"], "why": "One common scale factor preserves the angle. We are not stretching the horizontal part separately.", "detail": "", "figure": {"type": "walls", "angle": 60, "fn": "sec", "mode": "scale", "stage": "double"}, "source": "lines2357–2470 and2555–2701"}, {"id": "f048", "chapter": "c3", "title": "Name the wall intersection", "connect": "The enlarged radius meets the wall at a definite point.", "body": "Call the intersection $T$. The original unit-radius endpoint is still $P$. At this example angle, $T$ is obtained by multiplying both coordinates of $P$ by $2$. The ordinary distance from $O$ to $T$ is also $2$.", "math": ["T=2P,\\qquad OT=2"], "why": "Multiplying a coordinate pair by 2 means multiplying both coordinates by 2. The point remains on the same straight line through the centre.", "detail": "", "figure": {"type": "walls", "angle": 60, "fn": "sec", "stage": "pointT"}, "source": "lines2357–2470 and2555–2701"}, {"id": "f049", "chapter": "c3", "title": "Use a scale factor for any angle", "connect": "The factor will not always be two, so give it a name.", "body": "Call the required scale factor $\\lambda$, pronounced “lambda”. The original across coordinate is $\\cos\\theta$. After scaling, it is $\\lambda\\cos\\theta$. Reaching the wall means this coordinate must equal $1$. That gives an equation for the unknown factor.", "math": ["\\lambda\\cos\\theta=1"], "why": "This equation comes from the wall’s position. The 1 is its across coordinate, not a number added without reason.", "detail": "", "figure": {"type": "walls", "angle": 38, "fn": "sec", "stage": "lambda"}, "source": "lines2357–2470 and2555–2701"}, {"id": "f050", "chapter": "c3", "title": "Divide to find the scale factor", "connect": "The unknown factor is multiplied by the known across reading.", "body": "Provided $\\cos\\theta$ is nonzero, divide both sides by it. The factor becomes $1/\\cos\\theta$. This scale factor is called <b>secant<\/b>, written $\\sec\\theta$. At $60^\\circ$, it equals $1/(1/2)=2$, matching the construction.", "math": ["\\lambda=\\frac1{\\cos\\theta}=\\sec\\theta"], "why": "Division undoes multiplication. We divide by the across reading because that is what multiplies the unknown scale factor.", "detail": "", "figure": {"type": "walls", "angle": 38, "fn": "sec", "stage": "lambda"}, "source": "lines2357–2470 and2555–2701"}, {"id": "f051", "chapter": "c3", "title": "What does reciprocal mean?", "connect": "Secant has appeared as one divided by cosine.", "body": "The <b>reciprocal<\/b> of a nonzero number is the number that multiplies it to make $1$. The reciprocal of $1/2$ is $2$; the reciprocal of $2$ is $1/2$. Secant is the reciprocal of cosine wherever cosine is nonzero.", "math": ["\\cos\\theta\\times\\sec\\theta=1\\qquad(\\cos\\theta\\ne0)"], "why": "“Reciprocal” names the scaling relationship we have just constructed geometrically.", "detail": "", "figure": {"type": "walls", "angle": 60, "fn": "sec", "stage": "double"}, "source": "lines2357–2470 and2555–2701"}, {"id": "f052", "chapter": "c3", "title": "The wall height is tangent", "connect": "The across coordinate reached one; the up coordinate was multiplied by the same factor.", "body": "The original up coordinate is $\\sin\\theta$. Multiplying it by $\\sec\\theta=1/\\cos\\theta$ gives $\\sin\\theta/\\cos\\theta$, which is tangent. So the wall intersection is one unit across and $\\tan\\theta$ vertically.", "math": ["T_y=\\frac{\\sin\\theta}{\\cos\\theta}=\\tan\\theta", "T=(1,\\tan\\theta)"], "why": "The subscript y means the point’s vertical coordinate. This tangent-line construction explains the name “tangent”.", "detail": "", "figure": {"type": "walls", "angle": 38, "fn": "tan"}, "source": "lines2357–2470 and2555–2701"}, {"id": "f053", "chapter": "c3", "title": "At ninety degrees the wall is never reached", "connect": "Rotate the same line until the radius points straight up.", "body": "The radius line is now vertical, just like the wall $x=1$. The two lines are parallel, so they do not meet. Its across coordinate is zero, and multiplying zero by any finite scale still gives zero. Both secant and tangent are undefined here.", "math": ["\\cos90^\\circ=0", "\\sec90^\\circ\\text{ and }\\tan90^\\circ\\quad\\text{are undefined}"], "why": "The missing intersection and the zero denominator describe the same failure in geometric and algebraic language.", "detail": "", "figure": {"type": "walls", "angle": 90, "fn": "sec"}, "source": "lines2357–2470 and2555–2701"}, {"id": "f054", "chapter": "c3", "title": "A negative scale reverses direction", "connect": "Keep rotating into the top-left quarter while the wall stays to the right.", "body": "The directed radius points left, but its full straight line can reach the right-hand wall in the opposite direction. The required scale factor is negative. A negative scale reverses the direction. The secant reading is signed; an ordinary distance cannot be negative.", "math": ["OT=|\\sec\\theta|"], "why": "The vertical bars mean magnitude. For example, a secant value of−2 corresponds to an ordinary segment length 2.", "detail": "", "figure": {"type": "walls", "angle": 145, "fn": "sec"}, "source": "lines2357–2470 and2555–2701"}, {"id": "f055", "chapter": "c3", "title": "Try a horizontal wall", "connect": "A second wall will create the same idea from the vertical coordinate.", "body": "Choose $30^\\circ$, where the unit-circle height is $\\sin 30^\\circ=1/2$. Draw a horizontal line one unit above the centre, labelled $y=1$. Doubling the entire radius makes the height grow from one half to one, so its copy meets this wall.", "math": ["\\frac12\\times2=1"], "why": "This is the same scaling idea as secant, now using up instead of across.", "detail": "", "figure": {"type": "walls", "angle": 30, "fn": "csc", "mode": "scale", "stage": "double"}, "source": "lines2357–2470 and2555–2701"}, {"id": "f056", "chapter": "c3", "title": "Derive the cosecant factor", "connect": "Give the new scale factor a different name so the two constructions stay distinct.", "body": "Call this factor $\\mu$, pronounced “mu”. To reach height 1 it must satisfy $\\mu\\sin\\theta=1$. Divide by the nonzero sine reading to find $\\mu=1/\\sin\\theta$. This is <b>cosecant<\/b>, written $\\csc\\theta$ or $\\operatorname{cosec}\\theta$.", "math": ["\\mu\\sin\\theta=1", "\\mu=\\frac1{\\sin\\theta}=\\csc\\theta"], "why": "The factor is found by undoing multiplication, exactly as for secant. The abbreviations csc and cosec mean the same function.", "detail": "", "figure": {"type": "walls", "angle": 65, "fn": "csc", "stage": "mu"}, "source": "lines2357–2470 and2555–2701"}, {"id": "f057", "chapter": "c3", "title": "Find the other coordinate of the intersection", "connect": "Both coordinates are multiplied by the new cosecant factor.", "body": "Call the intersection with the top wall $U$. Its vertical coordinate is $1$. Its across coordinate becomes $(1/\\sin\\theta)\\cos\\theta=\\cos\\theta/\\sin\\theta$. These two readings locate U. The ordinary distance from the centre is the magnitude of the cosecant reading.", "math": ["U=\\left(\\frac{\\cos\\theta}{\\sin\\theta},1\\right)", "OU=|\\csc\\theta|"], "why": "The coordinate pair says across first, then up. We use an absolute value for the ordinary distance because the scale may be negative.", "detail": "", "figure": {"type": "walls", "angle": 65, "fn": "csc"}, "source": "lines2357–2470 and2555–2701"}, {"id": "f058", "chapter": "c3", "title": "When the top wall cannot be reached", "connect": "A horizontal radius is parallel to the horizontal wall.", "body": "At $180^\\circ$, the sine reading is zero. No finite multiplier can turn that zero height into height 1. Therefore the full radius line never meets the wall $y=1$, and cosecant has no value. The same issue occurs at every whole half-turn.", "math": ["\\sin180^\\circ=0", "\\csc180^\\circ\\text{ is undefined}"], "why": "The forbidden inputs arise from zero height, not from the circle point failing to exist.", "detail": "", "figure": {"type": "walls", "angle": 180, "fn": "csc"}, "source": "lines2357–2470 and2555–2701"}, {"id": "f059", "chapter": "c3", "title": "Below the centre, cosecant is negative", "connect": "The point can continue below the horizontal axis even though the wall remains above it.", "body": "Below the centre, sine is negative. Its reciprocal is therefore negative too. The full straight line reaches the wall by reversing the directed radius. Cosecant records that signed scaling; the physical distance from the centre to the wall remains positive.", "math": ["\\csc\\theta<0,\\qquad OU=|\\csc\\theta|"], "why": "Separating direction from distance keeps the geometry meaningful in every quadrant.", "detail": "", "figure": {"type": "walls", "angle": 230, "fn": "csc"}, "source": "lines2357–2470 and2555–2701"}, {"id": "f060", "chapter": "c3", "title": "The horizontal wall reading is cotangent", "connect": "The top-wall construction has also produced a new horizontal reading.", "body": "On the line $y=1$, measure horizontally from the vertical axis to $U$. Its signed value is $\\cos\\theta/\\sin\\theta$. Name this <b>cotangent<\/b>, written $\\cot\\theta$. It measures across per one unit up, the reversed comparison from tangent.", "math": ["\\cot\\theta=\\frac{\\cos\\theta}{\\sin\\theta}\\qquad(\\sin\\theta\\ne0)"], "why": "The quotient is U’s horizontal coordinate, so it already has a visible geometric meaning.", "detail": "", "figure": {"type": "walls", "angle": 45, "fn": "cot"}, "source": "lines2357–2470 and2555–2701"}, {"id": "f061", "chapter": "c3", "title": "Why cotangent can be one over tangent", "connect": "We can now connect the two quotients by ordinary fraction division.", "body": "When sine and cosine are both nonzero, tangent is $\\sin\\theta/\\cos\\theta$. Taking its reciprocal exchanges numerator and denominator. The result is $\\cos\\theta/\\sin\\theta$, exactly the cotangent ratio we just built.", "math": ["\\frac1{\\tan\\theta}=\\frac1{\\sin\\theta/\\cos\\theta}=\\frac{\\cos\\theta}{\\sin\\theta}=\\cot\\theta"], "why": "Both sine and cosine must be nonzero in this particular chain: tangent must exist, and its value must also be nonzero.", "detail": "", "figure": {"type": "walls", "angle": 60, "fn": "cot"}, "source": "lines2357–2470 and2555–2701"}, {"id": "f062", "chapter": "c3", "title": "Cotangent at ninety degrees is zero", "connect": "The reciprocal shortcut needs care at angles where tangent itself has no value.", "body": "At $90^\\circ$, the top-wall intersection is directly above the centre. Its horizontal reading is zero. The definition gives $\\cot 90^\\circ=0/1=0$. Tangent is undefined at this same angle, so do not try to evaluate cotangent using one divided by tangent here.", "math": ["\\cot90^\\circ=\\frac{\\cos90^\\circ}{\\sin90^\\circ}=\\frac01=0"], "why": "A zero output and an undefined output are different. The definition cos/sin gives cotangent on its full allowed domain.", "detail": "", "figure": {"type": "walls", "angle": 90, "fn": "cot"}, "source": "lines2357–2470 and2555–2701"}, {"id": "f063", "chapter": "c3", "title": "The three reciprocal pairs", "connect": "We have now constructed all six named readings from the same circle.", "body": "Sine pairs with cosecant, cosine pairs with secant, and tangent pairs with cotangent. Each pair has product 1 wherever both functions are defined. The table groups the matching pairs together so each reciprocal is attached to the measurement that produced it.", "math": ["\\sin\\theta\\,\\csc\\theta=1,\\qquad\\cos\\theta\\,\\sec\\theta=1", "\\tan\\theta\\,\\cot\\theta=1"], "why": "For the first product require sine≠0; for the second require cosine≠0; for the third require both. Cancelling a zero denominator is not allowed.", "detail": "", "figure": {"type": "table", "kind": "reciprocal"}, "source": "lines2357–2470 and2555–2701"}, {"id": "f064", "chapter": "c3", "title": "Angles can be any real numbers", "connect": "The drawings have used special angles, but the input need not be a whole number.", "body": "An angle can be $42.5^\\circ$, a negative turn, an irrational number of radians, or several full turns. The symbol $\\mathbb R$ means all real numbers, and $\\in$ means “belongs to”. Sine and cosine accept every real angle because a circle point exists for every turn.", "math": ["\\theta\\in\\mathbb R"], "why": "The input set is called the domain. The four quotient functions have some excluded angles because their denominators can be zero.", "detail": "", "figure": {"type": "unit", "angle": 42.5, "focus": "angle", "radius": 1}, "source": "lines2357–2470 and2555–2701"}, {"id": "f065", "chapter": "c3", "title": "Keep the missing values missing", "connect": "The six readings share a picture, but they do not all exist at every angle.", "body": "When cosine is zero, tangent and secant are undefined. When sine is zero, cotangent and cosecant are undefined. Sine and cosine themselves remain defined. The source deliberately hides a missing reading instead of inventing a very large numerical value for it.", "math": ["\\cos\\theta=0:\\quad\\tan\\theta,\\sec\\theta\\text{ undefined}", "\\sin\\theta=0:\\quad\\cot\\theta,\\csc\\theta\\text{ undefined}"], "why": "This distinction will determine the gaps in the graphs next.", "detail": "", "figure": {"type": "table", "kind": "reciprocal", "showDomains": true}, "source": "lines2357–2470 and2555–2701"}, {"id": "f066", "chapter": "c4", "title": "Turn the moving height into a graph", "connect": "The circle supplies readings; a graph records them against their input angles.", "body": "On the graph, the horizontal axis is the angle. The vertical axis is the output. At $30^\\circ$, the point’s height is $1/2$, so place a graph point $30^\\circ$ across and $1/2$ up. Call this new graph point $G$.", "math": ["G=(30^\\circ,\\tfrac12)"], "why": "The circle’s horizontal coordinate and the graph’s horizontal input mean different things. Only the height is copied in the sine graph.", "detail": "", "figure": {"type": "wave", "fn": "sin", "angle": 30, "unit": "deg"}, "source": "lines2703–3155"}, {"id": "f067", "chapter": "c4", "title": "The sine curve is a height record", "connect": "Repeat the same copying process as the angle increases.", "body": "As the radius turns, move right along the graph by the input angle and copy the circle point’s height. Every recorded point has coordinates $(\\theta,\\sin\\theta)$. The continuous record is the graph $y=\\sin\\theta$. The curve comes from the circular motion.", "math": ["G=(\\theta,\\sin\\theta)", "y=\\sin\\theta"], "why": "The sine wave is not a shape chosen separately. It is what the changing heights draw when recorded in order.", "detail": "", "figure": {"type": "wave", "fn": "sin", "angle": 150, "unit": "deg"}, "source": "lines2703–3155"}, {"id": "f068", "chapter": "c4", "title": "Five points explain one sine wave", "connect": "The axis positions give easy checkpoints for that record.", "body": "Sine starts at 0, reaches 1 after a quarter-turn, returns to 0 after a half-turn, reaches−1 after three quarters, and returns to 0 after one full turn. Between those checkpoints the circle moves smoothly, so its height record is smooth too.", "math": ["0\\ \\to\\ 1\\ \\to\\ 0\\ \\to\\ -1\\ \\to\\ 0"], "why": "The matching inputs are 0°,90°,180°,270°,360°. The reference triangles also give 150°→1/2 and 210° or 330°→−1/2.", "detail": "", "figure": {"type": "wave", "fn": "sin", "angle": 360, "unit": "deg", "landmarks": true}, "source": "lines2703–3155"}, {"id": "f069", "chapter": "c4", "title": "Cosine records the across measurement", "connect": "The second graph records the other coordinate of the same moving point.", "body": "A graph always places the chosen output vertically. For cosine, that output is the circle’s signed across measurement. At angle $\\theta$, the graph point is $(\\theta,\\cos\\theta)$. We therefore copy the circle’s horizontal measurement onto the graph’s vertical output axis.", "math": ["G=(\\theta,\\cos\\theta)"], "why": "A measured quantity does not have to be physically vertical in the original diagram to be plotted vertically on a graph.", "detail": "", "figure": {"type": "wave", "fn": "cos", "angle": 30, "unit": "deg"}, "source": "lines2703–3155"}, {"id": "f070", "chapter": "c4", "title": "A quarter-turn changes across into height", "connect": "The source makes that change visible by rotating a copy of the radius.", "body": "Rotate the radius anticlockwise by $90^\\circ$ to a new point $Q$. A horizontal right-pointing component turns into an upward component of the same size. More generally, a quarter-turn changes coordinates $(x,y)$ into $(-y,x)$. So Q’s height equals P’s original across coordinate.", "math": ["(x,y)\\longmapsto(-y,x)"], "why": "A rigid rotation preserves lengths. Its change of direction explains where the copied height comes from.", "detail": "", "figure": {"type": "unit", "angle": 30, "focus": "x", "radius": 1, "compareAngle": 120, "quarterTurn": true}, "source": "lines2703–3155"}, {"id": "f071", "chapter": "c4", "title": "Derive the quarter-turn identity", "connect": "The new point is ninety degrees ahead, but its height is the old cosine reading.", "body": "Q’s angle is $\\theta+90^\\circ$, so its height is $\\sin(\\theta+90^\\circ)$. We just showed this height equals the original point’s across coordinate, $\\cos\\theta$. Therefore the two expressions are equal for every angle.", "math": ["\\sin(\\theta+90^\\circ)=\\cos\\theta"], "why": "This relationship comes from rotating the coordinates, not from memorising an identity list.", "detail": "", "figure": {"type": "unit", "angle": 30, "focus": "x", "radius": 1, "compareAngle": 120, "quarterTurn": true}, "source": "lines2703–3155"}, {"id": "f072", "chapter": "c4", "title": "Five points explain one cosine wave", "connect": "Record cosine at the same five axis directions used for sine.", "body": "Cosine starts at 1, reaches 0 after a quarter-turn, reaches−1 after a half-turn, returns to 0 after three quarters, and returns to 1 after one full turn. It has the same wave shape as sine, starting one quarter-turn ahead in that cycle.", "math": ["1\\ \\to\\ 0\\ \\to\\ -1\\ \\to\\ 0\\ \\to\\ 1"], "why": "The matching inputs are 0°,90°,180°,270°,360°. The graph is still input angle across, chosen output up.", "detail": "", "figure": {"type": "wave", "fn": "cos", "angle": 360, "unit": "deg", "landmarks": true}, "source": "lines2703–3155"}, {"id": "f073", "chapter": "c4", "title": "Spread the rotating record forwards", "connect": "The source next shows why a circle and two waves can be views of one motion.", "body": "Imagine recording the circle while also moving steadily forwards. Keep three measurements for every point: how far the angle has progressed, the circle’s across reading, and the circle’s up reading. The resulting path is a coil. Each measurement already has a meaning.", "math": [], "why": "The extra forward coordinate separates successive positions that would otherwise be drawn on top of the same circle.", "detail": "", "figure": {"type": "helix", "angle": 300, "view": "space"}, "source": "lines2703–3155"}, {"id": "f074", "chapter": "c4", "title": "Name the three-dimensional point", "connect": "We can write those three known readings as one ordered triple.", "body": "Call the point on the coil $H$. Its first coordinate is progress $\\theta$, its second is $\\cos\\theta$, and its third is $\\sin\\theta$. In this three-dimensional picture, the source names these axes $x,y,z$. Here x means progress, not the old circle’s across coordinate.", "math": ["H(\\theta)=(\\theta,\\cos\\theta,\\sin\\theta)"], "why": "An ordered triple locates a point in three dimensions, just as an ordered pair locates one in a plane.", "detail": "", "figure": {"type": "helix", "angle": 60, "view": "space", "labels": true}, "source": "lines2703–3155"}, {"id": "f075", "chapter": "c4", "title": "Look along the progress direction", "connect": "A view hides the coordinate pointing directly towards or away from your eye.", "body": "Look straight along the progress axis. That direction disappears from the picture. The two visible coordinates are the circle’s across and up readings: $(\\cos\\theta,\\sin\\theta)$. The end view is therefore the original circle.", "math": ["(\\cos\\theta,\\sin\\theta)"], "why": "A projection means keeping the two visible coordinates and ignoring the viewing-direction coordinate. No new trigonometric rule is needed.", "detail": "", "figure": {"type": "helix", "angle": 225, "view": "circle"}, "source": "lines2703–3155"}, {"id": "f076", "chapter": "c4", "title": "Look at progress and height", "connect": "Choose a different viewing direction so the circle’s across coordinate is hidden.", "body": "Now keep progress across the page and the original point’s height vertically. The visible coordinates are $(\\theta,\\sin\\theta)$, exactly the pair used for the sine graph. This side view of the coil is the sine wave.", "math": ["(\\theta,\\sin\\theta)"], "why": "The circle and sine wave look different because they retain different coordinates of the same three-dimensional record.", "detail": "", "figure": {"type": "helix", "angle": 330, "view": "sin"}, "source": "lines2703–3155"}, {"id": "f077", "chapter": "c4", "title": "Look at progress and the other circle coordinate", "connect": "The remaining view hides the sine coordinate instead.", "body": "Keep progress and the circle’s across reading. Rotate the view so this second reading becomes the vertical screen direction. The visible pair is $(\\theta,\\cos\\theta)$, which is the cosine graph. All three pictures describe the same recorded motion.", "math": ["(\\theta,\\cos\\theta)"], "why": "A full turn repeats the two circle coordinates, but progress keeps increasing. The coil therefore does not collapse into one repeatedly traced circle.", "detail": "", "figure": {"type": "helix", "angle": 315, "view": "cos"}, "source": "lines2703–3155"}, {"id": "f078", "chapter": "c4", "title": "Measure a turn by its curved journey", "connect": "Degrees are one choice of angle unit; the source now builds another.", "body": "Mark the arc travelled by the circle point. Call its length $s$. Call the radius length $r$. Imagine using a copy of that radius as a measuring stick along the curved arc. We want to count how many radius-lengths the arc contains.", "math": [], "why": "Comparing arc length with radius produces an angle measure that does not depend on how large the circle is.", "detail": "", "figure": {"type": "radians", "angle": 90, "radius": 1, "stage": "arc"}, "source": "lines2703–3155"}, {"id": "f079", "chapter": "c4", "title": "This ratio is radian measure", "connect": "To count how many measuring-stick lengths fit, divide by the stick’s length.", "body": "Radian measure is defined as arc length divided by radius. Thus the angle in radians is $s/r$. One radian means the arc length equals exactly one radius. The same turn can be described in degrees or radians; the unit has changed, not the turn.", "math": ["\\theta=\\frac{s}{r}"], "why": "Division answers “how many radius-length units?” It is the same reason a six-metre length contains three two-metre sticks.", "detail": "", "figure": {"type": "radians", "angle": 57.295779513, "radius": 1, "stage": "one"}, "source": "lines2703–3155"}, {"id": "f080", "chapter": "c4", "title": "Why a full turn is two pi radians", "connect": "For a complete turn, the arc is the whole circumference.", "body": "The number $\\pi$ is the ratio of circumference to diameter. Since the diameter is $2r$, the circumference is $2\\pi r$. Divide that full arc length by the radius. The factor r cancels, leaving $2\\pi$ radians for one full turn.", "math": ["\\theta=\\frac{2\\pi r}{r}=2\\pi"], "why": "This explains the 2π. It comes from the circumference expressed in radius-length units.", "detail": "", "figure": {"type": "radians", "angle": 360, "radius": 1, "stage": "full"}, "source": "lines2703–3155"}, {"id": "f081", "chapter": "c4", "title": "Match radians with familiar turns", "connect": "We already know one full turn in degrees.", "body": "The same full turn is $360^\\circ$ and $2\\pi$ radians. Halve both to obtain $180^\\circ=\\pi$ radians. Halve again to obtain $90^\\circ=\\pi/2$. Three quarter-turns give $270^\\circ=3\\pi/2$.", "math": ["180^\\circ=\\pi\\text{ radians},\\qquad90^\\circ=\\frac\\pi2\\text{ radians}", "270^\\circ=\\frac{3\\pi}{2}\\text{ radians}"], "why": "We are matching two scales on the same turn, as with two different units on one ruler.", "detail": "", "figure": {"type": "radians", "angle": 270, "radius": 1, "stage": "compare"}, "source": "lines2703–3155"}, {"id": "f082", "chapter": "c4", "title": "Convert any angle between the units", "connect": "The half-turn equality gives a conversion factor for every angle.", "body": "Since $180^\\circ$ equals $\\pi$ radians, one degree equals $\\pi/180$ radians. Multiply the degree number by that amount. To reverse the conversion, multiply the radian number by $180/\\pi$. These factors come directly from matching the half-turn.", "math": ["\\text{radians}=\\text{degrees}\\times\\frac\\pi{180}", "\\text{degrees}=\\text{radians}\\times\\frac{180}\\pi"], "why": "For example 30° becomes 30×π/180=π/6. Changing the radius would multiply both s and r equally, so s/r and the angle stay unchanged.", "detail": "", "figure": {"type": "radians", "angle": 30, "radius": 1, "stage": "compare"}, "source": "lines2703–3155"}, {"id": "f083", "chapter": "c4", "title": "The graph stays the same", "connect": "Replace degree labels on the angle axis with their radian equivalents.", "body": "The labels $0^\\circ,90^\\circ,180^\\circ,270^\\circ,360^\\circ$ become $0,\\pi/2,\\pi,3\\pi/2,2\\pi$. Every output height stays unchanged. A point has not moved to a different angle; its input has simply been renamed in different units.", "math": ["90^\\circ\\longleftrightarrow\\frac\\pi2"], "why": "Always check the angle unit before calculating or interpreting a graph.", "detail": "", "figure": {"type": "wave", "fn": "sin", "angle": 90, "unit": "rad"}, "source": "lines2703–3155"}, {"id": "f084", "chapter": "c4", "title": "What does period mean?", "connect": "The circular motion gives a repeating graph; we need a name for the repeat length.", "body": "A <b>period<\/b> is a positive input increase that repeats the whole output pattern. A full turn returns the unit-circle point to its starting place. Therefore sine and cosine repeat when the input increases by $2\\pi$ radians, or $360^\\circ$.", "math": ["\\sin(\\theta+2\\pi)=\\sin\\theta", "\\cos(\\theta+2\\pi)=\\cos\\theta"], "why": "Their fundamental period is the smallest positive repeat length,2π. Larger whole multiples repeat too.", "detail": "", "figure": {"type": "wave", "fn": "sin", "angle": 390, "unit": "rad", "twoCycles": true}, "source": "lines2703–3155"}, {"id": "f085", "chapter": "c4", "title": "Tangent repeats after only half a turn", "connect": "A half-turn reverses both coordinates at once.", "body": "After adding $\\pi$, sine and cosine both change sign. Tangent divides one by the other, so the two minus signs cancel. The directed radius has reversed, but its full line and its slope are unchanged. Tangent therefore has fundamental period $\\pi$.", "math": ["\\tan(\\theta+\\pi)=\\frac{-\\sin\\theta}{-\\cos\\theta}=\\tan\\theta"], "why": "This equality applies where tangent is defined. Its forbidden angles repeat after the same half-turn.", "detail": "", "figure": {"type": "wave", "fn": "tan", "angle": 225, "unit": "rad"}, "source": "lines2703–3155"}, {"id": "f086", "chapter": "c4", "title": "Cotangent also repeats after half a turn", "connect": "The same sign cancellation occurs in the reversed quotient.", "body": "Cotangent is cosine divided by sine. A half-turn makes both negative, so their quotient stays unchanged. Secant and cosecant behave differently: their numerator is the fixed number 1, so a half-turn changes their sign. They need a full turn to repeat.", "math": ["\\cot(\\theta+\\pi)=\\frac{-\\cos\\theta}{-\\sin\\theta}=\\cot\\theta"], "why": "Hence tan and cot have periodπ; sin,cos,sec,csc have period 2π. These periods are in radians.", "detail": "", "figure": {"type": "wave", "fn": "cot", "angle": 225, "unit": "rad"}, "source": "lines2703–3155"}, {"id": "f087", "chapter": "c4", "title": "Near a missing value, outputs can grow very large", "connect": "A quotient graph behaves differently from the bounded sine and cosine waves.", "body": "Dividing by a small nonzero number can give a large answer. For example, $1/0.1=10$ while $1/0.01=100$. Near an angle where the denominator reaches zero, a reciprocal output can move beyond the visible graph window. That does not make the nearby output undefined.", "math": ["\\frac1{0.1}=10,\\qquad\\frac1{0.01}=100"], "why": "Off-scale means a valid value is outside the drawing. Undefined means the function gives no value at that exact input.", "detail": "", "figure": {"type": "wave", "fn": "sec", "angle": 85, "unit": "rad"}, "source": "lines2703–3155"}, {"id": "f088", "chapter": "c4", "title": "A vertical asymptote marks a gap", "connect": "At the forbidden angle itself, division by zero is still impossible.", "body": "A dashed vertical line marks an angle where nearby outputs grow without bound in magnitude. It is called a <b>vertical asymptote<\/b>. The dashed line is a guide, not part of the function. There is no graph point at the forbidden angle and no joining stroke across the gap.", "math": [], "why": "The source deliberately breaks its curve at each pole. A finite graph window must not turn two separate branches into a false connection.", "detail": "", "figure": {"type": "wave", "fn": "tan", "angle": 90, "unit": "rad"}, "source": "lines2703–3155"}, {"id": "f089", "chapter": "c4", "title": "Tangent: repeat the branches and keep the gaps", "connect": "Use tangent’s definition to locate its missing inputs.", "body": "Tangent is sine divided by cosine. Cosine is zero at $\\pi/2,3\\pi/2$ and every additional half-turn. These are tangent’s gaps. Between gaps the output passes through every real value, including zero when sine is zero. The pattern repeats every $\\pi$.", "math": ["\\tan\\theta=\\frac{\\sin\\theta}{\\cos\\theta}", "\\theta\\ne\\frac\\pi2+k\\pi\\qquad(k\\text{ an integer})"], "why": "k counts half-turns in either direction:…,−2,−1,0,1,2,…. This compact expression lists every forbidden angle.", "detail": "", "figure": {"type": "wave", "fn": "tan", "angle": 140, "unit": "rad"}, "source": "lines2703–3155"}, {"id": "f090", "chapter": "c4", "title": "Cotangent: the denominator changes the gaps", "connect": "Cotangent reverses sine and cosine, so its excluded inputs move.", "body": "Cotangent is cosine divided by sine. Sine is zero at $0,\\pi,2\\pi$ and every integer half-turn, so those inputs are excluded. Cotangent is zero at $\\pi/2$ and $3\\pi/2$, where cosine is zero. Its branches repeat after $\\pi$.", "math": ["\\cot\\theta=\\frac{\\cos\\theta}{\\sin\\theta}", "\\theta\\ne k\\pi\\qquad(k\\text{ an integer})"], "why": "The denominator decides where division is impossible. The numerator decides where a defined quotient is zero.", "detail": "", "figure": {"type": "wave", "fn": "cot", "angle": 140, "unit": "rad"}, "source": "lines2703–3155"}, {"id": "f091", "chapter": "c4", "title": "Secant: reciprocals of cosine", "connect": "Use the same cosine denominator, but keep the numerator equal to one.", "body": "Secant has gaps wherever cosine is zero, just like tangent. Since cosine’s magnitude is at most 1, its nonzero reciprocal has magnitude at least 1. Secant therefore lies at or above 1, or at or below−1. It never crosses zero and repeats after $2\\pi$.", "math": ["\\sec\\theta=\\frac1{\\cos\\theta}", "\\sec\\theta\\le-1\\quad\\text{or}\\quad\\sec\\theta\\ge1"], "why": "A reciprocal cannot be zero because 1 divided by a finite nonzero number cannot equal 0. Its gap angles areπ/2+kπ.", "detail": "", "figure": {"type": "wave", "fn": "sec", "angle": 140, "unit": "rad"}, "source": "lines2703–3155"}, {"id": "f092", "chapter": "c4", "title": "Cosecant: reciprocals of sine", "connect": "The final graph follows the same reasoning with sine underneath the fraction.", "body": "Cosecant is undefined where sine is zero: at integer multiples of $\\pi$. Its values also have magnitude at least 1, so its branches avoid the band between−1 and 1. It never reaches zero and has fundamental period $2\\pi$. All four quotient graphs keep their true gaps.", "math": ["\\csc\\theta=\\frac1{\\sin\\theta}", "\\csc\\theta\\le-1\\quad\\text{or}\\quad\\csc\\theta\\ge1"], "why": "We now have a geometric reason for each function, each repeat length and each missing input. The next chapters transform and solve with these established readings.", "detail": "", "figure": {"type": "wave", "fn": "csc", "angle": 230, "unit": "rad"}, "source": "lines2703–3155"}, {"id": "t01", "chapter": "c5", "title": "The input and the angle have different jobs", "connect": "We can already turn a circle and record its height as a sine wave.", "body": "The graph needs a
