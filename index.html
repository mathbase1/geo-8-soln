n <b>input<\/b>: a position along its horizontal axis. Call that input $x$. The circle needs an <b>angle<\/b>: how far its spoke has turned. Call that angle $\\theta$. They happen to match in the first example, but we can change the rule connecting them.", "math": ["\\theta=x", "y=\\sin\\theta"], "why": "We separate these two jobs now because changing the input rule changes the width of the wave.", "detail": "Earlier, x may have named the horizontal coordinate of a point on the unit circle. Here x is the graph input. The unit-circle horizontal coordinate is cos θ; the graph input is not automatically cos θ.", "figure": {"type": "transform", "A": 1, "k": 1, "phi": 0, "d": 0, "angle": 30, "active": "all", "fn": "sin", "knownControls": []}, "source": "lines3334–3448;4018–4029"}, {"id": "t02", "chapter": "c5", "title": "Start with one familiar height", "connect": "Keep the angle fixed while we change only the output height.", "body": "At $\\theta=\\pi/6$, the unit-circle height is $1/2$. First keep a faint copy of that height. We will stretch or shrink it, so the copy gives us something to compare against. The angle stays the same throughout this change.", "math": ["\\sin(\\pi/6)=\\frac{1}{2}"], "why": "Holding the angle fixed isolates the effect of changing the height scale.", "detail": "", "figure": {"type": "transform", "A": 1, "k": 1, "phi": 0, "d": 0, "angle": 30, "active": "amplitude", "fn": "sin", "knownControls": []}, "source": "lines4033–4051"}, {"id": "t03", "chapter": "c5", "title": "A height scale multiplies every height", "connect": "The original height is still one half.", "body": "Stretch the height by a factor of $1.5$. One half becomes three quarters. The same multiplication applies to every other point on the wave. We call this multiplier $A$, so $A=1.5$ means every original sine height is multiplied by $1.5$.", "math": ["1.5\\times\\frac{1}{2}=0.75", "y=A\\sin\\theta"], "why": "Multiplication expresses a scale factor: how many copies of the original height the new height contains.", "detail": "", "figure": {"type": "transform", "A": 1.5, "k": 1, "phi": 0, "d": 0, "angle": 30, "active": "amplitude", "fn": "sin", "knownControls": ["A"]}, "source": "lines4033–4051"}, {"id": "t04", "chapter": "c5", "title": "A smaller multiplier makes a shorter wave", "connect": "The multiplier can shrink the height as well as stretch it.", "body": "Now use $A=0.5$. The original height $1/2$ becomes $1/4$. The highest unit-circle height, $1$, becomes $0.5$. The wave is half as tall, but the angles at which its peaks and zero crossings occur have not changed.", "math": ["0.5\\times\\frac{1}{2}=0.25"], "why": "A change outside sine changes its output heights. It does not change the angle fed into sine.", "detail": "", "figure": {"type": "transform", "A": 0.5, "k": 1, "phi": 0, "d": 0, "angle": 30, "active": "amplitude", "fn": "sin", "knownControls": ["A"]}, "source": "lines4033–4051"}, {"id": "t05", "chapter": "c5", "title": "A negative multiplier reverses the height", "connect": "So far our scale factors have been positive.", "body": "The file next uses $A=-1.25$. Multiplying a positive height by a negative number puts it below the centre line. Multiplying a negative height by a negative number puts it above. Every point is reflected across the centre line and its distance from that line is scaled by $1.25$.", "math": ["-1.25\\times\\frac{1}{2}=-0.625"], "why": "The minus sign tells us the direction of the output. The geometric radius has positive size 1.25; it is the signed vector that reverses.", "detail": "", "figure": {"type": "transform", "A": -1.25, "k": 1, "phi": 0, "d": 0, "angle": 30, "active": "amplitude", "fn": "sin", "knownControls": ["A"]}, "source": "lines4033–4051"}, {"id": "t06", "chapter": "c5", "title": "Amplitude is only half the total height", "connect": "The reflected wave still has the same top-to-bottom size.", "body": "Its peak is $1.25$ and its trough is $-1.25$. The full distance between them is $2.5$. <b>Amplitude<\/b> means the distance from the centre line to one extreme, so we take half of that full distance. Amplitude is a distance and is never negative.", "math": ["\\text{amplitude}=\\frac{1.25-(-1.25)}2=1.25"], "why": "We divide by two because the centre line sits halfway between the peak and the trough.", "detail": "", "figure": {"type": "transform", "A": -1.25, "k": 1, "phi": 0, "d": 0, "angle": 30, "active": "amplitude", "fn": "sin", "showFullHeight": true, "knownControls": ["A"]}, "source": "lines4033–4051"}, {"id": "t07", "chapter": "c5", "title": "Why amplitude is written as |A|", "connect": "We need one expression that works for positive and negative scale factors.", "body": "The notation $|A|$ means the <b>size<\/b> of $A$ after removing its sign. Thus $|1.25|=1.25$ and $|-1.25|=1.25$. Both waves reach the same distance from their centre line. The sign changes their orientation; the size gives their amplitude.", "math": ["\\text{amplitude}=|A|", "-|A|\\le A\\sin\\theta\\le|A|"], "why": "Sine stays between −1 and 1. Scaling those heights by A gives extremes of size |A| in the two directions.", "detail": "", "figure": {"type": "transform", "A": -1.25, "k": 1, "phi": 0, "d": 0, "angle": 30, "active": "amplitude", "fn": "sin", "showBounds": true, "knownControls": ["A"]}, "source": "lines4033–4051"}, {"id": "t08", "chapter": "c5", "title": "Now change how quickly the angle turns", "connect": "Leave the height scale at one and change the connection between input and angle.", "body": "Make the circle angle advance by $2$ radians whenever the graph input advances by $1$ unit. Then input $0$ produces angle $0$, input $1$ produces angle $2$, and input $2$ produces angle $4$. The angle is always twice the input.", "math": ["\\theta=2x"], "why": "Multiplication describes a constant rate: angle gained equals angle per input unit multiplied by the number of input units.", "detail": "", "figure": {"type": "transform", "A": 1, "k": 2, "phi": 0, "d": 0, "angle": 30, "active": "frequency", "fn": "sin", "knownControls": ["A"]}, "source": "lines4054–4095"}, {"id": "t09", "chapter": "c5", "title": "Give the turning multiplier a name", "connect": "The multiplier 2 is one possible choice.", "body": "Call the multiplier $k$. It tells us how many radians the circle angle changes for each input unit. In the example, $k=2$. To reach angle $\\pi/2$, the graph needs only input $\\pi/4$, because doubling $\\pi/4$ gives $\\pi/2$.", "math": ["\\theta=kx", "2\\times\\frac{\\pi}{4}=\\frac{\\pi}{2}"], "why": "The same circle position is reached sooner along the graph. That is why a larger positive k compresses the wave horizontally.", "detail": "", "figure": {"type": "transform", "A": 1, "k": 2, "phi": 0, "d": 0, "angle": 90, "active": "frequency", "fn": "sin", "knownControls": ["A", "k"]}, "source": "lines4054–4095"}, {"id": "t10", "chapter": "c5", "title": "A full cycle returns to the same phase", "connect": "We can measure how much graph input produces one complete circle turn.", "body": "Mark one position on the circle. Follow the spoke until it returns after a <b>full turn<\/b>. The angle has changed by $2\\pi$ radians. Call the corresponding horizontal distance on the graph $T$. This repeat distance is the wave’s <b>period<\/b>.", "math": ["\\text{one full turn}=2\\pi\\text{ radians}"], "why": "Returning only to the same height is not enough: sine crosses zero twice in one turn, travelling in opposite directions.", "detail": "", "figure": {"type": "transform", "A": 1, "k": 2, "phi": 0, "d": 0, "angle": 360, "active": "frequency", "fn": "sin", "showPeriod": true, "knownControls": ["A", "k"]}, "source": "lines3619–3655;4054–4095"}, {"id": "t11", "chapter": "c5", "title": "Find the period when k = 2", "connect": "A full turn needs 2π radians, and each input unit supplies 2 radians.", "body": "If the input advances by $T$, the angle advances by $2T$. We need that angle change to equal $2\\pi$. Divide both sides by $2$ to find the input distance. The circle completes one turn while the graph travels a distance of $\\pi$.", "math": ["2T=2\\pi", "T=\\pi"], "why": "We divide by the turning multiplier because we know the required angle and want the input that produces it.", "detail": "", "figure": {"type": "transform", "A": 1, "k": 2, "phi": 0, "d": 0, "angle": 360, "active": "frequency", "fn": "sin", "showPeriod": true, "knownControls": ["A", "k"]}, "source": "lines4054–4095"}, {"id": "t12", "chapter": "c5", "title": "Derive the general period formula", "connect": "Use the same calculation with an arbitrary nonzero turning multiplier.", "body": "A positive horizontal distance $T$ changes the angle by an amount whose size is $|k|T$. One full turn has size $2\\pi$. Equate these two sizes, then divide by $|k|$. The absolute value keeps the repeat distance positive even when the circle turns clockwise.", "math": ["|k|T=2\\pi", "T=\\frac{2\\pi}{|k|}"], "why": "A period is a positive horizontal distance. This formula describes a nonconstant sine or cosine, so A and k must both be nonzero.", "detail": "", "figure": {"type": "transform", "A": 1, "k": 2, "phi": 0, "d": 0, "angle": 30, "active": "frequency", "fn": "sin", "showPeriod": true, "knownControls": ["A", "k"]}, "source": "lines4054–4095;4180–4224"}, {"id": "t13", "chapter": "c5", "title": "Count complete turns carefully", "connect": "One turn gives the first repeat; several turns give later repeats.", "body": "The notation $\\theta(x)$ means the angle selected at input $x$. Increasing the input by $T$ changes the angle by $kT$. To return to the same circle position, this change must be a whole number of complete turns. Call that whole-number count $m$; each turn contributes $2\\pi$ radians.", "math": ["\\theta(x+T)-\\theta(x)=kT", "kT=2m\\pi"], "why": "For the least positive period of a nonconstant wave, use one full turn in the appropriate direction.", "detail": "If k is positive, one turn gives m=1. If k is negative, one clockwise turn gives m=−1. In both cases the smallest positive T is 2π/|k|. Later we add a fixed starting angle; it cancels when comparing the new angle with the old one, so it does not change the period.", "figure": {"type": "transform", "A": 1, "k": 2, "phi": 0, "d": 0, "angle": 30, "active": "frequency", "fn": "sin", "showPeriod": true, "knownControls": ["A", "k"]}, "source": "lines4054–4095"}, {"id": "t14", "chapter": "c5", "title": "Frequency counts cycles per input unit", "connect": "Period tells us how much input one cycle needs.", "body": "If one cycle takes $T$ input units, then one input unit contains $1/T$ cycles. This is the frequency per input unit, written $f_x$. It is different from $k$: $k$ counts radians per input unit, whereas $f_x$ counts complete turns per input unit.", "math": ["f_x=\\frac{1}{T}=\\frac{|k|}{2\\pi}"], "why": "We divide by 2π because one complete turn contains 2π radians.", "detail": "", "figure": {"type": "transform", "A": 1, "k": 2, "phi": 0, "d": 0, "angle": 30, "active": "frequency", "fn": "sin", "showPeriod": true, "knownControls": ["A", "k"]}, "source": "lines4054–4095"}, {"id": "t15", "chapter": "c5", "title": "When the input is time", "connect": "Now read the horizontal ruler in seconds instead of unnamed input units.", "body": "Write the input as $t$. With $k=2$, one second produces $2$ radians of rotation. Radians per second are called <b>angular velocity<\/b>, usually written $\\omega$ (omega). Here $\\omega=k$. The ordinary frequency is the number of full cycles completed each second.", "math": ["\\omega=2\\text{ rad/s}", "f=\\frac{|\\omega|}{2\\pi}=\\frac{1}{\\pi}\\text{ Hz}"], "why": "A hertz means one cycle per second. Two radians per second is about 0.318 cycles per second, not two cycles per second.", "detail": "", "figure": {"type": "transform", "A": 1, "k": 2, "phi": 0, "d": 0, "angle": 114.59155902616465, "active": "frequency", "fn": "sin", "inputUnit": "seconds", "knownControls": ["A", "k"], "input": 1}, "source": "lines4054–4095"}, {"id": "t16", "chapter": "c5", "title": "What changes if the angle uses degrees?", "connect": "The period came from the size of one full turn.", "body": "One full turn is $2\\pi$ radians, or $360^\\circ$. If the angle rule is deliberately measured in degrees, the same reasoning uses $360^\\circ$. For example, a rate of $90^\\circ$ per input unit needs four input units for a complete turn.", "math": ["T=\\frac{360^\\circ}{|k|}", "\\frac{360^\\circ}{90^\\circ}=4"], "why": "Only the angle unit changed. We must use the same unit for the full-turn amount and the turning rate.", "detail": "", "figure": {"type": "transform", "A": 1, "k": 2, "phi": 0, "d": 0, "angle": 30, "active": "frequency", "fn": "sin", "degreeExplanation": true, "knownControls": ["A", "k"]}, "source": "lines4054–4095"}, {"id": "t17", "chapter": "c5", "title": "Give the circle a starting angle", "connect": "Until now, zero input made the spoke start at zero angle.", "body": "Turn the spoke by $\\pi/2$ before the input begins to increase. That starting turn is called $\\phi$ (phi). The later input contributes another $kx$ radians. Add the starting turn and the turn caused by the input to get the total angle.", "math": ["\\theta=kx+\\phi"], "why": "We add these angles because the spoke first makes the starting turn, then makes the input-driven turn.", "detail": "", "figure": {"type": "transform", "A": 1, "k": 2, "phi": 1.5707963267948966, "d": 0, "angle": 90, "active": "phase", "fn": "sin", "knownControls": ["A", "k", "phi"]}, "source": "lines4098–4129"}, {"id": "t18", "chapter": "c5", "title": "At zero input, the angle is φ", "connect": "The new formula lets us check what the starting-angle symbol means.", "body": "Put $x=0$ into the angle rule. The term $k\\times0$ is zero, leaving only $\\phi$. So $\\phi$ really is the circle angle when the graph input is zero. It is an <b>angle<\/b>, not automatically a horizontal distance on the graph.", "math": ["\\theta(0)=k\\times0+\\phi=\\phi"], "why": "Substituting zero isolates the starting value and checks that our formula matches the picture.", "detail": "", "figure": {"type": "transform", "A": 1, "k": 2, "phi": 1.5707963267948966, "d": 0, "angle": 90, "active": "phase", "fn": "sin", "knownControls": ["A", "k", "phi"]}, "source": "lines4098–4129"}, {"id": "t19", "chapter": "c5", "title": "Where does the phase-zero landmark move?", "connect": "We know the starting angle; now locate the familiar zero-angle point on the graph.", "body": "Keep $k=2$ and $\\phi=\\pi/2$. To find where the circle angle is zero, set the whole angle expression equal to zero. Subtract $\\pi/2$ from both sides. This removes the starting turn and leaves the part caused by the input.", "math": ["2x+\\frac{\\pi}{2}=0", "2x=-\\frac{\\pi}{2}"], "why": "We solve for the graph input that produces one chosen circle angle. That is how we find the horizontal movement.", "detail": "", "figure": {"type": "transform", "A": 1, "k": 2, "phi": 1.5707963267948966, "d": 0, "angle": 0, "active": "phase", "fn": "sin", "knownControls": ["A", "k", "phi"], "showShift": true, "nameShift": false}, "source": "lines4098–4129"}, {"id": "t20", "chapter": "c5", "title": "Divide to find its horizontal position", "connect": "The equation now tells us that twice the required input is −π/2.", "body": "Divide both sides by $2$. The phase-zero landmark is now at $x=-\\pi/4$, so it has moved left by $\\pi/4$. The angle offset was $\\pi/2$, but the horizontal movement is only half as large because the circle turns twice as fast.", "math": ["x=\\frac{-\\pi/2}{2}=-\\frac{\\pi}{4}"], "why": "Dividing reverses the multiplication by k. This is why a starting-angle change and a horizontal displacement are not the same quantity.", "detail": "", "figure": {"type": "transform", "A": 1, "k": 2, "phi": 1.5707963267948966, "d": 0, "angle": 0, "active": "phase", "fn": "sin", "knownControls": ["A", "k", "phi"], "showShift": true, "nameShift": false}, "source": "lines4098–4129"}, {"id": "t21", "chapter": "c5", "title": "A negative starting angle shifts the landmark right", "connect": "Change only the starting angle to −π/2.", "body": "Now the circle must catch up by $\\pi/2$ before reaching angle zero. Solve $2x-\\pi/2=0$. Add $\\pi/2$ to both sides and divide by $2$. The required input is positive: the phase-zero landmark is to the right of the origin.", "math": ["2x-\\frac{\\pi}{2}=0", "x=\\frac{\\pi}{4}"], "why": "The direction follows from solving the equation, so there is no need to memorise an unexplained opposite-sign rule.", "detail": "", "figure": {"type": "transform", "A": 1, "k": 2, "phi": -1.5707963267948966, "d": 0, "angle": 0, "active": "phase", "fn": "sin", "knownControls": ["A", "k", "phi"], "showShift": true, "nameShift": false}, "source": "lines4098–4129"}, {"id": "t22", "chapter": "c5", "title": "Name that horizontal position h", "connect": "We can carry out the same phase-zero calculation for any nonzero k.", "body": "Call the graph position of the phase-zero landmark $h$. At that point, $kh+\\phi=0$. Subtract $\\phi$ from both sides, then divide by $k$. The result tells us exactly how the starting angle determines the horizontal shift.", "math": ["kh=-\\phi", "h=-\\frac{\\phi}{k}\\quad(k\\ne0)"], "why": "The letter h names the horizontal displacement; φ names the starting angle. The turning multiplier connects the two.", "detail": "", "figure": {"type": "transform", "A": 1, "k": 2, "phi": -1.5707963267948966, "d": 0, "angle": 0, "active": "phase", "fn": "sin", "knownControls": ["A", "k", "phi"], "showShift": true, "nameShift": true}, "source": "lines4098–4129"}, {"id": "t23", "chapter": "c5", "title": "Why another formula uses x − h", "connect": "The same horizontal shift can be written directly inside the angle rule.", "body": "From $h=-\\phi/k$, multiply by $k$ to get $kh=-\\phi$, so $\\phi=-kh$. Replace $\\phi$ by $-kh$ in $kx+\\phi$. Both terms now contain $k$, so factor it out. These are two ways of writing the same angle.", "math": ["kx+\\phi=kx-kh", "kx+\\phi=k(x-h)"], "why": "Factoring makes the horizontal displacement h visible in the formula. It does not create a different wave.", "detail": "", "figure": {"type": "transform", "A": 1, "k": 2, "phi": -1.5707963267948966, "d": 0, "angle": 90, "active": "phase", "fn": "sin", "knownControls": ["A", "k", "phi"], "showShift": true, "nameShift": true}, "source": "lines4098–4129"}, {"id": "t24", "chapter": "c5", "title": "Find the input for any chosen angle: first subtract", "connect": "We found the input for angle zero. Now let the desired angle be any θ.", "body": "Start with $\\theta=kx+\\phi$. The input was multiplied by $k$, then the starting angle $\\phi$ was added. To recover the input, undo the last operation first: subtract $\\phi$ from both sides. This leaves the input-driven part of the angle.", "math": ["\\theta=kx+\\phi", "\\theta-\\phi=kx"], "why": "Subtraction removes the starting angle before we reverse the multiplication.", "detail": "", "figure": {"type": "pointmap", "A": 1, "k": 2, "phi": -0.6, "d": 0, "angle": 30, "knownControls": ["A", "k", "phi"]}, "source": "lines3710–3994;4098–4129"}, {"id": "t25", "chapter": "c5", "title": "Find the input: now divide", "connect": "After subtracting the starting angle, we have k copies of the input.", "body": "Divide both sides by the nonzero multiplier $k$. We now have a recipe for placing any chosen circle angle along the graph. The numerator is a complete expression, so the fraction bar must extend under both $\\theta$ and $-\\phi$.", "math": ["x=\\frac{\\theta-\\phi}{k}", "x=h+\\frac{\\theta}{k}"], "why": "Division reverses multiplication. This recipe cannot be used when k=0; that case will produce a constant graph instead.", "detail": "", "figure": {"type": "pointmap", "A": 1, "k": 2, "phi": -0.6, "d": 0, "angle": 30, "knownControls": ["A", "k", "phi"]}, "source": "lines3710–3994;4098–4129"}, {"id": "t26", "chapter": "c5", "title": "Changing φ moves the same landmark", "connect": "Keep the chosen angle and turning multiplier fixed.", "body": "If $\\phi$ increases, the numerator $\\theta-\\phi$ decreases. The same circle angle therefore appears at a different graph input. The symbol $\\Delta$ means “change”. A change $\\Delta\\phi$ in the starting angle produces the following change in the horizontal position.", "math": ["\\Delta x=-\\frac{\\Delta\\phi}{k}"], "why": "Subtract the old input recipe from the new one. The unchanged θ terms cancel, leaving only the change in φ.", "detail": "Write x_new=(θ−φ_new)/k and x_old=(θ−φ_old)/k. Their difference is x_new−x_old=−(φ_new−φ_old)/k. This assumes k is unchanged.", "figure": {"type": "transform", "A": 1, "k": 2, "phi": -0.6, "d": 0, "angle": 90, "active": "phase", "fn": "sin", "knownControls": ["A", "k", "phi"]}, "source": "lines4098–4129"}, {"id": "t27", "chapter": "c5", "title": "Move the whole wave upward", "connect": "The input rule is complete. Now change the vertical position of the output.", "body": "Take a wave with amplitude $0.9$. Its lowest and highest heights are $-0.9$ and $0.9$. Add $0.6$ to every height. The new extremes are $-0.3$ and $1.5$. The whole wave moves upward, including its centre line; its amplitude stays $0.9$.", "math": ["-0.9+0.6=-0.3", "0.9+0.6=1.5"], "why": "Adding the same number to every height translates the entire graph without stretching it.", "detail": "", "figure": {"type": "transform", "A": 0.9, "k": 2, "phi": -0.6, "d": 0.6, "angle": 30, "active": "height", "fn": "sin", "showBounds": true, "knownControls": ["A", "k", "phi"]}, "source": "lines4132–4146"}, {"id": "t28", "chapter": "c5", "title": "The added height is called d", "connect": "We need a name for this vertical movement.", "body": "Call the added amount $d$. The output is the scaled sine height plus $d$. Its middle horizontal line is now $y=d$. If $d=-0.6$, the same amplitude-$0.9$ wave extends from $-1.5$ to $0.3$, because every height moved down by $0.6$.", "math": ["y=A\\sin\\theta+d", "\\text{midline: }y=d"], "why": "The sine height is measured from the midline. Adding d places that height relative to the graph’s zero level.", "detail": "", "figure": {"type": "transform", "A": 0.9, "k": 2, "phi": -0.6, "d": -0.6, "angle": 30, "active": "height", "fn": "sin", "showBounds": true, "knownControls": ["A", "k", "phi", "d"]}, "source": "lines4132–4146"}, {"id": "t29", "chapter": "c5", "title": "Derive the possible output range", "connect": "The wave reaches |A| below and |A| above its midline.", "body": "The lowest possible output is the midline minus the amplitude: $d-|A|$. The highest is the midline plus the amplitude: $d+|A|$. The <b>range<\/b> is the set of output values. Square brackets include both extremes when the input runs through a complete cycle.", "math": ["d-|A|\\le y\\le d+|A|", "\\text{range}=[d-|A|,d+|A|]"], "why": "We add d to the earlier bound −|A|≤A sin θ≤|A|. Negative A changes orientation but leaves these bounds unchanged.", "detail": "This is the full attained range for a nonzero k with all real inputs, or any input interval covering a full cycle. A shorter input interval may not reach both extremes. If k=0, the output is one constant value inside this band.", "figure": {"type": "transform", "A": -0.9, "k": 2, "phi": -0.6, "d": -0.6, "angle": 30, "active": "height", "fn": "sin", "showBounds": true, "knownControls": ["A", "k", "phi", "d"]}, "source": "lines4132–4146"}, {"id": "t30", "chapter": "c5", "title": "Build the complete rule in the order it works", "connect": "Every part of the formula now has a geometric job.", "body": "First multiply the input by $k$. Add $\\phi$ to obtain the circle angle. Read the sine height at that angle. Multiply the height by $A$. Finally add $d$. The parentheses show that the whole expression $kx+\\phi$ is the angle supplied to sine.", "math": ["\\theta=kx+\\phi", "y=A\\sin(kx+\\phi)+d"], "why": "Following the operations in order links the input ruler, rotating spoke, height scale and midline into one calculation.", "detail": "", "figure": {"type": "transform", "A": 1.4, "k": 2, "phi": -0.6, "d": 0.3, "angle": 30, "active": "all", "fn": "sin", "knownControls": ["A", "k", "phi", "d"]}, "source": "lines4149–4178"}, {"id": "t31", "chapter": "c5", "title": "Use an easy angle to place an exact point", "connect": "The file now combines all four controls in one numerical example.", "body": "Use the rule below. Instead of guessing an input, choose the familiar circle angle $\\theta=\\pi/6$, whose sine is $1/2$. We will work backwards to find its input, then forwards to find its output. The point stays attached to the same circle angle.", "math": ["y=1.4\\sin(2x-0.6)+0.3", "\\theta=\\frac{\\pi}{6}"], "why": "Choosing a known angle makes the sine value exact and gives a reliable point for sketching.", "detail": "", "figure": {"type": "pointmap", "A": 1.4, "k": 2, "phi": -0.6, "d": 0.3, "angle": 30, "knownControls": ["A", "k", "phi", "d"]}, "source": "lines3788–3866;4149–4178"}, {"id": "t32", "chapter": "c5", "title": "Undo the starting angle in this example", "connect": "The required internal angle is π/6.", "body": "Set the inside of sine equal to that angle: $2x-0.6=\\pi/6$. To undo “subtract $0.6$”, add $0.6$ to both sides. The result tells us what twice the input must be. Do this before dividing so that every part of the angle is handled correctly.", "math": ["2x-0.6=\\frac{\\pi}{6}", "2x=\\frac{\\pi}{6}+0.6"], "why": "Adding the same amount to both sides keeps the equation balanced while removing the starting-angle adjustment.", "detail": "", "figure": {"type": "pointmap", "A": 1.4, "k": 2, "phi": -0.6, "d": 0.3, "angle": 30, "knownControls": ["A", "k", "phi", "d"]}, "source": "lines3788–3866;4149–4178"}, {"id": "t33", "chapter": "c5", "title": "Undo the multiplier in this example", "connect": "We now know twice the required input.", "body": "Divide the entire right-hand side by $2$. Both terms are divided: $(\\pi/6)/2=\\pi/12$ and $0.6/2=0.3$. This gives the horizontal position of our point. The decimal is an approximation; the expression containing $\\pi$ is exact.", "math": ["x=\\frac{\\pi/6+0.6}{2}", "x=\\frac{\\pi}{12}+0.3\\approx0.562"], "why": "The long fraction bar matters: it shows that the whole sum is divided by two.", "detail": "", "figure": {"type": "pointmap", "A": 1.4, "k": 2, "phi": -0.6, "d": 0.3, "angle": 30, "knownControls": ["A", "k", "phi", "d"]}, "source": "lines3788–3866;4149–4178"}, {"id": "t34", "chapter": "c5", "title": "Now calculate its output height", "connect": "At that input, the internal angle is exactly π/6.", "body": "Read the unit-circle height: $\\sin(\\pi/6)=1/2$. Multiply that height by $1.4$ to get $0.7$. Finally add the midline height $0.3$, giving $1.0$. These are the same output operations we derived earlier, now with numerical values.", "math": ["y=1.4\\times\\frac{1}{2}+0.3", "y=0.7+0.3=1"], "why": "The sine result is a height. A scales that height; d then locates it vertically on the graph.", "detail": "", "figure": {"type": "pointmap", "A": 1.4, "k": 2, "phi": -0.6, "d": 0.3, "angle": 30, "knownControls": ["A", "k", "phi", "d"]}, "source": "lines3788–3866;4149–4178"}, {"id": "t35", "chapter": "c5", "title": "Place the point: across, then up", "connect": "We have found both coordinates of one graph point.", "body": "Move along the input ruler to $x=\\pi/12+0.3$, approximately $0.562$. From there move vertically to height $y=1$. The ordered pair records these instructions in that order: horizontal position first, vertical height second. The circle and graph display the same output height.", "math": ["\\left(\\frac{\\pi}{12}+0.3,\\ 1\\right)"], "why": "A point is placed using two separate measurements. Keeping them separate prevents the circle angle from being mistaken for the graph input.", "detail": "", "figure": {"type": "pointmap", "A": 1.4, "k": 2, "phi": -0.6, "d": 0.3, "angle": 30, "showCoordinateJourney": true, "knownControls": ["A", "k", "phi", "d"]}, "source": "lines3974–3994;4149–4178"}, {"id": "t36", "chapter": "c5", "title": "Choose five landmarks for a complete cycle", "connect": "One accurate point is useful; five familiar phases reveal the whole wave.", "body": "Use the circle’s start, top, left, bottom and return positions. Their phases are $0$, $\\pi/2$, $\\pi$, $3\\pi/2$ and $2\\pi$. Their sine heights are $0$, $1$, $0$, $-1$ and $0$. Apply the same two coordinate recipes to each phase.", "math": ["x=\\frac{\\theta+0.6}{2}", "y=1.4\\sin\\theta+0.3"], "why": "These phases have known heights, so we can locate a whole cycle without trial-and-error plotting.", "detail": "", "figure": {"type": "pointmap", "A": 1.4, "k": 2, "phi": -0.6, "d": 0.3, "angle": 0, "showLandmarks": true, "knownControls": ["A", "k", "phi", "d"]}, "source": "lines3469–3488;3974–3994;4149–4178"}, {"id": "t37", "chapter": "c5", "title": "The first landmark sits on the midline", "connect": "Start the five-point recipe with phase zero.", "body": "For $\\theta=0$, the horizontal position is $(0+0.6)/2=0.3$. Sine zero is zero, so the output is $1.4\\times0+0.3=0.3$. This phase-zero point is therefore $(0.3,0.3)$: it sits on the wave’s midline, not on the graph’s zero-height axis.", "math": ["x=0.3", "y=0.3"], "why": "The vertical shift moves the zero of the sine part to the midline y=0.3; it does not usually make the full output zero.", "detail": "", "figure": {"type": "pointmap", "A": 1.4, "k": 2, "phi": -0.6, "d": 0.3, "angle": 0, "showLandmarks": true, "knownControls": ["A", "k", "phi", "d"]}, "source": "lines3974–3994;4149–4178"}, {"id": "t38", "chapter": "c5", "title": "The next landmark is the peak", "connect": "Advance the internal angle by one quarter-turn.", "body": "At phase $\\pi/2$, sine is $1$. The output is $1.4+0.3=1.7$. The input is $(\\pi/2+0.6)/2=\\pi/4+0.3$. Notice that a quarter-turn of angle $\\pi/2$ advances the graph input by only $\\pi/4$, because $k=2$.", "math": ["x=\\frac{\\pi}{4}+0.3", "y=1.7"], "why": "Each equal angle step is divided by the same turning multiplier when converted to a graph-input step.", "detail": "", "figure": {"type": "pointmap", "A": 1.4, "k": 2, "phi": -0.6, "d": 0.3, "angle": 90, "showLandmarks": true, "knownControls": ["A", "k", "phi", "d"]}, "source": "lines3974–3994;4149–4178"}, {"id": "t39", "chapter": "c5", "title": "Finish the five-point sketch", "connect": "Repeat that quarter-turn step three more times.", "body": "The outputs continue through the midline $0.3$, the trough $-1.1$, and back to the midline $0.3$. The corresponding inputs are $\\pi/2+0.3$, $3\\pi/4+0.3$, and $\\pi+0.3$. Join the five points with a smooth sine curve. Straight line segments would give a different function.", "math": ["T=\\pi", "\\text{range}=[-1.1,1.7]"], "why": "Four equal quarter-cycle input steps of π/4 make one full period π.", "detail": "<table><thead><tr><th>Phase θ<\/th><th>Input x<\/th><th>Output y<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>0.3<\/td><td>0.3<\/td><\/tr><tr><td>π/2<\/td><td>π/4 + 0.3<\/td><td>1.7<\/td><\/tr><tr><td>π<\/td><td>π/2 + 0.3<\/td><td>0.3<\/td><\/tr><tr><td>3π/2<\/td><td>3π/4 + 0.3<\/td><td>−1.1<\/td><\/tr><tr><td>2π<\/td><td>π + 0.3<\/td><td>0.3<\/td><\/tr><\/tbody><\/table>", "figure": {"type": "pointmap", "A": 1.4, "k": 2, "phi": -0.6, "d": 0.3, "angle": 360, "showLandmarks": true, "knownControls": ["A", "k", "phi", "d"]}, "source": "lines3974–3994;4149–4178"}, {"id": "t40", "chapter": "c5", "title": "A quarter-turn changes a horizontal coordinate into a height", "connect": "The file next transfers the same construction from sine to cosine.", "body": "A unit-circle point at angle $\\theta$ has horizontal coordinate $\\cos\\theta$. Rotate that point anticlockwise by $\\pi/2$. Its old horizontal coordinate becomes its new vertical coordinate. The new vertical coordinate is also $\\sin(\\theta+\\pi/2)$, so these two expressions must be equal.", "math": ["\\sin(\\theta+\\pi/2)=\\cos\\theta", "\\cos(\\theta-\\pi/2)=\\sin\\theta"], "why": "This identity follows from a quarter-turn of the same point, rather than a rule to memorise without a picture.", "detail": "", "figure": {"type": "wave", "fn": "cos", "angle": 30, "showQuarterTurn": true, "knownControls": ["A", "k", "phi", "d"]}, "source": "lines3996–4007;4149–4178"}, {"id": "t41", "chapter": "c5", "title": "The cosine coordinate recipe works the same way", "connect": "Only the circle measurement changes from sine height to cosine coordinate.", "body": "Keep the same angle rule $\\theta=kx+\\phi$, so the input recipe is unchanged. For the output, use $\\cos\\theta$ instead of $\\sin\\theta$, then apply the same height scale and vertical shift. Cosine’s five familiar outputs are $1,0,-1,0,1$ at the quarter-turn phases.", "math": ["x=\\frac{\\theta-\\phi}{k}", "y=A\\cos\\theta+d"], "why": "The controls act on the input and output in the same order for both functions.", "detail": "", "figure": {"type": "pointmap", "A": 1.4, "k": 2, "phi": -0.6, "d": 0.3, "angle": 0, "fn": "cos", "showLandmarks": true, "knownControls": ["A", "k", "phi", "d"]}, "source": "lines3996–4007;4149–4178"}, {"id": "t42", "chapter": "c5", "title": "Read the file’s final cosine example", "connect": "The final cosine demonstration changes all four controls.", "body": "For the rule below, the height scale is $1.15$, the turning multiplier is $1.5$, the starting angle is $-0.4$, and the midline is $-0.25$. The phase-zero position is $0.4/1.5=4/15$. Its lowest height is $-1.4$ and highest is $0.9$.", "math": ["y=1.15\\cos(1.5x-0.4)-0.25", "T=\\frac{2\\pi}{1.5}=\\frac{4\\pi}{3}"], "why": "Every number has the same job it had in the sine example. Changing the function to cosine changes its starting shape, not these control rules.", "detail": "", "figure": {"type": "transform", "A": 1.15, "k": 1.5, "phi": -0.4, "d": -0.25, "angle": 0, "active": "all", "fn": "cos", "knownControls": ["A", "k", "phi", "d"]}, "source": "lines4149–4178"}, {"id": "t43", "chapter": "c5", "title": "What if the height scale is zero?", "connect": "Before using formulas with division, check the cases where a control is zero.", "body": "If $A=0$, every sine or cosine height is multiplied by zero. The only remaining output is $d$, regardless of the input or the turning angle. The graph becomes a horizontal line. In the file’s example, the line has height $0.35$.", "math": ["A=0\\quad\\Rightarrow\\quad y=d"], "why": "Zero multiplication removes all variation in the output, even if the circle angle keeps changing.", "detail": "", "figure": {"type": "transform", "A": 0, "k": 1, "phi": 0, "d": 0.35, "angle": 30, "active": "constant", "fn": "sin", "knownControls": ["A", "k", "phi", "d"]}, "source": "lines4180–4224"}, {"id": "t44", "chapter": "c5", "title": "What if the turning multiplier is zero?", "connect": "Now keep a nonzero height scale, but stop the input from changing the angle.", "body": "When $k=0$, the angle is $0x+\\phi=\\phi$. Every input selects the same circle position. Therefore the output is one constant value. For sine, the constant is $A\\sin\\phi+d$. It is not always $d$: that happens only when the sine contribution is zero.", "math": ["k=0\\quad\\Rightarrow\\quad\\theta=\\phi", "y=A\\sin\\phi+d"], "why": "No amount of changing x can affect a term multiplied by zero. We must not divide by k in this case.", "detail": "", "figure": {"type": "transform", "A": 1.1, "k": 0, "phi": 0.5235987755982988, "d": 0.35, "angle": 30, "active": "constant", "fn": "sin", "knownControls": ["A", "k", "phi", "d"]}, "source": "lines4180–4224"}, {"id": "t45", "chapter": "c5", "title": "Calculate the file’s constant sine height", "connect": "The file chooses A = 1.1, φ = π/6 and d = 0.35 while k stays zero.", "body": "The fixed circle angle is $\\pi/6$, so its sine height is $1/2$. Scaling gives $1.1\\times1/2=0.55$. Adding the midline height $0.35$ gives $0.90$. Every input produces this same output, so the graph is the horizontal line $y=0.9$.", "math": ["y=1.1\\times\\frac{1}{2}+0.35=0.9"], "why": "This numerical calculation shows why k=0 does not generally mean that the output equals the midline.", "detail": "", "figure": {"type": "transform", "A": 1.1, "k": 0, "phi": 0.5235987755982988, "d": 0.35, "angle": 30, "active": "constant", "fn": "sin", "knownControls": ["A", "k", "phi", "d"]}, "source": "lines4180–4224"}, {"id": "t46", "chapter": "c5", "title": "A constant cosine can sit at a different height", "connect": "The same stopped-angle reasoning applies to cosine.", "body": "For cosine with $k=0$, the output is $A\\cos\\phi+d$. The file then puts $\\phi=0$. Since $\\cos0=1$, its height is $A+d=1.1+0.35=1.45$. The angle is fixed, so this value stays the same for every input.", "math": ["y=A\\cos\\phi+d", "\\phi=0:\\quad y=1.1+0.35=1.45"], "why": "Sine and cosine have different values at angle zero, so their constant heights can differ even when the other controls agree.", "detail": "", "figure": {"type": "transform", "A": 1.1, "k": 0, "phi": 0, "d": 0.35, "angle": 0, "active": "constant", "fn": "cos", "knownControls": ["A", "k", "phi", "d"]}, "source": "lines4180–4224"}, {"id": "t47", "chapter": "c5", "title": "A constant has no smallest positive period", "connect": "A horizontal line repeats after every horizontal movement.", "body": "Move a constant graph by $1$, $0.1$, or $0.001$ input units: it looks unchanged. Any proposed positive period can be halved and the graph still repeats. Therefore there is <b>no least positive period<\/b>. The usual formula $2\\pi/|k|$ is for nonconstant waves.", "math": ["f(x+T)=f(x)\\quad\\text{for every }T>0"], "why": "A period must be a positive repeat distance; a fundamental period is the smallest such distance. A constant has no smallest one.", "detail": "", "figure": {"type": "transform", "A": 1.1, "k": 0, "phi": 0, "d": 0.35, "angle": 30, "active": "constant", "fn": "sin", "knownControls": ["A", "k", "phi", "d"]}, "source": "lines4180–4224"}, {"id": "t48", "chapter": "c5", "title": "A negative turning multiplier reverses the motion", "connect": "Let the circle turn again, this time with k = −1.", "body": "With $\\theta=-x$, increasing the input decreases the angle. The spoke turns clockwise. A chosen phase now appears at the input $x=-\\theta$, so the usual landmarks appear in reversed horizontal order. The repeat distance stays positive: one complete clockwise turn still takes $2\\pi$ input units.", "math": ["x=\\frac{\\theta-\\phi}{k}", "T=\\frac{2\\pi}{|k|}"], "why": "The sign of k determines direction; its magnitude determines the size of the input interval required for a full turn.", "detail": "", "figure": {"type": "transform", "A": 1.1, "k": -1, "phi": 0, "d": 0.35, "angle": 90, "active": "reverse", "fn": "sin", "knownControls": ["A", "k", "phi", "d"]}, "source": "lines4180–4224"}, {"id": "t49", "chapter": "c5", "title": "Keep the conditions attached to the formulas", "connect": "All four controls are now accounted for, including zero and negative values.", "body": "For a nonconstant sine or cosine, $A\\ne0$ and $k\\ne0$. Its amplitude is $|A|$, period is $2\\pi/|k|$, and midline is $d$. Its full-input range runs from $d-|A|$ to $d+|A|$. A restricted input interval may show only part of that full range.", "math": ["T=\\frac{2\\pi}{|k|}\\quad(A\\ne0,\\ k\\ne0)", "\\text{midline }y=d,\\quad\\text{amplitude }|A|"], "why": "Stating the conditions prevents us from applying a division formula to a constant case or assuming a short interval reaches every height.", "detail": "The final sine slider state in the file is −1.1 sin(1.3x+0.4)+0.35. It has amplitude1.1, midline0.35, full range[−0.75,1.45], period20π/13 and phase-zero input−4/13. These are the same rules applied to another set of control values.", "figure": {"type": "transform", "A": -1.1, "k": 1.3, "phi": 0.4, "d": 0.35, "angle": 90, "active": "all", "fn": "sin", "knownControls": ["A", "k", "phi", "d"]}, "source": "lines4149–4224"}, {"id": "i01", "chapter": "c6", "title": "Sketch the actual example in the file", "connect": "We now use the transformation ideas to draw a complete curve.", "body": "The file draws this sine wave. There are two changes to the ordinary sine graph: subtract $0.3$ from the input before taking sine, then add $0.1$ to the resulting height. We will build its graph from five measured circle positions.", "math": ["y=\\sin(x-0.3)+0.1"], "why": "Five known circle positions give reliable points, so we do not need to guess the shape.", "detail": "<p>The source writes the same decimals as fractions: $0.3=3/10$ and $0.1=1/10$. The curve is smooth between landmarks; the landmarks are not joined by straight line segments.<\/p>", "figure": {"type": "graph", "fn": "sin", "A": 1, "k": 1, "phi": -0.3, "d": 0.1, "xmin": -0.3, "xmax": 7, "ymin": -1.3, "ymax": 1.4}, "source": "Lines 4902–4967"}, {"id": "i02", "chapter": "c6", "title": "The input and the turning angle are different", "connect": "First identify what goes into sine.", "body": "The graph input is called $x$. The circle turns through $x-0.3$, so we give that turning angle the name $\\theta$ (theta). For example, when $x=0.3$, the circle receives $0$ and points straight right. Keep these two roles separate.", "math": ["\\theta=x-0.3"], "why": "Naming the inside angle lets us use circle positions whose sine values we already know.", "detail": "", "figure": {"type": "unit", "angle": 0, "focus": "y"}, "source": "Lines 4902–4967"}, {"id": "i03", "chapter": "c6", "title": "Which input puts the circle at its start?", "connect": "The starting circle position means its turning angle is zero.", "body": "Set the inside angle equal to zero. We want $x-0.3=0$. Add $0.3$ to both sides to undo the subtraction. The starting point of this wave therefore occurs at input $0.3$, a little to the right of zero.", "math": ["x-0.3=0", "x=0.3"], "why": "We solve for the graph input that produces this particular circle angle.", "detail": "", "figure": {"type": "pointmap", "A": 1, "k": 1, "phi": -0.3, "d": 0.1, "angle": 0}, "source": "Lines 4902–4967"}, {"id": "i04", "chapter": "c6", "title": "What is the height at that input?", "connect": "We know the starting input; now find its output.", "body": "At angle zero the point on the unit circle has height zero, so $\\sin 0=0$. The formula then adds $0.1$. Our first plotted point is therefore $0.3$ across and $0.1$ up. The wave begins on its shifted middle line.", "math": ["y=0+0.1=0.1", "(x,y)=(0.3,0.1)"], "why": "A plotted point needs both an input and an output.", "detail": "", "figure": {"type": "graph", "fn": "sin", "A": 1, "k": 1, "phi": -0.3, "d": 0.1, "xmin": -0.3, "xmax": 7, "ymin": -1.3, "ymax": 1.4, "marks": [[0.3, 0.1]]}, "source": "Lines 4902–4967"}, {"id": "i05", "chapter": "c6", "title": "A quarter-turn gives the highest circle point", "connect": "Move the circle through a quarter of one full turn.", "body": "A full turn is $2\\pi$ radians, so a quarter-turn is $\\pi/2$. At this position the unit-circle height is $1$. To find where this happens on the graph, require $x-0.3=\\pi/2$ and add $0.3$ to both sides.", "math": ["x-0.3=\\frac{\\pi}{2}", "x=\\frac{\\pi}{2}+0.3"], "why": "The quarter-turn is a circle angle; solving the equation converts it into a graph input.", "detail": "", "figure": {"type": "pointmap", "A": 1, "k": 1, "phi": -0.3, "d": 0.1, "angle": 90}, "source": "Lines 4902–4967"}, {"id": "i06", "chapter": "c6", "title": "The top height is 1.1", "connect": "The circle supplies height one, and the formula still adds 0.1.", "body": "Use the same output rule as before. At the quarter-turn, sine contributes $1$. Adding the vertical shift gives $1.1$. This point is exactly one unit above the middle line $y=0.1$. It is the top of this particular wave.", "math": ["y=1+0.1=1.1", "(x,y)=\\left(\\frac{\\pi}{2}+0.3,1.1\\right)"], "why": "The vertical shift moves every height by the same amount.", "detail": "", "figure": {"type": "graph", "fn": "sin", "A": 1, "k": 1, "phi": -0.3, "d": 0.1, "xmin": -0.3, "xmax": 7, "ymin": -1.3, "ymax": 1.4, "marks": [[0.3, 0.1], [1.8707963267948966, 1.1]]}, "source": "Lines 4902–4967"}, {"id": "i07", "chapter": "c6", "title": "Half a turn returns to the middle line", "connect": "Continue turning from the top towards the left.", "body": "At half a turn, the circle angle is $\\pi$ and its point lies straight left. Its height is zero again. The graph input is $\\pi+0.3$, and the graph output is $0+0.1$. The wave crosses its middle line while travelling down.", "math": ["x=\\pi+0.3", "y=0.1"], "why": "The circle is in a different direction but has the same height.", "detail": "", "figure": {"type": "pointmap", "A": 1, "k": 1, "phi": -0.3, "d": 0.1, "angle": 180}, "source": "Lines 4902–4967"}, {"id": "i08", "chapter": "c6", "title": "Three-quarters of a turn gives the bottom", "connect": "Continue until the circle point is directly below its centre.", "body": "The circle angle is now $3\\pi/2$ and its signed height is $-1$. Adding $0.1$ moves that output upwards to $-0.9$. The corresponding graph input is $3\\pi/2+0.3$. This point is one unit below the middle line.", "math": ["x=\\frac{3\\pi}{2}+0.3", "y=-1+0.1=-0.9"], "why": "A negative circle height means below the centre; adding a positive shift still moves it upwards.", "detail": "", "figure": {"type": "pointmap", "A": 1, "k": 1, "phi": -0.3, "d": 0.1, "angle": 270}, "source": "Lines 4902–4967"}, {"id": "i09", "chapter": "c6", "title": "One full turn completes the cycle", "connect": "The circle now returns to the direction where it started.", "body": "At $2\\pi$ the circle point is straight right again and its height is zero. Plot the fifth point at input $2\\pi+0.3$ and output $0.1$. The next turn repeats the same sequence. The horizontal length of one cycle is still $2\\pi$.", "math": ["(x,y)=(2\\pi+0.3,0.1)", "(2\\pi+0.3)-0.3=2\\pi"], "why": "Returning to the same direction explains why the graph repeats.", "detail": "", "figure": {"type": "graph", "fn": "sin", "A": 1, "k": 1, "phi": -0.3, "d": 0.1, "xmin": -0.3, "xmax": 7, "ymin": -1.3, "ymax": 1.4, "marks": [[0.3, 0.1], [1.8707963267948966, 1.1], [3.441592653589793, 0.1], [5.012388980384689, -0.9], [6.583185307179586, 0.1]]}, "source": "Lines 4902–4967"}, {"id": "i10", "chapter": "c6", "title": "The same method works for any transformed sine wave", "connect": "Only the rules connecting circle angle and graph coordinates change.", "body": "For the general wave, the circle angle is $\\theta=kx+\\phi$. To find the graph input, subtract $\\phi$ from both sides, then divide by $k$. This division needs $k\\ne0$. The circle height is multiplied by $A$ and then shifted by $d$.", "math": ["x=\\frac{\\theta-\\phi}{k}\\quad(k\\ne0)", "y=d+A\\sin\\theta"], "why": "We solve the inside-angle equation backwards and apply the output changes forwards.", "detail": "<p>Use the same five circle angles: $0,\\pi/2,\\pi,3\\pi/2,2\\pi$. If $k$ is negative, their horizontal order reverses. If $A$ is negative, their above/below positions reverse.<\/p>", "figure": {"type": "pointmap", "A": 1, "k": 1, "phi": -0.3, "d": 0.1, "angle": 90}, "source": "Lines 4902–4967"}, {"id": "i11", "chapter": "c6", "title": "The general starting input and extreme heights", "connect": "Put the familiar circle measurements into the general recipe.", "body": "At circle angle zero, the graph input is $-\\phi/k$; this is the horizontal shift often called $h$. At the upper and lower circle points, sine is $1$ and $-1$, so the outputs are $d+A$ and $d-A$. A negative $A$ swaps which is higher.", "math": ["h=-\\frac{\\phi}{k}", "y=d+A\\quad\\text{or}\\quad y=d-A"], "why": "The formulas come from the same three circle positions, rather than new rules to memorise.", "detail": "<p>The entire output interval is $[d-|A|,d+|A|]$. Absolute value means the nonnegative size of $A$. For the source example, $A=1$, $k=1$, $\\phi=-0.3$, and $d=0.1$.<\/p>", "figure": {"type": "pointmap", "A": 1, "k": 1, "phi": -0.3, "d": 0.1, "angle": 270}, "source": "Lines 4902–4967"}, {"id": "i12", "chapter": "c6", "title": "One sine value can come from two angles", "connect": "Finding a height and finding an angle are different tasks.", "body": "Draw a horizontal line through height $1/2$ on the unit circle. It meets the circle twice: once at $30^\\circ$ and once at $150^\\circ$. Both points have the same vertical coordinate, so both angles have sine $1/2$.", "math": ["\\sin\\frac{\\pi}{6}=\\sin\\frac{5\\pi}{6}=\\frac12"], "why": "Sine measures height, so a horizontal line finds every direction with that height.", "detail": "", "figure": {"type": "families", "fn": "sin", "value": 0.5, "angle": 30, "mode": "circle"}, "source": "Lines 4969–5135"}, {"id": "i13", "chapter": "c6", "title": "Where does the second angle come from?", "connect": "The two points are mirror images across the vertical axis.", "body": "Call the first angle $\\alpha$ (alpha). The top half of the circle is $\\pi$ radians. The reflected point is $\\alpha$ short of that half-turn, so its angle is $\\pi-\\alpha$. Their heights match because reflection only changes the horizontal coordinate.", "math": ["\\sin(\\pi-\\alpha)=\\sin\\alpha"], "why": "Reflection explains the second angle; there is no need to guess it.", "detail": "", "figure": {"type": "families", "fn": "sin", "value": 0.5, "angle": 30, "mode": "circle"}, "source": "Lines 4969–5135"}, {"id": "i14", "chapter": "c6", "title": "Extra whole turns create more answers", "connect": "Returning to the same circle point preserves the sine value.", "body": "Start at angle $\\alpha$. Add one full turn, $2\\pi$, and you reach the same point. Subtract a full turn and you also reach that point. The symbol $n$ counts any number of whole turns, including zero and negative counts.", "math": ["\\ldots,\\alpha-2\\pi,\\alpha,\\alpha+2\\pi,\\ldots", "\\alpha+2n\\pi\\quad(n\\in\\mathbb Z)"], "why": "An integer count records all repetitions in one expression.", "detail": "<p>$n\\in\\mathbb Z$ means “$n$ is an integer”: $\\ldots,-2,-1,0,1,2,\\ldots$. Negative counts mean turns in the opposite direction. $n$ is not an extra unknown angle.<\/p>", "figure": {"type": "families", "fn": "sin", "value": 0.5, "angle": 30, "mode": "graph"}, "source": "Lines 4969–5135"}, {"id": "i15", "chapter": "c6", "title": "The first family of sine solutions", "connect": "Follow the original point around any number of complete turns.", "body": "If $\\sin\\alpha$ is the height we want, every angle in this first family works. For the example height $1/2$, the first angle is $\\pi/6$. Adding or subtracting full turns produces every repetition of that particular direction.", "math": ["x=\\alpha+2n\\pi", "x=\\frac{\\pi}{6}+2n\\pi"], "why": "The formula lists all copies of the first circle direction.", "detail": "", "figure": {"type": "families", "fn": "sin", "value": 0.5, "angle": 30, "mode": "graph"}, "source": "Lines 4969–5135"}, {"id": "i16", "chapter": "c6", "title": "The reflected point gives the second family", "connect": "The reflected direction repeats after whole turns too.", "body": "Begin instead at $\\pi-\\alpha$, then add $2n\\pi$. For sine equal to $1/2$, this starts at $5\\pi/6$. Both families are needed. If the allowed interval is $0\\le x\\le2\\pi$, only the two starting angles lie inside it.", "math": ["x=\\pi-\\alpha+2n\\pi", "x=\\frac{5\\pi}{6}+2n\\pi"], "why": "Each distinct circle direction supplies its own repeated family.", "detail": "<p>The complete statement is: if $\\sin x=\\sin\\alpha$, then $x=\\alpha+2n\\pi$ or $x=\\pi-\\alpha+2n\\pi$, with $n$ any integer. Check each candidate against a specified interval.<\/p>", "figure": {"type": "families", "fn": "sin", "value": 0.5, "angle": 30, "mode": "graph"}, "source": "Lines 4969–5135"}, {"id": "i17", "chapter": "c6", "title": "Sometimes the two sine answers merge", "connect": "Move the horizontal height line to the top of the circle.", "body": "At height $1$ the two intersection points meet. Here $\\alpha=\\pi/2$ and $\\pi-\\alpha=\\pi/2$, so both formulas describe the same answers. Count each answer once. Above height $1$, or below height $-1$, the line misses the circle and there is no real solution.", "math": ["\\sin x=1\\quad\\Longrightarrow\\quad x=\\frac{\\pi}{2}+2n\\pi"], "why": "The picture tells us when two families coincide and when no angle is possible.", "detail": "<p>At height $-1$, the families also coincide after whole-turn relabelling. Thus $\\sin x=-1$ has the single family $x=-\\pi/2+2n\\pi$.<\/p>", "figure": {"type": "families", "fn": "sin", "value": 1, "angle": 90, "mode": "circle"}, "source": "Lines 4969–5135"}, {"id": "i18", "chapter": "c6", "title": "Cosine asks for the same width", "connect": "Switch from vertical coordinate to horizontal coordinate.", "body": "Cosine measures the signed horizontal coordinate. Reflect a point across the horizontal axis: its angle changes from $\\alpha$ to $-\\alpha$, but its width stays the same. This gives the two cosine directions. The reflected height changes sign, which does not affect cosine.", "math": ["\\cos(-\\alpha)=\\cos\\alpha"], "why": "A vertical line through the circle finds points with the same cosine.", "detail": "", "figure": {"type": "families", "fn": "cos", "value": 0.5, "angle": 60, "mode": "circle"}, "source": "Lines 4969–5135"}, {"id": "i19", "chapter": "c6", "title": "Write both cosine families", "connect": "Now repeat each of those directions by whole turns.", "body": "The first cosine direction is $\\alpha$ and the other is $-\\alpha$. Add $2n\\pi$ to either one. The symbol $\\pm\\alpha$ is shorthand for these two choices. As with sine, the requested cosine value must be between $-1$ and $1$.", "math": ["x=\\alpha+2n\\pi\\quad\\text{or}\\quad x=-\\alpha+2n\\pi", "x=\\pm\\alpha+2n\\pi"], "why": "We combine reflection with full-turn repetition.", "detail": "<p>For $\\cos x=1/2$, choose $\\alpha=\\pi/3$. Within $[0,2\\pi]$, the answers are $\\pi/3$ and $5\\pi/3$. The second comes from $-\\pi/3+2\\pi$.<\/p>", "figure": {"type": "families", "fn": "cos", "value": 0.5, "angle": 60, "mode": "graph"}, "source": "Lines 4969–5135"}, {"id": "i20", "chapter": "c6", "title": "Tangent repeats after only half a turn", "connect": "Tangent measures slope, so compare opposite circle points.", "body": "After a half-turn, both the horizontal and vertical coordinates change sign. Dividing the new height by the new width cancels those two minus signs. The slope is unchanged. That is why tangent repeats after $\\pi$, rather than needing a full $2\\pi$ turn.", "math": ["\\frac{-\\sin\\alpha}{-\\cos\\alpha}=\\frac{\\sin\\alpha}{\\cos\\alpha}", "\\tan(\\alpha+\\pi)=\\tan\\alpha"], "why": "Opposite directions lie on the same straight line and have the same slope.", "detail": "", "figure": {"type": "families", "fn": "tan", "value": 1, "angle": 45, "mode": "circle"}, "source": "Lines 4969–5135"}, {"id": "i21", "chapter": "c6", "title": "All the tangent answers fit one family", "connect": "Repeat the same slope by any integer number of half-turns.", "body": "If $\\tan\\alpha$ is the required value, add $n\\pi$ to $\\alpha$. Here $n$ counts half-turns. For example, tangent equals $1$ at $\\pi/4$, then again at $5\\pi/4$. Vertical directions remain excluded because their horizontal coordinate is zero.", "math": ["x=\\alpha+n\\pi\\quad(n\\in\\mathbb Z)", "x\\ne\\frac{\\pi}{2}+n\\pi"], "why": "One valid direction and the half-turn repeat give every tangent solution.", "detail": "", "figure": {"type": "families", "fn": "tan", "value": 1, "angle": 45, "mode": "graph"}, "source": "Lines 4969–5135"}, {"id": "t50", "chapter": "c6", "title": "An interval tells us which inputs are allowed", "connect": "To solve or sketch on a limited part of a graph, first mark its allowed inputs.", "body": "The file selects inputs from $-2.2$ up to $2.2$. A filled dot means the endpoint is included. An empty dot means it is excluded. Here $-2.2$ is allowed, but $2.2$ is not. Every number between them is allowed.", "math": ["-2.2\\le x<2.2", "x\\in[-2.2,2.2)"], "why": "The inequalities and the endpoint dots say exactly the same thing. The interval is a set of inputs, not a new curve.", "detail": "", "figure": {"type": "interval", "l": -2.2, "r": 2.2, "k": 1, "phi": 0, "closedLeft": true, "closedRight": false, "stage": "input"}, "source": "lines4311–4466"}, {"id": "t51", "chapter": "c6", "title": "Name the two endpoints before using letters", "connect": "The picture already shows a left end and a right end.", "body": "Call the left endpoint $\\ell$, read “ell”, and the right endpoint $r$. In this example $\\ell=-2.2$ and $r=2.2$. The symbol $r$ now names an endpoint; it is not a circle radius. The bracket at the left means included; the curved bracket at the right means excluded.", "math": ["\\ell\\le x<r", "x\\in[\\ell,r)"], "why": "Naming the two visible endpoints lets us derive a rule that works for any interval with the same inclusion pattern.", "detail": "", "figure": {"type": "interval", "l": -2.2, "r": 2.2, "k": 1, "phi": 0, "closedLeft": true, "closedRight": false, "stage": "input", "showSymbols": true}, "source": "lines4311–4466"}, {"id": "t52", "chapter": "c6", "title": "Map the included left endpoint to an angle", "connect": "The graph input selects a circle angle through θ = kx + φ.", "body": "Use the file’s positive multiplier $k=1.4$ and starting angle $\\phi=0.6$. Put the left endpoint $x=-2.2$ into that rule. First multiply by $1.4$, then add $0.6$. Because the original endpoint is allowed, its resulting angle is allowed too.", "math": ["\\theta=1.4(-2.2)+0.6", "\\theta=-3.08+0.6=-2.48"], "why": "We apply the same input-to-angle calculation to an endpoint as to any other input.", "detail": "", "figure": {"type": "interval", "l": -2.2, "r": 2.2, "k": 1.4, "phi": 0.6, "closedLeft": true, "closedRight": false, "stage": "left"}, "source": "lines4311–4466"}, {"id": "t53", "chapter": "c6", "title": "Map the excluded right endpoint", "connect": "Keep the same angle rule and use the other end of the input interval.", "body": "At $x=2.2$, the angle would be $1.4(2.2)+0.6=3.68$. The word “would” matters: the original input $2.2$ is excluded. Its corresponding angle is the boundary approached from inside the interval, but that boundary is excluded too.", "math": ["\\theta=1.4(2.2)+0.6", "\\theta=3.08+0.6=3.68"], "why": "An excluded endpoint remains excluded when a nonzero linear rule maps it to another location.", "detail": "", "figure": {"type": "interval", "l": -2.2, "r": 2.2, "k": 1.4, "phi": 0.6, "closedLeft": true, "closedRight": false, "stage": "right"}, "source": "lines4311–4466"}, {"id": "t54", "chapter": "c6", "title": "A positive multiplier preserves left-to-right order", "connect": "We have now calculated both angle endpoints.", "body": "As x increases, multiplying by positive $1.4$ makes the angle increase. The input interval therefore becomes all angles from $-2.48$, included, up to $3.68$, excluded. Its length grew by a factor of $1.4$, and adding $0.6$ moved it without changing its length.", "math": ["-2.48\\le\\theta<3.68", "\\theta\\in[-2.48,3.68)"], "why": "Every input between the endpoints gives an angle between their images because this linear rule increases continuously.", "detail": "", "figure": {"type": "interval", "l": -2.2, "r": 2.2, "k": 1.4, "phi": 0.6, "closedLeft": true, "closedRight": false, "stage": "both"}, "source": "lines4311–4466"}, {"id": "t55", "chapter": "c6", "title": "Derive the general positive-multiplier interval", "connect": "Replace the numerical endpoint values by their names.", "body": "Start with $\\ell\\le x<r$. Multiplying all three parts by a positive number $k$ preserves their order. Add the same $\\phi$ to all three parts. The middle expression becomes $kx+\\phi$, which is exactly the angle $\\theta$.", "math": ["k\\ell+\\phi\\le kx+\\phi<kr+\\phi", "k\\ell+\\phi\\le\\theta<kr+\\phi\\quad(k>0)"], "why": "The operations are applied to the entire inequality, so all three positions on the ruler transform consistently.", "detail": "", "figure": {"type": "interval", "l": -2.2, "r": 2.2, "k": 1.4, "phi": 0.6, "closedLeft": true, "closedRight": false, "stage": "both", "showSymbols": true}, "source": "lines4311–4466"}, {"id": "t56", "chapter": "c6", "title": "Undo the angle-interval transformation", "connect": "The angle interval was made by multiplying, then adding.", "body": "To recover the original inputs, subtract the starting angle $\\phi$ from every angle. Then divide by the nonzero turning multiplier $k$. For $k=1.4$, this moves the interval back by $0.6$ and shrinks it by a factor of $1/1.4$, returning the original endpoints.", "math": ["x=\\frac{\\theta-\\phi}{k}", "\\frac{-2.48-0.6}{1.4}=-2.2"], "why": "Undo operations in reverse order. The endpoint dots move with their values throughout the reversal.", "detail": "", "figure": {"type": "interval", "l": -2.2, "r": 2.2, "k": 1.4, "phi": 0.6, "closedLeft": true, "closedRight": false, "stage": "undo"}, "source": "lines4311–4466"}, {"id": "t57", "chapter": "c6", "title": "A negative multiplier sends the left endpoint rightward", "connect": "Keep the original input interval and change the turning multiplier to −1.2.", "body": "The angle rule is now $\\theta=-1.2x+0.6$. The old left endpoint $x=-2.2$ gives angle $3.24$. This value is included because $-2.2$ was included. Notice that the original left endpoint has mapped to a positive angle on the right side of the angle ruler.", "math": ["\\theta=-1.2(-2.2)+0.6", "\\theta=2.64+0.6=3.24"], "why": "Multiplication by a negative number reverses order on a number line; it does not change whether a permitted endpoint is included.", "detail": "", "figure": {"type": "interval", "l": -2.2, "r": 2.2, "k": -1.2, "phi": 0.6, "closedLeft": true, "closedRight": false, "stage": "left"}, "source": "lines4311–4466"}, {"id": "t58", "chapter": "c6", "title": "The old right endpoint moves to the left", "connect": "Apply the same negative-multiplier rule to x = 2.2.", "body": "The other endpoint gives $-1.2(2.2)+0.6=-2.04$. That original endpoint was excluded, so this angle is excluded. It is now the lower angle endpoint. The two endpoints exchanged positions, but each kept its own filled or empty marker.", "math": ["\\theta=-1.2(2.2)+0.6", "\\theta=-2.64+0.6=-2.04"], "why": "Inclusion belongs to a particular endpoint value. It is not permanently attached to the left or right side of the page.", "detail": "", "figure": {"type": "interval", "l": -2.2, "r": 2.2, "k": -1.2, "phi": 0.6, "closedLeft": true, "closedRight": false, "stage": "right"}, "source": "lines4311–4466"}, {"id": "t59", "chapter": "c6", "title": "Write the negative-multiplier image in increasing order", "connect": "The smaller angle is excluded and the larger angle is included.", "body": "List the interval from its smaller value to its larger value: $-2.04$ first, then $3.24$. The lower end is empty and the upper end is filled. So the curved bracket is now on the left, and the square bracket is now on the right.", "math": ["-2.04<\\theta\\le3.24", "\\theta\\in(-2.04,3.24]"], "why": "Writing intervals in increasing order makes their position and width easy to read even when the mapping reversed direction.", "detail": "", "figure": {"type": "interval", "l": -2.2, "r": 2.2, "k": -1.2, "phi": 0.6, "closedLeft": true, "closedRight": false, "stage": "both"}, "source": "lines4311–4466"}, {"id": "t60", "chapter": "c6", "title": "Derive the general negative-multiplier rule", "connect": "The same reversal happens for every negative k.", "body": "When $k<0$, the old right endpoint $r$ becomes the smaller angle $kr+\\phi$, and stays excluded. The old left endpoint $\\ell$ becomes the larger angle $k\\ell+\\phi$, and stays included. This gives the general transformed interval directly from the two endpoint images.", "math": ["kr+\\phi<\\theta\\le k\\ell+\\phi\\quad(k<0)"], "why": "This is the geometric reason an inequality reverses when multiplied by a negative number: its values reverse order on the ruler.", "detail": "", "figure": {"type": "interval", "l": -2.2, "r": 2.2, "k": -1.2, "phi": 0.6, "closedLeft": true, "closedRight": false, "stage": "both", "showSymbols": true}, "source": "lines4311–4466"}, {"id": "t61", "chapter": "c6", "title": "A zero multiplier collapses an interval to one angle", "connect": "There is one final boundary case before using these rules in equations.", "body": "If $k=0$, then $\\theta=0x+\\phi=\\phi$ for every allowed input. The whole nonempty interval maps to the single angle $\\phi$. It no longer stretches into a longer interval, and there is no inverse division by $k$. The output graph is constant, just as we found earlier.", "math": ["k=0\\quad\\Rightarrow\\quad\\theta=\\phi"], "why": "We check zero separately because multiplying by zero destroys the information needed to recover a unique input.", "detail": "This boundary case completes the interval rule. The source animates positive and negative multipliers; its separate constant-wave section explains why the zero case cannot use x=(θ−φ)/k.", "figure": {"type": "interval", "l": -2.2, "r": 2.2, "k": 0, "phi": 0.6, "closedLeft": true, "closedRight": false, "stage": "both"}, "source": "lines4311–4466"}, {"id": "i22", "chapter": "c6", "title": "A product can become zero in two ways", "connect": "The next part of the file multiplies two trig measurements.", "body": "Imagine a rectangle with one side representing $F(x)$ and another representing $G(x)$. Its area becomes zero if either side collapses to zero. This picture suggests the zero-product rule: the first factor can be zero, or the second factor can be zero.", "math": ["F(x)G(x)=0"], "why": "We separate the two possibilities before doing any division.", "detail": "<p>The rectangle illustrates positive factors. The algebraic rule also works for negative real factors: if neither factor is zero, their product cannot be zero.<\/p>", "figure": {"type": "product", "a": 0.8, "b": 0.6}, "source": "Lines 4468–4500"}, {"id": "i23", "chapter": "c6", "title": "Why both possibilities must be kept", "connect": "Check the rule without relying only on the rectangle.", "body": "If $F(x)=0$, the product is already zero. If $F(x)\\ne0$, we may divide the product equation by $F(x)$, which then gives $G(x)=0$. These two cases cover every possibility. Dividing immediately would wrongly discard the first case.", "math": ["F(x)G(x)=0", "F(x)=0\\quad\\text{or}\\quad G(x)=0"], "why": "Division is valid only after checking that the divisor is not zero.", "detail": "", "figure": {"type": "product", "a": 0, "b": 0.6}, "source": "Lines 4468–4500"}, {"id": "i24", "chapter": "c6", "title": "Apply that rule to sine times cosine", "connect": "In the file, the two factors are sine and cosine.", "body": "The product $\\sin x\\cos x$ is zero when sine is zero or when cosine is zero. On the circle, those are the horizontal-axis points or the vertical-axis points. Together they occur every quarter-turn. Dividing by sine at the start would lose the horizontal-axis answers.", "math": ["x=n\\pi\\quad\\text{or}\\quad x=\\frac{\\pi}{2}+n\\pi", "x=\\frac{n\\pi}{2}\\quad(n\\in\\mathbb Z)"], "why": "Solve each factor separately, then combine the answers without duplicates.", "detail": "", "figure": {"type": "unit", "angle": 90, "focus": "signs"}, "source": "Lines 4468–4500"}, {"id": "i25", "chapter": "c7", "title": "First, remember the forward measurement", "connect": "We can now reverse a trig question carefully.", "body": "For sine, the input is an angle and the output is a height. At a $30^\\circ$ angle, or $\\pi/6$ radians, the unit-circle point has height $1/2$. This is the forward calculation. Keep the angle and the measured height visibly separate.", "math": ["\\sin\\frac{\\pi}{6}=\\frac12"], "why": "Understanding the forward direction makes the reversed question meaningful.", "detail": "", "figure": {"type": "unit", "angle": 30, "focus": "y"}, "source": "Lines 5138–5327"}, {"id": "i26", "chapter": "c7", "title": "Now give the height and ask for the angle", "connect": "Reverse what is given and what must be found.", "body": "Suppose the given measurement is $1/2$ and we want an angle with that sine. There is an immediate problem: both $30^\\circ$ and $150^\\circ$ work, plus their whole-turn repetitions. A function needs a single specified output for each input, so we must choose one allowed part of the circle.", "math": ["\\sin\\theta=\\frac12"], "why": "The inverse needs a selection rule because the original measurement repeats.", "detail": "", "figure": {"type": "families", "fn": "sin", "value": 0.5, "angle": 30, "mode": "circle"}, "source": "Lines 5138–5327"}, {"id": "i27", "chapter": "c7", "title": "Arcsine chooses the right semicircle", "connect": "Highlight the allowed angles before naming the inverse.", "body": "The standard choice for inverse sine is the right half of the circle, from $-90^\\circ$ to $90^\\circ$. As the point moves through this half, its height increases from $-1$ to $1$ without repeating. Every allowed height now identifies exactly one angle.", "math": ["-\\frac{\\pi}{2}\\le\\theta\\le\\frac{\\pi}{2}"], "why": "Restricting the angles removes the ambiguity while retaining every possible sine height.", "detail": "<p>This is the standard branch choice. Other restricted branches could define other inverse choices, but the usual calculator uses this one.<\/p>", "figure": {"type": "inverse", "fn": "sin", "value": 0.5, "mode": "branch"}, "source": "Lines 5138–5327"}, {"id": "i28", "chapter": "c7", "title": "The name arcsine means this chosen angle", "connect": "The branch has made the reverse question single-valued.", "body": "We write $\\arcsin z$ for the angle on that selected half whose sine is $z$. The letter $z$ names the given height; it is not an angle here. For height $1/2$, the selected angle is $\\pi/6$, because $5\\pi/6$ lies outside the allowed half.", "math": ["\\theta=\\arcsin z", "\\arcsin\\frac12=\\frac{\\pi}{6}"], "why": "The notation names the reverse measurement together with its branch choice.", "detail": "", "figure": {"type": "inverse", "fn": "sin", "value": 0.5, "mode": "branch"}, "source": "Lines 5138–5327"}, {"id": "i29", "chapter": "c7", "title": "Arcsine has an input range and an output range", "connect": "Read the two limits from the same circle picture.", "body": "Its input is a height, so it must lie between $-1$ and $1$. Its output is a chosen angle, so it lies between $-\\pi/2$ and $\\pi/2$. These are different limits on different quantities. A circle of radius one cannot supply a height such as $2$.", "math": ["-1\\le z\\le1", "-\\frac{\\pi}{2}\\le\\arcsin z\\le\\frac{\\pi}{2}"], "why": "The circle restricts possible measurements; the selected branch restricts returned angles.", "detail": "", "figure": {"type": "inverse", "fn": "sin", "value": 0.75, "mode": "branch"}, "source": "Lines 5138–5327"}, {"id": "i30", "chapter": "c7", "title": "Included endpoints are shown with closed brackets", "connect": "The top and bottom of the circle are valid sine positions.", "body": "Height $1$ gives angle $\\pi/2$, and height $-1$ gives angle $-\\pi/2$. We include both endpoints. Square brackets mean “include this endpoint”, so the input interval is $[-1,1]$ and the output interval is $[-\\pi/2,\\pi/2]$.", "math": ["\\arcsin(1)=\\frac{\\pi}{2}", "\\arcsin(-1)=-\\frac{\\pi}{2}"], "why": "Endpoint notation records whether an exact boundary value is allowed.", "detail": "", "figure": {"type": "inverse", "fn": "sin", "value": 1, "mode": "branch"}, "source": "Lines 5138–5327"}, {"id": "i31", "chapter": "c7", "title": "Arccosine selects the upper semicircle", "connect": "Reverse the horizontal measurement instead of the vertical one.", "body": "Cosine measures signed width. On the upper semicircle, angles run from $0$ to $\\pi$ while width decreases from $1$ to $-1$ without repeating. This is the standard arccosine branch. For example, width $1/2$ gives angle $\\pi/3$.", "math": ["-1\\le z\\le1", "0\\le\\arccos z\\le\\pi"], "why": "The upper half supplies exactly one chosen angle for each possible cosine value.", "detail": "<p>The endpoints are included: $\\arccos(1)=0$ and $\\arccos(-1)=\\pi$. A negative width is allowed; for instance $\\arccos(-1/2)=2\\pi/3$.<\/p>", "figure": {"type": "inverse", "fn": "cos", "value": 0.5, "mode": "branch"}, "source": "Lines 5138–5327"}, {"id": "i32", "chapter": "c7", "title": "Arctangent uses the right half without its endpoints", "connect": "The measurement being reversed is now slope.", "body": "On the right half, the horizontal run is positive. The slope can be negative, zero or positive, and it never repeats as the angle increases. At the top and bottom endpoints the run is zero, so tangent is undefined. Those endpoints must be excluded.", "math": ["-\\frac{\\pi}{2}<\\arctan z<\\frac{\\pi}{2}"], "why": "We choose a branch with one angle per slope and remove its vertical directions.", "detail": "", "figure": {"type": "inverse", "fn": "tan", "value": 1, "mode": "branch"}, "source": "Lines 5138–5327"}, {"id": "i33", "chapter": "c7", "title": "Arctangent accepts every real number", "connect": "A finite slope can be as steep as we want.", "body": "Any real number can be a slope: $-2.5$, $0$, $1/2$, or a very large value. The notation $z\\in\\mathbb R$ means “$z$ is a real number”. Round interval brackets exclude endpoints, so the arctangent output interval is $(-\\pi/2,\\pi/2)$.", "math": ["z\\in\\mathbb R", "\\arctan z\\in\\left(-\\frac{\\pi}{2},\\frac{\\pi}{2}\\right)"], "why": "A finite slope always has a nonvertical direction on the chosen half.", "detail": "<p>$\\arctan(0)=0$. As the input becomes increasingly positive, the output approaches $\\pi/2$ but never reaches it for a finite input. Increasingly negative inputs approach $-\\pi/2$.<\/p>", "figure": {"type": "inverse", "fn": "tan", "value": -2.5, "mode": "branch"}, "source": "Lines 5138–5327"}, {"id": "i34", "chapter": "c7", "title": "Inverse and reciprocal do different jobs", "connect": "Both operations can start from the same sine measurement.", "body": "From $\\sin(\\pi/6)=1/2$, the inverse asks which angle gives that height; it returns $\\pi/6$. The reciprocal instead divides one by the height; it returns $2$. Arcsine changes a measurement back into an angle. Cosecant takes the reciprocal of sine.", "math": ["\\arcsin\\left(\\frac12\\right)=\\frac{\\pi}{6}", "\\csc\\frac{\\pi}{6}=\\frac{1}{1/2}=2"], "why": "These operations answer different questions and must not be interchanged.", "detail": "<p>Calculators often write inverse sine as $\\sin^{-1}z$. In that notation the superscript does not mean the reciprocal $1/\\sin z$. We use $\\arcsin$ here to make the distinction clear.<\/p>", "figure": {"type": "inverse", "fn": "sin", "value": 0.5, "mode": "branch"}, "source": "Lines 5138–5327"}, {"id": "i35", "chapter": "c7", "title": "A graph point lists input first, output second", "connect": "Record the forward sine measurement as coordinates.", "body": "On the sine graph, the point $(\\pi/6,1/2)$ means “input angle $\\pi/6$, output height $1/2$”. Reverse the question and the coordinates switch places: the inverse graph has point $(1/2,\\pi/6)$. The old output becomes the new input.", "math": ["(\\theta,z)\\longmapsto(z,\\theta)"], "why": "Reversing the measurement swaps the two coordinate roles.", "detail": "", "figure": {"type": "inverse", "fn": "sin", "value": 0.5, "mode": "reflect"}, "source": "Lines 5329–5481"}, {"id": "i36", "chapter": "c7", "title": "Swapping coordinates reflects the graph", "connect": "Do the same swap for every point on the selected branch.", "body": "A point that is two units across and one unit up moves to one across and two up. This is a reflection across the diagonal where both coordinates are equal. With equal scales on the axes, that diagonal is the line $y=x$.", "math": ["(a,b)\\longmapsto(b,a)"], "why": "Coordinate swapping is a geometric reflection, so it gives the whole inverse graph.", "detail": "<p>We reflect only the selected one-to-one branch, not the complete repeating sine graph. Otherwise one input height would still correspond to several output angles.<\/p>", "figure": {"type": "inverse", "fn": "sin", "value": 0.5, "mode": "reflect"}, "source": "Lines 5329–5481"}, {"id": "i37", "chapter": "c7", "title": "The inverse graph has an angle on its vertical axis", "connect": "A graph height can represent any numerical output, including an angle.", "body": "The new horizontal input is the measured value $z$. The new vertical output is the angle $\\theta$ in radians. On a unit circle, the corresponding arc length equals that radian number. Unwrapping this arc gives a straight ruler for the angle output.", "math": ["\\theta=\\arcsin z"], "why": "Unwrapping the arc explains how the angle can be drawn as a vertical numerical measurement.", "detail": "<p>Do not confuse the arc with the circle point’s vertical projection. The projection is $\\sin\\theta$; the unit-circle arc length is $\\theta$ radians. They are different measurements.<\/p>", "figure": {"type": "inverse", "fn": "sin", "value": 0.65, "mode": "reflect"}, "source": "Lines 5329–5481"}, {"id": "i38", "chapter": "c7", "title": "The same reflection gives all three inverse graphs", "connect": "Keep the coordinate-swap rule and change the measurement.", "body": "Restrict cosine to its upper-half branch and reflect its graph to obtain arccosine. Restrict tangent between its two vertical directions and reflect to obtain arctangent. The tangent’s vertical asymptotes become horizontal limits at $\\pm\\pi/2$ on the arctangent graph.", "math": ["\\theta=\\arctan z"], "why": "An inverse always exchanges input and output, regardless of which trig measurement is used.", "detail": "<p>Arcsine runs from $(-1,-\\pi/2)$ to $(1,\\pi/2)$. Arccosine runs from $(-1,\\pi)$ to $(1,0)$. Both include their endpoints. Arctangent is defined at every real input but never reaches either horizontal limiting angle.<\/p>", "figure": {"type": "graph", "fn": "atan", "xmin": -5, "xmax": 5, "ymin": -1.9, "ymax": 1.9}, "source": "Lines 5329–5481"}, {"id": "i39", "chapter": "c7", "title": "Sine after arcsine returns the input height", "connect": "First choose the angle, then measure its height again.", "body": "Let $\\theta=\\arcsin z$. This definition says that $\\theta$ is the selected angle whose sine is $z$. Taking sine of that selected angle therefore returns $z$. We substitute the angle’s name into $\\sin\\theta=z$ to obtain the composition formula.", "math": ["\\theta=\\arcsin z\\quad\\Longrightarrow\\quad\\sin\\theta=z", "\\sin(\\arcsin z)=z\\quad(-1\\le z\\le1)"], "why": "The two operations reverse one another for every allowed input height.", "detail": "", "figure": {"type": "inverse", "fn": "sin", "value": 0.65, "mode": "compose", "order": "inverse-first"}, "source": "Lines 5329–5481"}, {"id": "i40", "chapter": "c7", "title": "Cosine after arccosine also returns the input", "connect": "Use exactly the same definition with width instead of height.", "body": "Arccosine chooses the upper-half angle whose cosine equals the supplied width $z$. Measuring cosine at that chosen angle must return the original width. This works for every $z$ from $-1$ to $1$, including negative widths and both endpoints.", "math": ["\\cos(\\arccos z)=z\\quad(-1\\le z\\le1)"], "why": "The chosen angle was defined by this very width measurement.", "detail": "", "figure": {"type": "inverse", "fn": "cos", "value": -0.65, "mode": "compose", "order": "inverse-first"}, "source": "Lines 5329–5481"}, {"id": "i41", "chapter": "c7", "title": "Tangent after arctangent returns any real slope", "connect": "This time the input is a slope rather than a bounded projection.", "body": "Arctangent chooses the nonvertical right-half angle with slope $z$. Taking tangent of that angle measures the same slope again. Every finite real $z$ is allowed. No input restriction to $[-1,1]$ is needed, because slopes can have any real size.", "math": ["\\tan(\\arctan z)=z\\quad(z\\in\\mathbb R)"], "why": "The inverse slope measurem
